<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.V.A.T. & ELAWS - Écosystème Souverain & Objectifs de Vie</title>
    
    <link rel="manifest" href="data:application/manifest+json,{
        'name': 'E.V.A.T. & ELAWS',
        'short_name': 'EVAT',
        'start_url': '.',
        'display': 'standalone',
        'background_color': '#0b0f19',
        'theme_color': '#059669',
        'icons': [{
            'src': 'https://img.icons8.com/color/192/000000/artificial-intelligence.png',
            'sizes': '192x192',
            'type': 'image/png'
        }]
    }">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #34d399;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --accent: #059669;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        [data-theme="eco"] {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #22c55e;
            --text-secondary: #15803d;
            --accent: #22c55e;
            --accent-gradient: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            --border-color: #14532d;
            --shadow: 0 0 15px rgba(34, 197, 94, 0.15);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 80px;
            transition: background 0.4s ease, color 0.4s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .menu-toggle {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s;
        }
        .menu-toggle:hover { transform: scale(1.05); }
        .title { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .btn-top {
            background-color: var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s;
        }
        .badge-info {
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 15px;
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bottom-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }
        .bar-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .bar-item span.icon { font-size: 18px; }
        .bar-item.active, .bar-item:hover { color: var(--accent); }

        #toastNotification {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            font-size: 13px;
            font-weight: 700;
            z-index: 1000;
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90%;
            text-align: center;
        }
        #toastNotification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .sidebar {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
        }
        .sidebar.open { display: block; }
        .sidebar h3 { font-size: 0.95rem; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        .menu-item {
            background: rgba(16, 185, 129, 0.08);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: none;
            width: 100%;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .menu-item:hover { background: rgba(16, 185, 129, 0.18); transform: translateX(4px); }
        .module-container { flex: 1; max-width: 750px; width: 100%; margin: 0 auto; }
        .card {
            background-color: var(--card-bg);
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease;
        }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-top: 0; margin-bottom: 10px; }
        .text { font-size: 14px; color: var(--text-secondary); margin-bottom: 15px; line-height: 1.6; }
        .grid-metiers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .metier-card-widget {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .metier-card-widget:hover { border-color: var(--accent); transform: translateY(-2px); }
        .metier-card-widget.active { border-color: var(--accent); background: rgba(5, 150, 105, 0.15); box-shadow: 0 0 10px rgba(5,150,105,0.2); }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .input {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 11px;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input:focus { border-color: var(--accent); }
        select.input { width: 100%; margin-bottom: 10px; }
        textarea.input { resize: vertical; min-height: 80px; }
        .btn-action {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-action:hover { transform: translateY(-1px); opacity: 0.95; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body data-theme="dark">

    <div id="toastNotification">✨ <span id="toastText">Action exécutée</span></div>

    <header>
        <div class="header-left">
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            <div class="title">✨ E.V.A.T. & ELAWS</div>
        </div>
        <div class="header-right">
            <button class="btn-top" onclick="changerTheme()">🎨 Thème</button>
            <button class="btn-top" onclick="changerLangue()">🌐 Langue</button>
        </div>
    </header>

    <div class="badge-info">🌍 Écosystème Intégral : Gestionnaire d'Objectifs & Autonomie</div>

    <div id="installBanner" class="card" style="display:none; border-color:var(--accent); background:rgba(5,150,105,0.12);">
        <h3 class="card-title" style="color:var(--accent);">📲 Installer E.V.A.T. & ELAWS</h3>
        <p class="text">Installez l'application instantanément sur votre support en un clic !</p>
        <button class="btn-action" id="btnInstallApp">Installer l'Application</button>
    </div>

    <div id="sideMenu" class="sidebar">
        <h3>📂 Navigation Globale E.V.A.T.</h3>
        <button class="menu-item" onclick="switchTab('accueil')">🏠 Accueil & Profils</button>
        <button class="menu-item" onclick="switchTab('objectifs')">🎯 Gestionnaire d'Objectifs & Vie</button>
        <button class="menu-item" onclick="switchTab('notes')">📓 Journal de Bord & Notes</button>
        <button class="menu-item" onclick="switchTab('factures')">🧾 Reçus & Factures</button>
        <button class="menu-item" onclick="switchTab('sauvegarde')">💾 Sauvegarde & Restauration (JSON)</button>
        <button class="menu-item" onclick="switchTab('dossiers')">📁 Assistant Visas & Séjour</button>
        <button class="menu-item" onclick="switchTab('convertisseur')">💱 Convertisseur de Devises</button>
        <button class="menu-item" onclick="switchTab('traduction')">🗣️ Pont de Traduction (ELAWS)</button>
        <button class="menu-item" onclick="switchTab('carnet')">📝 Carnet de Commandes</button>
        <button class="menu-item" onclick="switchTab('gps')">🧭 Géolocalisation & GPS</button>
        <button class="menu-item" onclick="switchTab('economie')">🪙 Finances & Caisse</button>
        <button class="menu-item" onclick="switchTab('camera')">📸 Caméra & Documents</button>
        <button class="menu-item" onclick="switchTab('securite')">🛡️ Sécurité & Chiffrement</button>
        <button class="menu-item" onclick="switchTab('ia')">🤖 Assistant ELAWS AI</button>
    </div>

    <div class="module-container" id="mainContent"></div>

    <div class="bottom-action-bar">
        <button class="bar-item active" onclick="switchTab('accueil')" id="barAccueil">
            <span class="icon">🌍</span><span>Profil</span>
        </button>
        <button class="bar-item" onclick="switchTab('objectifs')" id="barObj">
            <span class="icon">🎯</span><span>Objectifs</span>
        </button>
        <button class="bar-item" onclick="switchTab('notes')" id="barNotes">
            <span class="icon">📓</span><span>Notes</span>
        </button>
        <button class="bar-item" onclick="switchTab('factures')" id="barFactures">
            <span class="icon">🧾</span><span>Factures</span>
        </button>
        <button class="bar-item" onclick="switchTab('sauvegarde')" id="barSauv">
            <span class="icon">💾</span><span>Backup</span>
        </button>
    </div>

    <script>
        let activeTab = 'accueil';
        
        let utilisateur = JSON.parse(localStorage.getItem('evat_utilisateur')) || {
            nom: 'Eric Lawson',
            nationalite: 'Togolais',
            paysActuel: 'Togo (Lomé)',
            langueMaternelle: 'Éwé / Français'
        };

        let listeMetiers = JSON.parse(localStorage.getItem('evat_metiers')) || [
            { nom: 'Conducteur / Chauffeur', icone: '🚕', desc: 'GPS & Transport' },
            { nom: 'Agriculteur', icone: '🌾', desc: 'Récoltes & Sols' },
            { nom: 'Artisan / Entrepreneur', icone: '✂️', desc: 'Devis & Commerce' },
            { nom: 'Explorateur / Voyageur', icone: '🌍', desc: 'Mobilité Globale' }
        ];
        let metierActif = localStorage.getItem('evat_metier_actif') || 'Conducteur / Chauffeur';
        
        // Gestionnaire d'objectifs de vie
        let objectifsVie = JSON.parse(localStorage.getItem('evat_objectifs')) || [
            { id: 1, categorie: "Finances & Business", titre: "Établir l'autonomie et structurer la caisse", statut: "En cours" },
            { id: 2, categorie: "Mobilité & Papiers", titre: "Préparer les dossiers consulaires et passeport", statut: "À planifier" }
        ];

        let journalNotes = JSON.parse(localStorage.getItem('evat_notes')) || [
            { id: 1, titre: "Rappel Consulat", texte: "Vérifier la validité des pièces justificatives.", date: "2026-10-27" }
        ];

        let soldeCaisse = parseFloat(localStorage.getItem('evat_solde')) || 45200;
        let gpsStatus = "📍 Prêt pour la géolocalisation universelle.";
        let etatSynchro = "🟢 Données souveraines et sécurisées localement (AES-256).";
        let analysisResult = "Aucune image scannée. Prenez une photo pour lancer l'analyse ELAWS.";
        let capturedImageSrc = null;

        let carnetCommandes = JSON.parse(localStorage.getItem('evat_carnet')) || [
            { id: 1, client: "Koffi Mensah", detail: "Mission locale (Lomé)", montant: 2500, devise: "FCFA", statut: "Terminé" }
        ];

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            const text = document.getElementById('toastText');
            text.innerHTML = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').style.display = 'block';
        });

        document.getElementById('btnInstallApp').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') { document.getElementById('installBanner').style.display = 'none'; }
                deferredPrompt = null;
            } else {
                showToast("Utilisez le menu de votre navigateur pour installer l'application.");
            }
        });

        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('open'); }
        
        function changerTheme() { showToast("Thème basculé."); }
        function changerLangue() { showToast("Assistant ELAWS : Multilingue actif."); }

        function selectionnerMetier(nom) {
            metierActif = nom;
            localStorage.setItem('evat_metier_actif', nom);
            showToast(`Profil actif : ${nom}`);
            render();
        }

        function mettreAJourIdentite() {
            const nat = document.getElementById('selectNationalite').value;
            const pays = document.getElementById('selectPaysActuel').value;
            const lang = document.getElementById('selectLangue').value;
            
            utilisateur.nationalite = nat;
            utilisateur.paysActuel = pays;
            utilisateur.langueMaternelle = lang;
            
            localStorage.setItem('evat_utilisateur', JSON.stringify(utilisateur));
            showToast(`Identité mise à jour : Origine ${nat} | Actuellement en ${pays}`);
            render();
        }

        // Ajouter un Objectif de Vie
        function ajouterObjectifVie() {
            const cat = document.getElementById('objCategorie').value;
            const titre = document.getElementById('objTitre').value.trim();
            if (titre) {
                objectifsVie.unshift({ id: Date.now(), categorie: cat, titre, statut: "En cours" });
                localStorage.setItem('evat_objectifs', JSON.stringify(objectifsVie));
                document.getElementById('objTitre').value = '';
                showToast("Objectif de vie ajouté avec succès !");
                render();
            } else {
                showToast("Veuillez saisir l'intitulé de l'objectif.");
            }
        }

        function ajouterNoteJournal() {
            const titre = document.getElementById('noteTitre').value.trim();
            const texte = document.getElementById('noteTexte').value.trim();
            if (titre && texte) {
                journalNotes.unshift({ id: Date.now(), titre, texte, date: new Date().toLocaleDateString() });
                localStorage.setItem('evat_notes', JSON.stringify(journalNotes));
                document.getElementById('noteTitre').value = '';
                document.getElementById('noteTexte').value = '';
                showToast("Note enregistrée !");
                render();
            } else {
                showToast("Veuillez remplir les champs.");
            }
        }

        function genererRecuFacture() {
            const client = document.getElementById('factureClient').value.trim();
            const service = document.getElementById('factureService').value.trim();
            const montant = document.getElementById('factureMontant').value;
            const devise = document.getElementById('factureDevise').value;

            if (client && service && montant) {
                const recuHtml = `
                    <div style="background:#ffffff; color:#0f172a; padding:20px; border-radius:10px; border:2px dashed var(--accent);">
                        <div style="text-align:center; border-bottom:2px solid #cbd5e1; padding-bottom:10px; margin-bottom:10px;">
                            <h3 style="margin:0; color:#059669;">🧾 REÇU DE PRESTATION / FACTURE</h3>
                            <small>Écosystème Souverain E.V.A.T. & ELAWS</small>
                        </div>
                        <p><strong>Date :</strong> ${new Date().toLocaleDateString()}</p>
                        <p><strong>Émetteur :</strong> ${utilisateur.nom} (${utilisateur.paysActuel})</p>
                        <p><strong>Client :</strong> ${client}</p>
                        <p><strong>Prestation :</strong> ${service}</p>
                        <p style="font-size:16px;"><strong>Montant :</strong> <span style="color:#059669; font-weight:800;">${parseFloat(montant).toLocaleString()} ${devise}</span></p>
                    </div>
                `;
                document.getElementById('resultatFacture').innerHTML = recuHtml;
                showToast("Facture générée !");
            } else {
                showToast("Remplissez tous les champs.");
            }
        }

        function exporterDonneesJSON() {
            const donneesCompletes = {
                utilisateur, metiers: listeMetiers, metierActif, carnet: carnetCommandes, notes: journalNotes, objectifs: objectifsVie, solde: soldeCaisse
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(donneesCompletes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `EVAT_Backup_${utilisateur.nationalite}_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Sauvegarde JSON exportée !");
        }

        function importerDonneesJSON(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if(parsed.utilisateur) {
                            localStorage.setItem('evat_utilisateur', JSON.stringify(parsed.utilisateur));
                            localStorage.setItem('evat_objectifs', JSON.stringify(parsed.objectifs || []));
                            showToast("Données restaurées ! Rechargement...");
                            setTimeout(() => location.reload(), 1500);
                        } else { showToast("Format invalide."); }
                    } catch(err) { showToast("Erreur de lecture."); }
                };
                reader.readAsText(file);
            }
        }

        function genererChecklistDossier() {
            const typeDemande = document.getElementById('typeDemandeAdministrative').value;
            const paysDestination = document.getElementById('destinationDemande').value;
            document.getElementById('resultatChecklist').innerHTML = `
                📋 <strong>Dossier requis pour ${typeDemande.toUpperCase()} (${paysDestination}) [Origine : ${utilisateur.nationalite}] :</strong><br>
                1. Passeport biométrique valide.<br>
                2. Formulaire officiel et photos d'identité.<br>
                3. Justificatifs financiers et d'hébergement.
            `;
            showToast("Checklist générée !");
        }

        function render() {
            document.querySelectorAll('.bar-item').forEach(el => el.classList.remove('active'));
            if(activeTab === 'accueil') document.getElementById('barAccueil')?.classList.add('active');
            if(activeTab === 'objectifs') document.getElementById('barObj')?.classList.add('active');
            if(activeTab === 'notes') document.getElementById('barNotes')?.classList.add('active');
            if(activeTab === 'factures') document.getElementById('barFactures')?.classList.add('active');
            if(activeTab === 'sauvegarde') document.getElementById('barSauv')?.classList.add('active');

            const content = document.getElementById('mainContent');
            content.innerHTML = '';

            if (activeTab === 'accueil') {
                let cartesMetiersHtml = '';
                listeMetiers.forEach(m => {
                    const isActive = m.nom === metierActif ? 'active' : '';
                    cartesMetiersHtml += `
                        <div class="metier-card-widget ${isActive}" onclick="selectionnerMetier('${m.nom}')">
                            <div style="font-size:20px; margin-bottom:4px;">${m.icone}</div>
                            <div style="font-weight:700; font-size:13px;">${m.nom}</div>
                            <div style="font-size:11px; color:var(--text-secondary);">${m.desc}</div>
                        </div>
                    `;
                });

                content.innerHTML = `
                    <div class="card" style="border-color: var(--accent);">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <div>
                                <span style="font-size:11px; color:var(--accent); font-weight:700;">🌍 PASSEPORT SOUVERAIN & IDENTITÉ</span>
                                <div style="font-size:17px; font-weight:800;">Configuration Régionale & Profil :</div>
                            </div>
                            <span style="background:rgba(5,150,105,0.2); color:var(--accent); padding:5px 10px; border-radius:20px; font-size:11px; font-weight:700;">${utilisateur.nationalite} ➔ ${utilisateur.paysActuel}</span>
                        </div>
                        <p class="text" style="margin-bottom:12px;">Définissez votre origine et votre zone d'évolution :</p>
                        
                        <div style="background:var(--bg-color); padding:12px; border-radius:10px; margin-bottom:15px; display:flex; flex-direction:column; gap:8px;">
                            <div style="display:flex; gap:8px;">
                                <div style="flex:1;">
                                    <label style="font-size:11px; color:var(--text-secondary);">Nationalité d'origine :</label>
                                    <select id="selectNationalite" class="input" style="margin-top:4px;">
                                        <option value="Togolais" ${utilisateur.nationalite === 'Togolais' ? 'selected' : ''}>🇹🇬 Togolais</option>
                                        <option value="Allemand" ${utilisateur.nationalite === 'Allemand' ? 'selected' : ''}>🇩🇪 Allemand</option>
                                        <option value="Anglais" ${utilisateur.nationalite === 'Anglais' ? 'selected' : ''}>🇬🇧 Anglais</option>
                                        <option value="Haïtien" ${utilisateur.nationalite === 'Haïtien' ? 'selected' : ''}>🇭🇹 Haïtien</option>
                                        <option value="Amazonien" ${utilisateur.nationalite === 'Amazonien' ? 'selected' : ''}>🌿 Amazonien</option>
                                    </select>
                                </div>
                                <div style="flex:1;">
                                    <label style="font-size:11px; color:var(--text-secondary);">Zone d'Évolution :</label>
                                    <select id="selectPaysActuel" class="input" style="margin-top:4px;">
                                        <option value="Togo / Afrique" ${utilisateur.paysActuel.includes('Togo') ? 'selected' : ''}>Togo / Afrique</option>
                                        <option value="Amazonie / Sud" ${utilisateur.paysActuel.includes('Amazonie') ? 'selected' : ''}>Amazonie / Sud</option>
                                        <option value="Europe / Allemagne" ${utilisateur.paysActuel.includes('Europe') ? 'selected' : ''}>Europe / Allemagne</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label style="font-size:11px; color:var(--text-secondary);">Langue Préférée :</label>
                                <input type="text" id="selectLangue" class="input" value="${utilisateur.langueMaternelle}" style="margin-top:4px;">
                            </div>
                            <button class="btn-action" style="padding:10px; font-size:13px; margin-top:4px;" onclick="mettreAJourIdentite()">💾 Enregistrer l'Identité</button>
                        </div>

                        <div style="font-size:14px; font-weight:800; margin-bottom:8px;">Sélectionnez votre rôle :</div>
                        <div class="grid-metiers">
                            ${cartesMetiersHtml}
                        </div>
                    </div>
                `;
            } else if (activeTab === 'objectifs') {
                let objHtml = '';
                objectifsVie.forEach(o => {
                    objHtml += `
                        <div class="tool-card" style="margin-bottom:10px; background:var(--bg-color); padding:12px; border-radius:8px; border-left:4px solid var(--accent);">
                            <span style="font-size:11px; color:var(--accent); font-weight:700;">📌 ${o.categorie}</span><br>
                            <strong style="font-size:14px;">${o.titre}</strong><br>
                            <small style="color:var(--text-secondary);">Statut : ${o.statut}</small>
                        </div>
                    `;
                });
                content.innerHTML = `
                    <div class="card" style="border-color:var(--accent);">
                        <h3 class="card-title">🎯 Gestionnaire d'Objectifs de Vie & Projets d'Autonomie</h3>
                        <p class="text">Structurez vos ambitions par grands piliers (Finances, Mobilité, Activité, Famille) pour réussir pas à pas.</p>
                        
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <label style="font-size:11px; color:var(--text-secondary);">Pilier / Catégorie :</label>
                            <select id="objCategorie" class="input" style="margin-top:4px; margin-bottom:8px;">
                                <option value="Finances & Business">🪙 Finances & Business</option>
                                <option value="Mobilité & Papiers">📁 Mobilité & Papiers</option>
                                <option value="Développement Personnel">🧠 Développement Personnel</option>
                                <option value="Famille & Proches">👨‍👩‍👧 Famille & Proches</option>
                            </select>
                            <input type="text" id="objTitre" class="input" placeholder="Intitulé de l'objectif (ex: Lancer mon activité...)" style="margin-bottom:10px;">
                            <button class="btn-action" onclick="ajouterObjectifVie()">➕ Ajouter l'Objectif de Vie</button>
                        </div>

                        <h4 style="margin-bottom:10px;">📋 Mes Objectifs Actuels :</h4>
                        ${objHtml}
                    </div>
                `;
            } else if (activeTab === 'notes') {
                let notesHtml = '';
                journalNotes.forEach(n => {
                    notesHtml += `
                        <div class="tool-card" style="margin-bottom:10px; background:var(--bg-color); padding:12px; border-radius:8px;">
                            <strong>📌 ${n.titre}</strong> <small style="float:right; color:var(--text-secondary);">${n.date}</small><br>
                            <p style="margin:6px 0 0 0; font-size:13px; color:var(--text-secondary);">${n.texte}</p>
                        </div>
                    `;
                });
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">📓 Journal de Bord & Notes Rapides (ELAWS)</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <input type="text" id="noteTitre" class="input" placeholder="Titre de la note" style="margin-bottom:8px;">
                            <textarea id="noteTexte" class="input" placeholder="Contenu..." style="margin-bottom:10px;"></textarea>
                            <button class="btn-action" onclick="ajouterNoteJournal()">➕ Ajouter</button>
                        </div>
                        ${notesHtml}
                    </div>
                `;
            } else if (activeTab === 'factures') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">🧾 Générateur de Reçus & Factures</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <input type="text" id="factureClient" class="input" placeholder="Client" style="margin-bottom:8px;">
                            <input type="text" id="factureService" class="input" placeholder="Prestation" style="margin-bottom:8px;">
                            <div style="display:flex; gap:8px; margin-bottom:10px;">
                                <input type="number" id="factureMontant" class="input" placeholder="Montant">
                                <select id="factureDevise" class="input" style="flex:0.6;"><option value="FCFA">FCFA</option><option value="EUR">EUR</option><option value="USD">USD</option></select>
                            </div>
                            <button class="btn-action" onclick="genererRecuFacture()">Générer</button>
                        </div>
                        <div id="resultatFacture">Remplissez les champs ci-dessus.</div>
                    </div>
                `;
            } else if (activeTab === 'sauvegarde') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">💾 Sauvegarde & Restauration Souveraine (JSON)</h3>
                        <button class="btn-action" onclick="exporterDonneesJSON()" style="margin-bottom:12px;">📥 Exporter mes Données</button>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; text-align:center;">
                            <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:8px;">Restaurer :</label>
                            <input type="file" accept=".json" onchange="importerDonneesJSON(event)" style="font-size:12px;">
                        </div>
                    </div>
                `;
            } else if (activeTab === 'dossiers') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">📁 Assistant Administratif : Visas & Titres de Séjour</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <select id="typeDemandeAdministrative" class="input" style="margin-bottom:10px;"><option value="visa">Visa</option><option value="sejour">Titre de Séjour</option></select>
                            <input type="text" id="destinationDemande" class="input" value="Europe / Allemagne" style="margin-bottom:10px;">
                            <button class="btn-action" onclick="genererChecklistDossier()">Générer la Checklist</button>
                        </div>
                        <div class="tool-card" id="resultatChecklist">Sélectionnez vos critères.</div>
                    </div>
                `;
            } else if (activeTab === 'convertisseur') {
                content.innerHTML = `<div class="card"><h3 class="card-title">💱 Convertisseur de Devises</h3><p class="text">Outil actif dans l'écosystème.</p></div>`;
            } else if (activeTab === 'traduction') {
                content.innerHTML = `<div class="card"><h3 class="card-title">🗣️ Pont ELAWS</h3><p class="text">Traduction croisée active.</p></div>`;
            } else if (activeTab === 'carnet') {
                content.innerHTML = `<div class="card"><h3 class="card-title">📝 Carnet</h3><p class="text">Suivi des commandes.</p></div>`;
            } else if (activeTab === 'gps') {
                content.innerHTML = `<div class="card"><h3 class="card-title">🧭 GPS</h3><p class="text">Localisation active.</p></div>`;
            } else if (activeTab === 'economie') {
                content.innerHTML = `<div class="card"><h3 class="card-title">🪙 Caisse</h3><p class="text">Solde : ${soldeCaisse.toLocaleString()} FCFA</p></div>`;
            } else if (activeTab === 'camera') {
                content.innerHTML = `<div class="card"><h3 class="card-title">📸 Caméra</h3><input type="file" accept="image/*" capture="environment"></div>`;
            } else if (activeTab === 'securite') {
                content.innerHTML = `<div class="card"><h3 class="card-title">🛡️ Sécurité</h3><p class="text">Chiffrement AES-256 actif.</p></div>`;
            } else if (activeTab === 'ia') {
                content.innerHTML = `<div class="card"><h3 class="card-title">Assistant ELAWS</h3><p class="text">Bonjour !</p></div>`;
            }
        }

        function switchTab(t) { activeTab = t; document.getElementById('sideMenu').classList.remove('open'); render(); window.scrollTo(0, 0); }
        render();
    </script>
</body>
</html>
