<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.V.A.T. & ELAWS AI - Écosystème Souverain & Outils Métiers</title>
    
    <link rel="manifest" href="data:application/manifest+json,{
        'name': 'E.V.A.T. & ELAWS AI',
        'short_name': 'EVAT',
        'start_url': '.',
        'display': 'standalone',
        'background_color': '#0b0f19',
        'theme_color': '#059669',
        'icons': [{
            'src': 'https://img.icons8.com/color/192/000000/artificial-intelligence.png',
            'sizes': '192x192',
            'type': 'image/png'
        }]
    }">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #34d399;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --accent: #059669;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        [data-theme="eco"] {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #22c55e;
            --text-secondary: #15803d;
            --accent: #22c55e;
            --accent-gradient: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            --border-color: #14532d;
            --shadow: 0 0 15px rgba(34, 197, 94, 0.15);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 90px;
            transition: background 0.4s ease, color 0.4s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
            border: 2px solid var(--accent);
        }
        .menu-toggle {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s;
        }
        .menu-toggle:hover { transform: scale(1.05); }
        .title { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .btn-top {
            background-color: var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s;
        }
        .badge-info {
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 15px;
            padding-left: 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .offline-status {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 800;
        }
        .bottom-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }
        .bar-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .bar-item span.icon { font-size: 18px; }
        .bar-item.active, .bar-item:hover { color: var(--accent); }

        #toastNotification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            font-size: 13px;
            font-weight: 700;
            z-index: 1000;
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90%;
            text-align: center;
        }
        #toastNotification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .sidebar {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
            max-height: 70vh;
            overflow-y: auto;
        }
        .sidebar.open { display: block; }
        .sidebar h3 { font-size: 0.95rem; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        .menu-item {
            background: rgba(16, 185, 129, 0.08);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: none;
            width: 100%;
            text-align: left;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .menu-item:hover { background: rgba(16, 185, 129, 0.18); transform: translateX(4px); }
        .module-container { flex: 1; max-width: 750px; width: 100%; margin: 0 auto; }
        .card {
            background-color: var(--card-bg);
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease;
        }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-top: 0; margin-bottom: 10px; }
        .text { font-size: 14px; color: var(--text-secondary); margin-bottom: 15px; line-height: 1.6; }
        .input {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 11px;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .input:focus { border-color: var(--accent); }
        select.input { width: 100%; }
        textarea.input { resize: vertical; min-height: 80px; }
        .btn-action {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-action:hover { transform: translateY(-1px); opacity: 0.95; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body data-theme="dark">

    <div id="toastNotification">✨ <span id="toastText">Action exécutée</span></div>

    <div id="appHeader" style="display:none;">
        <header>
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
                <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo ELAWS" class="app-logo">
                <div class="title">E.V.A.T. & ELAWS AI</div>
            </div>
            <div class="header-right">
                <button class="btn-top" onclick="changerTheme()">🎨 Thème</button>
                <button class="btn-top" onclick="changerProfilSession()">👤 Profils</button>
            </div>
        </header>
        <div class="badge-info">
            <span id="badgeDomaineActif">🌍 Écosystème Souverain & Outils Métiers</span>
            <span class="offline-status">⚡ 100% Hors-Ligne</span>
        </div>
    </div>

    <!-- BANDEAU D'INSTALLATION AUTOMATIQUE -->
    <div id="installBanner" class="card" style="display:none; border-color:var(--accent); background:rgba(5,150,105,0.15); text-align:center;">
        <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo" style="width:50px; height:50px; margin-bottom:8px; border-radius:12px;">
        <h3 class="card-title" style="color:var(--accent); margin-bottom:6px;">📲 Installer E.V.A.T. & ELAWS AI</h3>
        <p class="text" style="margin-bottom:12px;">Installez l'application pour l'utiliser partout, même sans aucune connexion Internet !</p>
        <button class="btn-action" id="btnInstallApp" style="font-size:15px; padding:14px;">Installer l'Application</button>
    </div>

    <div id="sideMenu" class="sidebar">
        <h3>📂 Navigation & Outils Métiers</h3>
        <button class="menu-item" onclick="switchTab('accueil')">🏠 Accueil & Mon Profil</button>
        <button class="menu-item" onclick="switchTab('ia')" style="background:rgba(5,150,105,0.2); border:1px solid var(--accent);">🤖 <strong>Parler à ELAWS AI (Discussion IA)</strong></button>
        <button class="menu-item" onclick="switchTab('atelier_specifique')" id="menuItemAtelier">⚡ Outils & Atelier Métier</button>
        <button class="menu-item" onclick="switchTab('factures')">🧾 Reçus & Factures</button>
        <button class="menu-item" onclick="switchTab('economie')">🪙 Caisse & Trésorerie</button>
        <button class="menu-item" onclick="switchTab('objectifs')">🎯 Objectifs & Projets</button>
        <button class="menu-item" onclick="switchTab('notes')">📓 Journal de Bord</button>
        <button class="menu-item" onclick="switchTab('sauvegarde')">💾 Sauvegarde & Restauration (JSON)</button>
        <button class="menu-item" onclick="switchTab('convertisseur')">💱 Convertisseur de Devises</button>
        <button class="menu-item" onclick="switchTab('traduction')">🗣️ Pont de Traduction</button>
        <button class="menu-item" onclick="switchTab('gps')">🧭 Géolocalisation & GPS</button>
        <button class="menu-item" onclick="switchTab('camera')">📸 Caméra & Documents</button>
        <button class="menu-item" onclick="switchTab('securite')">🛡️ Sécurité & Chiffrement</button>
    </div>

    <div class="module-container" id="mainContent"></div>

    <div id="bottomBar" class="bottom-action-bar" style="display:none;">
        <button class="bar-item active" onclick="switchTab('accueil')" id="barAccueil">
            <span class="icon">💼</span><span>Profil</span>
        </button>
        <button class="bar-item" onclick="switchTab('ia')" id="barIa" style="color:var(--accent);">
            <span class="icon">🤖</span><span>ELAWS AI</span>
        </button>
        <button class="bar-item" onclick="switchTab('atelier_specifique')" id="barAtelier">
            <span class="icon" id="iconBarMetier">⚡</span><span id="labelBarMetier">Atelier</span>
        </button>
        <button class="bar-item" onclick="switchTab('factures')" id="barFactures">
            <span class="icon">🧾</span><span>Factures</span>
        </button>
        <button class="bar-item" onclick="switchTab('economie')" id="barEco">
            <span class="icon">🪙</span><span>Caisse</span>
        </button>
    </div>

    <script>
        let activeTab = 'accueil';
        let currentThemeIndex = 0;
        const themes = ['dark', 'light', 'eco'];

        function changerTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const t = themes[currentThemeIndex];
            document.body.setAttribute('data-theme', t);
            showToast(`Thème : ${t.toUpperCase()}`);
        }
        
        let listeProfils = JSON.parse(localStorage.getItem('evat_tous_profils')) || [];
        let idProfilActif = localStorage.getItem('evat_profil_actif_id') || null;
        let utilisateurActif = null;

        function chargerDonneesProfil() {
            if (idProfilActif) {
                const trouve = listeProfils.find(p => p.id == idProfilActif);
                if (trouve) utilisateurActif = trouve;
            }
            if (!utilisateurActif && listeProfils.length > 0) {
                utilisateurActif = listeProfils[0];
                idProfilActif = utilisateurActif.id;
            }
        }

        chargerDonneesProfil();

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            const text = document.getElementById('toastText');
            text.innerHTML = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').style.display = 'block';
        });

        document.getElementById('btnInstallApp').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBanner').style.display = 'none';
                    showToast("Application installée pour le mode hors-ligne !");
                }
                deferredPrompt = null;
            } else {
                showToast("Application prête sur votre écran.");
            }
        });

        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('open'); }

        function creerNouveauProfil() {
            const nom = document.getElementById('regNom').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const metierUnique = document.getElementById('regMetierCustom').value.trim() || 'Artisan';
            const tel = document.getElementById('regTel').value.trim();
            const nat = document.getElementById('regNationalite').value;
            const pays = document.getElementById('regPaysActuel').value;

            if (!nom) {
                showToast("Veuillez renseigner votre nom.");
                return;
            }

            const nouveauId = 'prof_' + Date.now();
            const nouveauProfil = {
                id: nouveauId,
                nom: nom,
                email: email || 'contact@evat.tg',
                telephone: tel || '+228 98231402',
                nationalite: nat,
                paysActuel: pays,
                metierUnique: metierUnique,
                objectifs: [
                    { id: 1, categorie: "Finances & Business", titre: `Faire prospérer mon activité de ${metierUnique}`, statut: "En cours" }
                ],
                notes: [
                    { id: 1, titre: "Bienvenue dans E.V.A.T.", texte: `Espace souverain configuré hors-ligne pour : ${metierUnique}.`, date: new Date().toLocaleDateString() }
                ],
                solde: 50000,
                donneesMetierSpecifique: {
                    // Outils architecte
                    plans: [],
                    analysesSol: [],
                    // Outils cultivateur / agriculteur
                    cultures: [],
                    intrants: [],
                    // Outils couturier
                    mesuresClients: []
                },
                discussionsElaws: [
                    { role: 'ai', texte: `Bonjour ${nom} ! Je suis ELAWS AI, votre intelligence artificielle souveraine. J'ai généré automatiquement vos outils de travail spécialisés pour votre métier de ${metierUnique}. Tout fonctionne à 100% hors-ligne. Que souhaitez-vous faire ?` }
                ],
                historiqueFinancier: [
                    { date: new Date().toLocaleDateString(), desc: "Capital initial", montant: 50000, type: "entree" }
                ]
            };

            listeProfils.push(nouveauProfil);
            localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils));
            localStorage.setItem('evat_profil_actif_id', nouveauId);
            
            idProfilActif = nouveauId;
            utilisateurActif = nouveauProfil;

            showToast(`Bienvenue, ${nom} (${metierUnique}) !`);
            render();
        }

        function changerProfilSession() {
            idProfilActif = null;
            utilisateurActif = null;
            localStorage.removeItem('evat_profil_actif_id');
            document.getElementById('appHeader').style.display = 'none';
            document.getElementById('bottomBar').style.display = 'none';
            document.getElementById('sideMenu').classList.remove('open');
            render();
        }

        function selectionnerProfilExistant(id) {
            idProfilActif = id;
            localStorage.setItem('evat_profil_actif_id', id);
            chargerDonneesProfil();
            showToast(`Profil chargé : ${utilisateurActif.nom}`);
            render();
        }

        function sauvegarderProfilActif() {
            const index = listeProfils.findIndex(p => p.id == utilisateurActif.id);
            if (index !== -1) {
                listeProfils[index] = utilisateurActif;
                localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils));
            }
        }

        function mettreAJourIdentiteEtMetier() {
            utilisateurActif.nom = document.getElementById('inputNomUtilisateur').value.trim() || utilisateurActif.nom;
            utilisateurActif.metierUnique = document.getElementById('inputMetierUnique').value.trim() || utilisateurActif.metierUnique;
            utilisateurActif.nationalite = document.getElementById('selectNationalite').value;
            utilisateurActif.paysActuel = document.getElementById('selectPaysActuel').value;
            utilisateurActif.email = document.getElementById('inputEmailUtilisateur').value.trim() || utilisateurActif.email;
            utilisateurActif.telephone = document.getElementById('inputTelUtilisateur').value.trim() || utilisateurActif.telephone;
            
            if(!utilisateurActif.donneesMetierSpecifique) {
                utilisateurActif.donneesMetierSpecifique = { plans: [], analysesSol: [], cultures: [], intrants: [], mesuresClients: [] };
            }

            sauvegarderProfilActif();
            showToast("Profil et outils mis à jour !");
            render();
        }

        // --- OUTILS ARCHITECTE ---
        function ajouterPlanArchitecte() {
            const nomPlan = document.getElementById(' archiNomPlan').value.trim();
            const surface = document.getElementById('archiSurface').value;
            const pieces = document.getElementById('archiPieces').value.trim();
            if (nomPlan && surface) {
                if(!utilisateurActif.donneesMetierSpecifique.plans) utilisateurActif.donneesMetierSpecifique.plans = [];
                utilisateurActif.donneesMetierSpecifique.plans.unshift({
                    id: Date.now(), nomPlan, surface: surface || '0', pieces: pieces || 'Standard', date: new Date().toLocaleDateString()
                });
                sauvegarderProfilActif();
                showToast("Plan et métré enregistrés !");
                render();
            } else {
                showToast("Remplissez le nom du plan et la surface.");
            }
        }

        function ajouterAnalyseSol() {
            const zone = document.getElementById('solZone').value.trim();
            const typeSol = document.getElementById('solType').value;
            const resistance = document.getElementById('solResistance').value;
            if (zone) {
                if(!utilisateurActif.donneesMetierSpecifique.analysesSol) utilisateurActif.donneesMetierSpecifique.analysesSol = [];
                utilisateurActif.donneesMetierSpecifique.analysesSol.unshift({
                    id: Date.now(), zone, typeSol, resistance: resistance || '2.5', date: new Date().toLocaleDateString()
                });
                sauvegarderProfilActif();
                showToast("Analyse géotechnique enregistrée !");
                render();
            } else {
                showToast("Indiquez la zone ou le chantier.");
            }
        }

        // --- OUTILS CULTIVATEUR / AGRICULTEUR ---
        function ajouterCultureChamp() {
            const culture = document.getElementById(' agriCulture').value.trim();
            const superficie = document.getElementById('agriSuperficie').value;
            const sol = document.getElementById('agriSol').value.trim();
            if (culture && superficie) {
                if(!utilisateurActif.donneesMetierSpecifique.cultures) utilisateurActif.donneesMetierSpecifique.cultures = [];
                utilisateurActif.donneesMetierSpecifique.cultures.unshift({
                    id: Date.now(), culture, superficie, sol: sol || 'Argilo-limoneux', date: new Date().toLocaleDateString()
                });
                sauvegarderProfilActif();
                showToast("Champ et culture enregistrés !");
                render();
            } else {
                showToast("Indiquez la culture et la superficie.");
            }
        }

        // --- OUTILS COUTURIER / TAILLEUR ---
        function ajouterMesureClient() {
            const client = document.getElementById('mesureClientNom').value.trim();
            const typeHabit = document.getElementById('mesureTypeHabit').value.trim();
            const poitrine = document.getElementById('mesurePoitrine').value;
            const longueur = document.getElementById('mesureLongueur').value;
            const manches = document.getElementById('mesureManches').value;
            const details = document.getElementById('mesureDetails').value.trim();

            if (client && typeHabit) {
                if(!utilisateurActif.donneesMetierSpecifique.mesuresClients) utilisateurActif.donneesMetierSpecifique.mesuresClients = [];
                utilisateurActif.donneesMetierSpecifique.mesuresClients.unshift({
                    id: Date.now(), client, typeHabit, poitrine: poitrine || 'N/C', longueur: longueur || 'N/C', manches: manches || 'N/C', details: details || 'Aucune consigne', date: new Date().toLocaleDateString()
                });
                sauvegarderProfilActif();
                showToast("Fiche de mesures enregistrée !");
                render();
            } else {
                showToast("Remplissez le nom du client et l'habit.");
            }
        }

        function supprimerDonneesMetier(type, id) {
            if(type === 'plan') {
                utilisateurActif.donneesMetierSpecifique.plans = utilisateurActif.donneesMetierSpecifique.plans.filter(p => p.id !== id);
            } else if(type === 'sol') {
                utilisateurActif.donneesMetierSpecifique.analysesSol = utilisateurActif.donneesMetierSpecifique.analysesSol.filter(s => s.id !== id);
            } else if(type === 'culture') {
                utilisateurActif.donneesMetierSpecifique.cultures = utilisateurActif.donneesMetierSpecifique.cultures.filter(c => c.id !== id);
            } else if(type === 'mesure') {
                utilisateurActif.donneesMetierSpecifique.mesuresClients = utilisateurActif.donneesMetierSpecifique.mesuresClients.filter(m => m.id !== id);
            }
            sauvegarderProfilActif();
            showToast("Élément supprimé.");
            render();
        }

        function ajouterObjectifVie() {
            const cat = document.getElementById('objCategorie').value;
            const titre = document.getElementById('objTitre').value.trim();
            if (titre) {
                utilisateurActif.objectifs.unshift({ id: Date.now(), categorie: cat, titre, statut: "En cours" });
                sauvegarderProfilActif();
                document.getElementById('objTitre').value = '';

        function convertirDeviseAction() {
            const montant = parseFloat(document.getElementById('montantDevise').value) || 0;
            const type = document.getElementById('paireDevise').value;
            let resultat = 0;
            let texteRes = '';
            if (type === 'eur_xof') {
                resultat = montant * 655.957;
                texteRes = `${montant} EUR = ${resultat.toFixed(2)} XOF (FCFA)`;
            } else if (type === 'xof_eur') {
                resultat = montant / 655.957;
                texteRes = `${montant} XOF = ${resultat.toFixed(2)} EUR`;
            } else if (type === 'usd_xof') {
                resultat = montant * 600;
                texteRes = `${montant} USD = ${resultat.toFixed(2)} XOF (FCFA)`;
            } else {
                resultat = montant / 600;
                texteRes = `${montant} XOF = ${resultat.toFixed(2)} USD`;
            }
            document.getElementById('resultatConversion').innerText = texteRes;
            showToast("Conversion effectuée !");
        }

                                <h4 style="margin:0 0 8px 0; color:#f59e0b;">🧪 Analyse Géotechnique du Sol :</h4>
                                <input type="text" id="solZone" class="input" placeholder="Emplacement du chantier (ex: Quartier Kodjoviakopé)" style="margin-bottom:8px;">
                                <select id="solType" class="input" style="margin-bottom:8px;">
                                    <option value="Sable argileux">Sable argileux</option>
                                    <option value="Argile latéritique">Argile latéritique</option>
                                    <option value="Sol rocheux">Sol rocheux / Roc</option>
                                    <option value="Sol sableux meuble">Sol sableux meuble</option>
                                </select>
                                <input type="number" step="0.1" id="solResistance" class="input" placeholder="Résistance du sol (bars, ex: 2.5)" style="margin-bottom:8px;">
                                <button class="btn-action" style="background:linear-gradient(135deg, #f59e0b 0%, #d97706 100%);" onclick="ajouterAnalyseSol()">Enregistrer l'Analyse du Sol</button>
                            </div>

                            <h4 style="margin-bottom:8px;">📂 Mes Plans Enregistrés :</h4>
                            ${plansHtml}

                            <h4 style="margin:15px 0 8px 0;">🔬 Études de Sols :</h4>
                            ${solHtml}
                        </div>
                    `;
                } else if (metierLower.includes('cultivateur') || metierLower.includes('agriculteur') || metierLower.includes('champ') || metierLower.includes('elevage')) {
                    // Outils cultivateur / agriculteur
                    let culturesHtml = '';
                    const dms = utilisateurActif.donneesMetierSpecifique || { cultures: [] };
                    if (dms.cultures && dms.cultures.length > 0) {
                        dms.cultures.forEach(c => {
                            culturesHtml += `
                                <div style="background:var(--bg-color); padding:12px; border-radius:8px; margin-bottom:8px; border-left:4px solid #22c55e; position:relative;">
                                    <button onclick="supprimerDonneesMetier('culture', ${c.id})" style="position:absolute; top:10px; right:10px; background:none; border:none; cursor:pointer;" title="Supprimer">❌</button>
                                    <strong style="color:#22c55e;">🌾 Culture : ${c.culture}</strong> (${c.date})<br>
                                    <small>Superficie : <strong>${c.superficie} hectares</strong> | Type de sol : ${c.sol}</small>
                                </div>
                            `;
                        });
                    } else { culturesHtml = '<p style="color:var(--text-secondary);">Aucune culture enregistrée.</p>'; }

                    content.innerHTML = `
                        <div class="card" style="border-color:var(--accent);">
                            <h3 class="card-title">🌾 Atelier Cultivateur & Agriculteur : Gestion des Champs & Sols</h3>
                            <p class="text">Organisez vos cultures, superficies et intrants agricoles sans connexion Internet.</p>
                            
                            <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                                <h4 style="margin:0 0 8px 0; color:#22c55e;">➕ Enregistrer une Culture / Parcelle :</h4>
                                <input type="text" id="agriCulture" class="input" placeholder="Type de culture (ex: Maïs, Manioc, Haricot)" style="margin-bottom:8px;">
                                <input type="number" step="0.1" id="agriSuperficie" class="input" placeholder="Superficie (en hectares)" style="margin-bottom:8px;">
                                <input type="text" id="agriSol" class="input" placeholder="Type de sol (ex: Argilo-limoneux, Humifère)" style="margin-bottom:8px;">
                                <button class="btn-action" style="background:linear-gradient(135deg, #22c55e 0%, #16a34a 100%);" onclick="ajouterCultureChamp()">Enregistrer la Parcelle</button>
                            </div>

                            <h4 style="margin-bottom:8px;">🌿 Mes Parcelles & Cultures :</h4>
                            ${culturesHtml}
                        </div>
                    `;
                } else if (metierLower.includes('coutur') || metierLower.includes('tailleur') || metierLower.includes('hab')) {
                    // Outils couturier
                    let mesuresHtml = '';
                    const dms = utilisateurActif.donneesMetierSpecifique || { mesuresClients: [] };
                    if (dms.mesuresClients && dms.mesuresClients.length > 0) {
                        dms.mesuresClients.forEach(m => {
                            mesuresHtml += `
                                <div style="background:var(--bg-color); padding:14px; border-radius:10px; margin-bottom:10px; border-left:4px solid var(--accent); position:relative;">
                                    <button onclick="supprimerDonneesMetier('mesure', ${m.id})" style="position:absolute; top:10px; right:10px; background:none; border:none; cursor:pointer;" title="Supprimer">❌</button>
                                    <strong style="font-size:15px; color:var(--accent);">👤 Client : ${m.client}</strong> <small style="color:var(--text-secondary);">(${m.date})</small><br>
                                    <div style="margin-top:6px; font-size:13px; display:grid; grid-template-columns: repeat(2, 1fr); gap:4px;">
                                        <div><strong>Modèle :</strong> ${m.typeHabit}</div>
                                        <div><strong>Poitrine :</strong> ${m.poitrine} cm</div>
                                        <div><strong>Longueur :</strong> ${m.longueur} cm</div>
                                        <div><strong>Manches :</strong> ${m.manches} cm</div>
                                    </div>
                                    <div style="margin-top:6px; font-size:12px; color:var(--text-secondary);"><strong>Consignes :</strong> ${m.details}</div>
                                </div>
                            `;
                        });
                    } else { mesuresHtml = `<p style="text-align:center; color:var(--text-secondary);">Aucune fiche de mesure enregistrée.</p>`; }

                    content.innerHTML = `
                        <div class="card" style="border-color:var(--accent);">
                            <h3 class="card-title">✂️ Atelier Couturier : Carnet de Mesures & Modèles d'Habits</h3>
                            <p class="text">Enregistrez et consultez les mensurations de vos clients et vos modèles sans connexion.</p>
                            
                            <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:20px;">
                                <h4 style="margin:0 0 10px 0; color:var(--accent);">➕ Nouvelle Fiche de Mesures :</h4>
                                <input type="text" id="mesureClientNom" class="input" placeholder="Nom et Prénom du client *" style="margin-bottom:8px;">
                                <input type="text" id="mesureTypeHabit" class="input" placeholder="Modèle / Type d'habit (ex: Boubou, Costume) *" style="margin-bottom:8px;">
                                <div style="display:flex; gap:8px; margin-bottom:8px;">
                                    <input type="text" id="mesurePoitrine" class="input" placeholder="Poitrine (cm)">
                                    <input type="text" id="mesureLongueur" class="input" placeholder="Longueur (cm)">
                                    <input type="text" id="mesureManches" class="input" placeholder="Manches (cm)">
                                </div>
                                <textarea id="mesureDetails" class="input" placeholder="Détails du tissu, style de col..." style="margin-bottom:10px;"></textarea>
                                <button class="btn-action" onclick="ajouterMesureClient()">Enregistrer la Fiche Client</button>
                            </div>

                            <h4 style="margin-bottom:10px;">📋 Fiches Enregistrées (${dms.mesuresClients ? dms.mesuresClients.length : 0}) :</h4>
                            ${mesuresHtml}
                        </div>
                    `;
                } else {
                    // Outil universel pour tout autre métier
                    content.innerHTML = `
                        <div class="card" style="border-color:var(--accent);">
                            <h3 class="card-title">⚡ Outils de Travail : ${utilisateurActif.metierUnique}</h3>
                            <p class="text">Votre écosystème de production est configuré pour <strong>${utilisateurActif.metierUnique}</strong>. Vous disposez de la caisse, des factures, de votre journal et de votre assistant ELAWS AI.</p>
                        </div>
                    `;
                }
            } else if (activeTab === 'factures') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">🧾 Générateur de Reçus & Factures (${utilisateurActif.metierUnique})</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <input type="text" id="factureClient" class="input" placeholder="Nom du client" style="margin-bottom:8px;">
                            <input type="text" id="factureService" class="input" placeholder="Prestation / Service réalisé" style="margin-bottom:8px;">
                            <div style="display:flex; gap:8px; margin-bottom:10px;">
                                <input type="number" id="factureMontant" class="input" placeholder="Montant">
                                <select id="factureDevise" class="input" style="flex:0.6;"><option value="FCFA">FCFA</option><option value="EUR">EUR</option><option value="USD">USD</option></select>
                            </div>
                            <button class="btn-action" onclick="genererRecuFacture()">Générer le Reçu</button>
                        </div>
                        <div id="resultatFacture">Remplissez les champs ci-dessus pour générer un reçu professionnel hors-ligne.</div>
                    </div>
                `;
            } else if (activeTab === 'economie') {
                let transHtml = '';
                if(utilisateurActif.historiqueFinancier) {
                    utilisateurActif.historiqueFinancier.forEach(t => {
                        const color = t.type === 'entree' ? '#34d399' : '#f87171';
                        const signe = t.type === 'entree' ? '+' : '-';
                        transHtml += `<div style="background:var(--bg-color); padding:10px; border-radius:8px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;"><span>${t.date} - ${t.desc}</span><strong style="color:${color};">${signe}${t.montant.toLocaleString()} FCFA</strong></div>`;
                    });
                }
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">🪙 Caisse & Trésorerie (${utilisateurActif.metierUnique})</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px; text-align:center;">
                            <span style="font-size:12px; color:var(--text-secondary);">Solde Actuel :</span>
                            <div style="font-size:24px; font-weight:800; color:var(--accent);">${utilisateurActif.solde.toLocaleString()} FCFA</div>
                        </div>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <h4 style="margin:0 0 8px 0; color:var(--accent);">Ajouter une entrée / sortie :</h4>
                            <input type="text" id="descCaisse" class="input" placeholder="Libellé (ex: Vente de prestation)" style="margin-bottom:8px;">
                            <input type="number" id="montantCaisse" class="input" placeholder="Montant en FCFA" style="margin-bottom:8px;">
                            <select id="typeCaisse" class="input" style="margin-bottom:8px;">
                                <option value="entree">Entrée d'argent (+)</option>
                                <option value="sortie">Sortie d'argent (-)</option>
                            </select>
                            <button class="btn-action" onclick="ajouterTransactionCaisse()">Enregistrer dans la Caisse</button>
                        </div>
                        <h4 style="margin-bottom:8px;">Historique des Transactions :</h4>
                        ${transHtml}
                    </div>
                `;
            } else if (activeTab === 'objectifs') {
                let objHtml = '';
                utilisateurActif.objectifs.forEach(o => {
                    objHtml += `
                        <div style="margin-bottom:10px; background:var(--bg-color); padding:12px; border-radius:8px; border-left:4px solid var(--accent);">
                            <span style="font-size:11px; color:var(--accent); font-weight:700;">📌 ${o.categorie}</span><br>
                            <strong style="font-size:14px;">${o.titre}</strong><br>
                            <small style="color:var(--text-secondary);">Statut : ${o.statut}</small>
                        </div>
                    `;
                });
                content.innerHTML = `
                    <div class="card" style="border-color:var(--accent);">
                        <h3 class="card-title">🎯 Objectifs & Projets</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <label style="font-size:11px; color:var(--text-secondary);">Catégorie :</label>
                            <select id="objCategorie" class="input" style="margin-top:4px; margin-bottom:8px;">
                                <option value="Finances & Business">🪙 Finances & Business</option>
                                <option value="Mobilité & Papiers">📁 Mobilité & Papiers</option>
                                <option value="Développement Personnel">🧠 Développement Personnel</option>
                            </select>
                            <input type="text" id="objTitre" class="input" placeholder="Intitulé de l'objectif..." style="margin-bottom:10px;">
                            <button class="btn-action" onclick="ajouterObjectifVie()">➕ Ajouter l'Objectif</button>
                        </div>
                        ${objHtml}
                    </div>
                `;
            } else if (activeTab === 'notes') {
                let notesHtml = '';
                if(utilisateurActif.notes) {
                    utilisateurActif.notes.forEach(n => {
                        notesHtml += `
                            <div style="margin-bottom:10px; background:var(--bg-color); padding:12px; border-radius:8px;">
                                <strong>📌 ${n.titre}</strong> <small style="float:right; color:var(--text-secondary);">${n.date}</small><br>
                                <p style="margin:6px 0 0 0; font-size:13px; color:var(--text-secondary);">${n.texte}</p>
                            </div>
                        `;
                    });
                }
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">📓 Journal de Bord ELAWS</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <input type="text" id="noteTitre" class="input" placeholder="Titre de la note" style="margin-bottom:8px;">
                            <textarea id="noteTexte" class="input" placeholder="Contenu..." style="margin-bottom:10px;"></textarea>
                            <button class="btn-action" onclick="ajouterNoteJournal()">➕ Ajouter la Note</button>
                        </div>
                        ${notesHtml}
                    </div>
                `;
            } else if (activeTab === 'sauvegarde') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">💾 Sauvegarde & Restauration (JSON)</h3>
                        <button class="btn-action" onclick="exporterDonneesJSON()" style="margin-bottom:12px;">📥 Exporter mon Profil JSON</button>
                        <p class="text">Sauvegardez l'intégralité de vos plans, cultures, fiches et finances dans un fichier souverain.</p>
                    </div>
                `;
            } else if (activeTab === 'convertisseur') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">💱 Convertisseur de Devises</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <input type="number" id="montantDevise" class="input" placeholder="Montant à convertir" style="margin-bottom:8px;">
                            <select id="paireDevise" class="input" style="margin-bottom:8px;">
                                <option value="eur_xof">EUR ➡️ XOF (FCFA)</option>
                                <option value="xof_eur">XOF (FCFA) ➡️ EUR</option>
                                <option value="usd_xof">USD ➡️ XOF (FCFA)</option>
                                <option value="xof_usd">XOF (FCFA) ➡️ USD</option>
                            </select>
                            <button class="btn-action" onclick="convertirDeviseAction()">Calculer</button>
                        </div>
                        <div id="resultatConversion" style="font-weight:800; color:var(--accent); text-align:center; font-size:16px;"></div>
                    </div>
                `;
            } else if (activeTab === 'traduction') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">🗣️ Pont de Traduction</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <textarea id="texteATraduire" class="input" placeholder="Texte à traduire..." style="margin-bottom:8px;"></textarea>
                            <select id="langueCible" class="input" style="margin-bottom:8px;">
                                <option value="allemand">Allemand (Deutsch)</option>
                                <option value="anglais">Anglais (English)</option>
                                <option value="francais">Français</option>
                            </select>
                            <button class="btn-action" onclick="traduireElawsAction()">Traduire avec ELAWS</button>
                        </div>
                        <div id="resultatTraduction" style="font-size:14px; color:var(--text-secondary); background:var(--bg-color); padding:12px; border-radius:8px;"></div>
                    </div>
                `;
            } else if (activeTab === 'gps') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">🧭 Géolocalisation & GPS Souverain</h3>
                        <p class="text">Zone d'évolution actuelle : <strong>${utilisateurActif.paysActuel}</strong> (Mode Hors-Ligne).</p>
                    </div>
                `;
            } else if (activeTab === 'camera') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">📸 Caméra & Numérisation</h3>
                        <p class="text">Capturez vos documents hors-ligne.</p>
                    </div>
                `;
            } else if (activeTab === 'securite') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">🛡️ Sécurité & Chiffrement Local</h3>
                        <p class="text">Toutes vos informations sont stockées localement et chiffrées sur votre appareil.</p>
                    </div>
                `;
            } else {
                content.innerHTML = `<div class="card"><h3 class="card-title">🛠️ Module actif</h3><p class="text">Prêt pour ${utilisateurActif.nom} (${utilisateurActif.metierUnique}).</p></div>`;
            }
        }

        function switchTab(t) { activeTab = t; document.getElementById('sideMenu').classList.remove('open'); render(); window.scrollTo(0, 0); }
        render();
    </script>
</body>
</html>
