<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.V.A.T. & ELAWS - Écosystème Souverain Multi-Profils</title>
    
    <link rel="manifest" href="data:application/manifest+json,{
        'name': 'E.V.A.T. & ELAWS',
        'short_name': 'EVAT',
        'start_url': '.',
        'display': 'standalone',
        'background_color': '#0b0f19',
        'theme_color': '#059669',
        'icons': [{
            'src': 'https://img.icons8.com/color/192/000000/artificial-intelligence.png',
            'sizes': '192x192',
            'type': 'image/png'
        }]
    }">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #34d399;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --accent: #059669;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        [data-theme="eco"] {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #22c55e;
            --text-secondary: #15803d;
            --accent: #22c55e;
            --accent-gradient: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            --border-color: #14532d;
            --shadow: 0 0 15px rgba(34, 197, 94, 0.15);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 80px;
            transition: background 0.4s ease, color 0.4s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
            border: 2px solid var(--accent);
        }
        .menu-toggle {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s;
        }
        .menu-toggle:hover { transform: scale(1.05); }
        .title { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .btn-top {
            background-color: var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s;
        }
        .badge-info {
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 15px;
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bottom-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }
        .bar-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .bar-item span.icon { font-size: 18px; }
        .bar-item.active, .bar-item:hover { color: var(--accent); }

        #toastNotification {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            font-size: 13px;
            font-weight: 700;
            z-index: 1000;
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90%;
            text-align: center;
        }
        #toastNotification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .sidebar {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
        }
        .sidebar.open { display: block; }
        .sidebar h3 { font-size: 0.95rem; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        .menu-item {
            background: rgba(16, 185, 129, 0.08);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: none;
            width: 100%;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .menu-item:hover { background: rgba(16, 185, 129, 0.18); transform: translateX(4px); }
        .module-container { flex: 1; max-width: 750px; width: 100%; margin: 0 auto; }
        .card {
            background-color: var(--card-bg);
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease;
        }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-top: 0; margin-bottom: 10px; }
        .text { font-size: 14px; color: var(--text-secondary); margin-bottom: 15px; line-height: 1.6; }
        .grid-metiers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .metier-card-widget {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .metier-card-widget:hover { border-color: var(--accent); transform: translateY(-2px); }
        .metier-card-widget.active { border-color: var(--accent); background: rgba(5, 150, 105, 0.15); box-shadow: 0 0 10px rgba(5,150,105,0.2); }
        .input {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 11px;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .input:focus { border-color: var(--accent); }
        select.input { width: 100%; }
        textarea.input { resize: vertical; min-height: 80px; }
        .btn-action {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-action:hover { transform: translateY(-1px); opacity: 0.95; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body data-theme="dark">

    <div id="toastNotification">✨ <span id="toastText">Action exécutée</span></div>

    <div id="appHeader" style="display:none;">
        <header>
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
                <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo ELAWS" class="app-logo">
                <div class="title">E.V.A.T. & ELAWS</div>
            </div>
            <div class="header-right">
                <button class="btn-top" onclick="changerTheme()">🎨 Thème</button>
                <button class="btn-top" onclick="changerProfilSession()">👤 Profils</button>
            </div>
        </header>
        <div class="badge-info">🌍 Écosystème Souverain Multi-Profils & Logo Actif</div>
    </div>

    <!-- BANDEAU D'INSTALLATION AUTOMATIQUE FORCÉ -->
    <div id="installBanner" class="card" style="display:none; border-color:var(--accent); background:rgba(5,150,105,0.15); text-align:center;">
        <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo" style="width:50px; height:50px; margin-bottom:8px; border-radius:12px;">
        <h3 class="card-title" style="color:var(--accent); margin-bottom:6px;">📲 Installer E.V.A.T. & ELAWS sur votre téléphone</h3>
        <p class="text" style="margin-bottom:12px;">Profitez de l'application en plein écran, rapide et 100% hors-ligne en un seul clic !</p>
        <button class="btn-action" id="btnInstallApp" style="font-size:15px; padding:14px;">Installer l'Application Immédiatement</button>
    </div>

    <div id="sideMenu" class="sidebar">
        <h3>📂 Navigation Globale E.V.A.T.</h3>
        <button class="menu-item" onclick="switchTab('accueil')">🏠 Accueil & Profil</button>
        <button class="menu-item" onclick="switchTab('objectifs')">🎯 Gestionnaire d'Objectifs & Vie</button>
        <button class="menu-item" onclick="switchTab('notes')">📓 Journal de Bord & Notes</button>
        <button class="menu-item" onclick="switchTab('factures')">🧾 Reçus & Factures</button>
        <button class="menu-item" onclick="switchTab('sauvegarde')">💾 Sauvegarde & Restauration (JSON)</button>
        <button class="menu-item" onclick="switchTab('dossiers')">📁 Assistant Visas & Séjour</button>
        <button class="menu-item" onclick="switchTab('convertisseur')">💱 Convertisseur de Devises</button>
        <button class="menu-item" onclick="switchTab('traduction')">🗣️ Pont de Traduction (ELAWS)</button>
        <button class="menu-item" onclick="switchTab('carnet')">📝 Carnet de Commandes</button>
        <button class="menu-item" onclick="switchTab('gps')">🧭 Géolocalisation & GPS</button>
        <button class="menu-item" onclick="switchTab('economie')">🪙 Finances & Caisse</button>
        <button class="menu-item" onclick="switchTab('camera')">📸 Caméra & Documents</button>
        <button class="menu-item" onclick="switchTab('securite')">🛡️ Sécurité & Chiffrement</button>
        <button class="menu-item" onclick="switchTab('ia')">🤖 Assistant ELAWS AI</button>
    </div>

    <div class="module-container" id="mainContent"></div>

    <div id="bottomBar" class="bottom-action-bar" style="display:none;">
        <button class="bar-item active" onclick="switchTab('accueil')" id="barAccueil">
            <span class="icon">🌍</span><span>Profil</span>
        </button>
        <button class="bar-item" onclick="switchTab('objectifs')" id="barObj">
            <span class="icon">🎯</span><span>Objectifs</span>
        </button>
        <button class="bar-item" onclick="switchTab('notes')" id="barNotes">
            <span class="icon">📓</span><span>Notes</span>
        </button>
        <button class="bar-item" onclick="switchTab('factures')" id="barFactures">
            <span class="icon">🧾</span><span>Factures</span>
        </button>
        <button class="bar-item" onclick="switchTab('sauvegarde')" id="barSauv">
            <span class="icon">💾</span><span>Backup</span>
        </button>
    </div>

    <script>
        let activeTab = 'accueil';
        
        let listeProfils = JSON.parse(localStorage.getItem('evat_tous_profils')) || [];
        let idProfilActif = localStorage.getItem('evat_profil_actif_id') || null;
        let utilisateurActif = null;

        function chargerDonneesProfil() {
            if (idProfilActif) {
                const trouve = listeProfils.find(p => p.id == idProfilActif);
                if (trouve) utilisateurActif = trouve;
            }
            if (!utilisateurActif && listeProfils.length > 0) {
                utilisateurActif = listeProfils[0];
                idProfilActif = utilisateurActif.id;
            }
        }

        chargerDonneesProfil();

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            const text = document.getElementById('toastText');
            text.innerHTML = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }

        // --- ENREGISTREMENT DU SERVICE WORKER & CAPTURE DE L'INSTALLATION AUTOMATIQUE ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Affiche le grand bouton d'installation automatique
            document.getElementById('installBanner').style.display = 'block';
        });

        document.getElementById('btnInstallApp').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBanner').style.display = 'none';
                    showToast("Application installée avec succès !");
                }
                deferredPrompt = null;
            } else {
                showToast("L'application est déjà installée ou prête sur votre écran.");
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript;base64,JG5hZ2lhdG9yLm9ubGluZSI=')
                .catch(() => {});
        }

        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('open'); }
        function changerTheme() { showToast("Thème basculé."); }

        function creerNouveauProfil() {
            const nom = document.getElementById('regNom').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const tel = document.getElementById('regTel').value.trim();
            const nat = document.getElementById('regNationalite').value;
            const pays = document.getElementById('regPaysActuel').value;

            if (!nom || !email) {
                showToast("Veuillez renseigner au moins votre nom et votre e-mail.");
                return;
            }

            const nouveauId = 'prof_' + Date.now();
            const nouveauProfil = {
                id: nouveauId,
                nom: nom,
                email: email,
                telephone: tel || '+228 00000000',
                nationalite: nat,
                paysActuel: pays,
                langueMaternelle: 'Français',
                metierActif: 'Conducteur / Chauffeur',
                metiers: [
                    { nom: 'Conducteur / Chauffeur', icone: '🚕', desc: 'GPS & Transport' },
                    { nom: 'Agriculteur', icone: '🌾', desc: 'Récoltes & Sols' },
                    { nom: 'Artisan / Entrepreneur', icone: '✂️', desc: 'Devis & Commerce' },
                    { nom: 'Explorateur / Voyageur', icone: '🌍', desc: 'Mobilité Globale' }
                ],
                objectifs: [
                    { id: 1, categorie: "Finances & Business", titre: "Établir l'autonomie et structurer la caisse", statut: "En cours" }
                ],
                notes: [
                    { id: 1, titre: "Bienvenue dans E.V.A.T.", texte: "Votre espace souverain est sécurisé.", date: new Date().toLocaleDateString() }
                ],
                solde: 50000,
                carnet: []
            };

            listeProfils.push(nouveauProfil);
            localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils));
            localStorage.setItem('evat_profil_actif_id', nouveauId);
            
            idProfilActif = nouveauId;
            utilisateurActif = nouveauProfil;

            showToast(`Bienvenue, ${nom} ! Profil créé.`);
            document.getElementById('appHeader').style.display = 'block';
            document.getElementById('bottomBar').style.display = 'flex';
            render();
        }

        function changerProfilSession() {
            idProfilActif = null;
            utilisateurActif = null;
            localStorage.removeItem('evat_profil_actif_id');
            document.getElementById('appHeader').style.display = 'none';
            document.getElementById('bottomBar').style.display = 'none';
            document.getElementById('sideMenu').classList.remove('open');
            render();
        }

        function selectionnerProfilExistant(id) {
            idProfilActif = id;
            localStorage.setItem('evat_profil_actif_id', id);
            chargerDonneesProfil();
            showToast(`Profil chargé : ${utilisateurActif.nom}`);
            document.getElementById('appHeader').style.display = 'block';
            document.getElementById('bottomBar').style.display = 'flex';
            render();
        }

        function selectionnerMetier(nom) {
            utilisateurActif.metierActif = nom;
            sauvegarderProfilActif();
            showToast(`Profil actif : ${nom}`);
            render();
        }

        function sauvegarderProfilActif() {
            const index = listeProfils.findIndex(p => p.id == utilisateurActif.id);
            if (index !== -1) {
                listeProfils[index] = utilisateurActif;
                localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils));
            }
        }

        function mettreAJourIdentite() {
            utilisateurActif.nom = document.getElementById('inputNomUtilisateur').value.trim() || utilisateurActif.nom;
            utilisateurActif.nationalite = document.getElementById('selectNationalite').value;
            utilisateurActif.paysActuel = document.getElementById('selectPaysActuel').value;
            utilisateurActif.email = document.getElementById('inputEmailUtilisateur').value.trim() || utilisateurActif.email;
            utilisateurActif.telephone = document.getElementById('inputTelUtilisateur').value.trim() || utilisateurActif.telephone;
            
            sauvegarderProfilActif();
            showToast("Informations de profil mises à jour !");
            render();
        }

        function ajouterObjectifVie() {
            const cat = document.getElementById('objCategorie').value;
            const titre = document.getElementById('objTitre').value.trim();
            if (titre) {
                utilisateurActif.objectifs.unshift({ id: Date.now(), categorie: cat, titre, statut: "En cours" });
                sauvegarderProfilActif();
                document.getElementById('objTitre').value = '';
                showToast("Objectif de vie ajouté !");
                render();
            } else {
                showToast("Veuillez saisir l'intitulé.");
            }
        }

        function ajouterNoteJournal() {
            const titre = document.getElementById('noteTitre').value.trim();
            const texte = document.getElementById('noteTexte').value.trim();
            if (titre && texte) {
                utilisateurActif.notes.unshift({ id: Date.now(), titre, texte, date: new Date().toLocaleDateString() });
                sauvegarderProfilActif();
                document.getElementById('noteTitre').value = '';
                document.getElementById('noteTexte').value = '';
                showToast("Note enregistrée !");
                render();
            } else {
                showToast("Remplissez tous les champs.");
            }
        }

        function genererRecuFacture() {
            const client = document.getElementById('factureClient').value.trim();
            const service = document.getElementById('factureService').value.trim();
            const montant = document.getElementById('factureMontant').value;
            const devise = document.getElementById('factureDevise').value;

            if (client && service && montant) {
                const recuHtml = `
                    <div style="background:#ffffff; color:#0f172a; padding:20px; border-radius:10px; border:2px dashed var(--accent);">
                        <div style="text-align:center; border-bottom:2px solid #cbd5e1; padding-bottom:10px; margin-bottom:10px;">
                            <img src="https://img.icons8.com/color/48/000000/artificial-intelligence.png" style="width:32px; height:32px; vertical-align:middle; margin-right:8px;">
                            <h3 style="margin:0; display:inline-block; color:#059669;">🧾 REÇU DE PRESTATION</h3>
                            <br><small>E.V.A.T. & ELAWS — ${utilisateurActif.nom}</small>
                        </div>
                        <p><strong>Date :</strong> ${new Date().toLocaleDateString()}</p>
                        <p><strong>Émetteur :</strong> ${utilisateurActif.nom} (${utilisateurActif.telephone})</p>
                        <p><strong>Client :</strong> ${client}</p>
                        <p><strong>Prestation :</strong> ${service}</p>
                        <p style="font-size:16px;"><strong>Montant :</strong> <span style="color:#059669; font-weight:800;">${parseFloat(montant).toLocaleString()} ${devise}</span></p>
                    </div>
                `;
                document.getElementById('resultatFacture').innerHTML = recuHtml;
                showToast("Facture générée !");
            } else {
                showToast("Remplissez tous les champs.");
            }
        }

        function exporterDonneesJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(utilisateurActif, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `EVAT_Profil_${utilisateurActif.nom.replace(/\s+/g, '_')}_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Sauvegarde JSON exportée !");
        }

        function render() {
            const content = document.getElementById('mainContent');
            content.innerHTML = '';

            if (!utilisateurActif) {
                document.getElementById('appHeader').style.display = 'none';
                document.getElementById('bottomBar').style.display = 'none';

                let profilsExistantsHtml = '';
                if (listeProfils.length > 0) {
                    profilsExistantsHtml = `<div style="margin-bottom:20px;"><h4 style="margin-bottom:8px;">👥 Ou choisissez un profil existant :</h4><div style="display:flex; flex-direction:column; gap:8px;">`;
                    listeProfils.forEach(p => {
                        profilsExistantsHtml += `<button class="btn-action" style="background:var(--card-bg); border:1px solid var(--accent); color:var(--text-main); text-align:left; padding:12px;" onclick="selectionnerProfilExistant('${p.id}')">👤 <strong>${p.nom}</strong> <small style="float:right; color:var(--text-secondary);">${p.nationalite}</small></button>`;
                    });
                    profilsExistantsHtml += `</div></div>`;
                }

                content.innerHTML = `
                    <div class="card" style="border-color:var(--accent); max-width:500px; margin: 20px auto; text-align:center;">
                        <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo ELAWS" style="width:72px; height:72px; margin-bottom:10px; border-radius:16px; border:2px solid var(--accent); box-shadow:0 0 20px rgba(5,150,105,0.4);">
                        <h2 style="color:var(--accent); margin-top:0;">✨ E.V.A.T. & ELAWS</h2>
                        <p class="text" style="text-align:center;">Écosystème Souverain Multi-Profils. Créez votre espace personnel pour sécuriser vos données en local.</p>
                        
                        ${profilsExistantsHtml}

                        <div style="text-align:left;">
                            <h4 style="margin-bottom:10px; border-top:1px solid var(--border-color); padding-top:15px;">📝 Créer un nouveau profil :</h4>
                            <label style="font-size:11px; color:var(--text-secondary);">Nom complet ou Pseudonyme * :</label>
                            <input type="text" id="regNom" class="input" placeholder="Ex: Jean Dupont">
                            
                            <label style="font-size:11px; color:var(--text-secondary);">Adresse E-mail * :</label>
                            <input type="email" id="regEmail" class="input" placeholder="Ex: monemail@domaine.com">

                            <label style="font-size:11px; color:var(--text-secondary);">Téléphone :</label>
                            <input type="text" id="regTel" class="input" placeholder="Ex: +228 98000000">

                            <div style="display:flex; gap:8px;">
                                <div style="flex:1;">
                                    <label style="font-size:11px; color:var(--text-secondary);">Nationalité :</label>
                                    <select id="regNationalite" class="input">
                                        <option value="Togolais">🇹🇬 Togolais</option>
                                        <option value="Allemand">🇩🇪 Allemand</option>
                                        <option value="Anglais">🇬🇧 Anglais</option>
                                        <option value="Haïtien">🇭🇹 Haïtien</option>
                                        <option value="Amazonien">🌿 Amazonien</option>
                                    </select>
                                </div>
                                <div style="flex:1;">
                                    <label style="font-size:11px; color:var(--text-secondary);">Zone d'Évolution :</label>
                                    <select id="regPaysActuel" class="input">
                                        <option value="Togo / Afrique">Togo / Afrique</option>
                                        <option value="Amazonie / Sud">Amazonie / Sud</option>
                                        <option value="Europe / Allemagne">Europe / Allemagne</option>
                                    </select>
                                </div>
                            </div>

                            <button class="btn-action" style="margin-top:10px;" onclick="creerNouveauProfil()">🚀 Commencer mon Espace Souverain</button>
                        </div>
                    </div>
                `;
                return;
            }

            document.getElementById('appHeader').style.display = 'block';
            document.getElementById('bottomBar').style.display = 'flex';

            document.querySelectorAll('.bar-item').forEach(el => el.classList.remove('active'));
            if(activeTab === 'accueil') document.getElementById('barAccueil')?.classList.add('active');
            if(activeTab === 'objectifs') document.getElementById('barObj')?.classList.add('active');
            if(activeTab === 'notes') document.getElementById('barNotes')?.classList.add('active');
            if(activeTab === 'factures') document.getElementById('barFactures')?.classList.add('active');
            if(activeTab === 'sauvegarde') document.getElementById('barSauv')?.classList.add('active');

            if (activeTab === 'accueil') {
                let cartesMetiersHtml = '';
                utilisateurActif.metiers.forEach(m => {
                    const isActive = m.nom === utilisateurActif.metierActif ? 'active' : '';
                    cartesMetiersHtml += `
                        <div class="metier-card-widget ${isActive}" onclick="selectionnerMetier('${m.nom}')">
                            <div style="font-size:20px; margin-bottom:4px;">${m.icone}</div>
                            <div style="font-weight:700; font-size:13px;">${m.nom}</div>
                            <div style="font-size:11px; color:var(--text-secondary);">${m.desc}</div>
                        </div>
                    `;
                });

                content.innerHTML = `
                    <div class="card" style="border-color: var(--accent);">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <div>
                                <span style="font-size:11px; color:var(--accent); font-weight:700;">👤 ESPACE PROFIL SOUVERAIN</span>
                                <div style="font-size:17px; font-weight:800;">${utilisateurActif.nom}</div>
                            </div>
                            <button class="btn-top" onclick="changerProfilSession()">🔄 Changer</button>
                        </div>
                        <p class="text" style="margin-bottom:12px;">Vos informations personnelles et coordonnées sécurisées :</p>
                        
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px; display:flex; flex-direction:column; gap:10px;">
                            <div>
                                <label style="font-size:11px; color:var(--text-secondary);">Nom ou Pseudonyme :</label>
                                <input type="text" id="inputNomUtilisateur" class="input" value="${utilisateurActif.nom}" style="margin-top:4px;">
                            </div>
                            <div style="display:flex; gap:8px;">
                                <div style="flex:1;">
                                    <label style="font-size:11px; color:var(--text-secondary);">Nationalité :</label>
                                    <select id="selectNationalite" class="input" style="margin-top:4px;">
                                        <option value="Togolais" ${utilisateurActif.nationalite === 'Togolais' ? 'selected' : ''}>🇹🇬 Togolais</option>
                                        <option value="Allemand" ${utilisateurActif.nationalite === 'Allemand' ? 'selected' : ''}>🇩🇪 Allemand</option>
                                        <option value="Anglais" ${utilisateurActif.nationalite === 'Anglais' ? 'selected' : ''}>🇬🇧 Anglais</option>
                                        <option value="Haïtien" ${utilisateurActif.nationalite === 'Haïtien' ? 'selected' : ''}>🇭🇹 Haïtien</option>
                                        <option value="Amazonien" ${utilisateurActif.nationalite === 'Amazonien' ? 'selected' : ''}>🌿 Amazonien</option>
                                    </select>
                                </div>
                                <div style="flex:1;">
                                    <label style="font-size:11px; color:var(--text-secondary);">Zone d'Évolution :</label>
                                    <select id="selectPaysActuel" class="input" style="margin-top:4px;">
                                        <option value="Togo / Afrique" ${utilisateurActif.paysActuel.includes('Togo') ? 'selected' : ''}>Togo / Afrique</option>
                                        <option value="Amazonie / Sud" ${utilisateurActif.paysActuel.includes('Amazonie') ? 'selected' : ''}>Amazonie / Sud</option>
                                        <option value="Europe / Allemagne" ${utilisateurActif.paysActuel.includes('Europe') ? 'selected' : ''}>Europe / Allemagne</option>
                                    </select>
                                </div>
                            </div>
                            <div style="display:flex; gap:8px;">
                                <div style="flex:1;">
                                    <label style="font-size:11px; color:var(--text-secondary);">E-mail :</label>
                                    <input type="email" id="inputEmailUtilisateur" class="input" value="${utilisateurActif.email}" style="margin-top:4px;">
                                </div>
                                <div style="flex:1;">
                                    <label style="font-size:11px; color:var(--text-secondary);">Téléphone :</label>
                                    <input type="text" id="inputTelUtilisateur" class="input" value="${utilisateurActif.telephone}" style="margin-top:4px;">
                                </div>
                            </div>
                            <button class="btn-action" style="padding:10px; font-size:13px; margin-top:4px;" onclick="mettreAJourIdentite()">💾 Enregistrer les Modifications</button>
                        </div>

                        <div style="font-size:14px; font-weight:800; margin-bottom:8px;">Sélectionnez votre rôle :</div>
                        <div class="grid-metiers">
                            ${cartesMetiersHtml}
                        </div>
                    </div>
                `;
            } else if (activeTab === 'objectifs') {
                let objHtml = '';
                utilisateurActif.objectifs.forEach(o => {
                    objHtml += `
                        <div class="tool-card" style="margin-bottom:10px; background:var(--bg-color); padding:12px; border-radius:8px; border-left:4px solid var(--accent);">
                            <span style="font-size:11px; color:var(--accent); font-weight:700;">📌 ${o.categorie}</span><br>
                            <strong style="font-size:14px;">${o.titre}</strong><br>
                            <small style="color:var(--text-secondary);">Statut : ${o.statut}</small>
                        </div>
                    `;
                });
                content.innerHTML = `
                    <div class="card" style="border-color:var(--accent);">
                        <h3 class="card-title">🎯 Gestionnaire d'Objectifs de Vie & Autonomie</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <label style="font-size:11px; color:var(--text-secondary);">Catégorie :</label>
                            <select id="objCategorie" class="input" style="margin-top:4px; margin-bottom:8px;">
                                <option value="Finances & Business">🪙 Finances & Business</option>
                                <option value="Mobilité & Papiers">📁 Mobilité & Papiers</option>
                                <option value="Développement Personnel">🧠 Développement Personnel</option>
                                <option value="Famille & Proches">👨‍👩‍👧 Famille & Proches</option>
                            </select>
                            <input type="text" id="objTitre" class="input" placeholder="Intitulé de l'objectif..." style="margin-bottom:10px;">
                            <button class="btn-action" onclick="ajouterObjectifVie()">➕ Ajouter l'Objectif</button>
                        </div>
                        ${objHtml}
                    </div>
                `;
            } else if (activeTab === 'notes') {
                let notesHtml = '';
                utilisateurActif.notes.forEach(n => {
                    notesHtml += `
                        <div class="tool-card" style="margin-bottom:10px; background:var(--bg-color); padding:12px; border-radius:8px;">
                            <strong>📌 ${n.titre}</strong> <small style="float:right; color:var(--text-secondary);">${n.date}</small><br>
                            <p style="margin:6px 0 0 0; font-size:13px; color:var(--text-secondary);">${n.texte}</p>
                        </div>
                    `;
                });
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">📓 Journal de Bord (ELAWS)</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <input type="text" id="noteTitre" class="input" placeholder="Titre de la note" style="margin-bottom:8px;">
                            <textarea id="noteTexte" class="input" placeholder="Contenu..." style="margin-bottom:10px;"></textarea>
                            <button class="btn-action" onclick="ajouterNoteJournal()">➕ Ajouter</button>
                        </div>
                        ${notesHtml}
                    </div>
                `;
            } else if (activeTab === 'factures') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">🧾 Générateur de Reçus & Factures</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <input type="text" id="factureClient" class="input" placeholder="Nom du client" style="margin-bottom:8px;">
                            <input type="text" id="factureService" class="input" placeholder="Prestation" style="margin-bottom:8px;">
                            <div style="display:flex; gap:8px; margin-bottom:10px;">
                                <input type="number" id="factureMontant" class="input" placeholder="Montant">
                                <select id="factureDevise" class="input" style="flex:0.6;"><option value="FCFA">FCFA</option><option value="EUR">EUR</option><option value="USD">USD</option></select>
                            </div>
                            <button class="btn-action" onclick="genererRecuFacture()">Générer</button>
                        </div>
                        <div id="resultatFacture">Remplissez les champs ci-dessus.</div>
                    </div>
                `;
            } else if (activeTab === 'sauvegarde') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">💾 Sauvegarde & Restauration Souveraine (JSON)</h3>
                        <button class="btn-action" onclick="exporterDonneesJSON()" style="margin-bottom:12px;">📥 Exporter mon Profil JSON</button>
                        <p class="text">Chaque profil dispose de son propre fichier de sauvegarde indépendant.</p>
                    </div>
                `;
            } else {
                content.innerHTML = `<div class="card"><h3 class="card-title">🛠️ Module actif</h3><p class="text">Prêt pour ${utilisateurActif.nom}.</p></div>`;
            }
        }

        function switchTab(t) { activeTab = t; document.getElementById('sideMenu').classList.remove('open'); render(); window.scrollTo(0, 0); }
        render();
    </script>
</body>
</html>
