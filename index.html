<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVAT & ELAWS v29.7</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body data-theme="dark">
    <div id="toastNotification" class="toast"><span id="toastText"></span></div>
    
    <header id="appHeader" class="header" style="display:none;">
        <div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="btn-top" onclick="toggleMenu()">☰ Menu</button>
                <span id="badgeDomaineActif" style="font-size:12px; font-weight:700; color:var(--accent);">EVAT</span>
            </div>
            <button class="btn-top" onclick="changerTheme()">🎨 Thème</button>
        </div>
    </header>

    <div id="sideMenu" class="side-menu">
        <h3 style="color:var(--accent); margin-top:0;">🌟 Navigation EVAT</h3>
        <button class="btn-action" style="margin-bottom:8px; background:var(--card-bg); border:1px solid var(--accent); color:var(--text-main);" onclick="switchTab('dashboard')">📊 Tableau de Bord</button>
        <button class="btn-action" style="margin-bottom:8px; background:var(--card-bg); border:1px solid var(--accent); color:var(--text-main);" onclick="switchTab('elaws_compagnon')">🤖 Compagnon ELAWS</button>
        <button class="btn-action" style="margin-bottom:8px; background:var(--card-bg); border:1px solid var(--accent); color:var(--text-main);" onclick="switchTab('outils_metier')">🛠️ Outils Métier</button>
        <button class="btn-action" style="margin-bottom:8px; background:var(--card-bg); border:1px solid var(--accent); color:var(--text-main);" onclick="switchTab('voyages_papiers')">✈️ Visas & Papiers</button>
        <button class="btn-action" style="margin-bottom:8px; background:var(--card-bg); border:1px solid var(--accent); color:var(--text-main);" onclick="switchTab('appels_traduction')">📞 Appels & Traduction</button>
        <button class="btn-action" style="margin-top:20px; background:#ef4444;" onclick="changerProfilSession()">🔄 Changer de Profil</button>
    </div>

    <main id="mainContent" class="main-container"></main>

    <nav id="bottomBar" class="bottom-bar" style="display:none;">
        <button class="bar-item active" id="barAccueil" onclick="switchTab('dashboard')">📊<span>Dash</span></button>
        <button class="bar-item" id="barElaws" onclick="switchTab('elaws_compagnon')">🤖<span>ELAWS</span></button>
        <button class="bar-item" id="barOutil" onclick="switchTab('outils_metier')">🛠️<span>Métier</span></button>
        <button class="bar-item" id="barVoyage" onclick="switchTab('voyages_papiers')">✈️<span>Voyages</span></button>
        <button class="bar-item" id="barAppel" onclick="switchTab('appels_traduction')">📞<span>Appels</span></button>
    </nav>

    <script src="elaws.js"></script>
    <script src="app.js"></script>
</body>
</html>
