<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.V.A.T. & ELAWS - Écosystème Universel Intégral (v24.2)</title>
    
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#059669">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #34d399;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --accent: #059669;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        [data-theme="eco"] {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #22c55e;
            --text-secondary: #15803d;
            --accent: #22c55e;
            --accent-gradient: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            --border-color: #14532d;
            --shadow: 0 0 15px rgba(34, 197, 94, 0.15);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 90px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-logo { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 2px solid var(--accent); }
        .menu-toggle { background: var(--accent-gradient); color: white; border: none; padding: 10px 14px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; transition: transform 0.2s; }
        .menu-toggle:active { transform: scale(0.95); }
        .title { font-size: 1.05rem; font-weight: 800; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .btn-top { background-color: var(--border-color); padding: 8px 12px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; color: var(--text-main); cursor: pointer; }
        .badge-info { font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .offline-status { background: rgba(16, 185, 129, 0.2); color: var(--accent); padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 800; }
        
        .bottom-action-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border-color);
            padding: 10px 15px; display: flex; justify-content: space-around; align-items: center; z-index: 999; box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }
        .bar-item { background: none; border: none; color: var(--text-secondary); font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; transition: color 0.2s; }
        .bar-item span.icon { font-size: 16px; }
        .bar-item.active, .bar-item:hover { color: var(--accent); }

        #toastNotification {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--card-bg); color: var(--text-main); border: 1px solid var(--accent); padding: 12px 20px;
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); font-size: 13px; font-weight: 700; z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease; opacity: 0; display: flex; align-items: center; gap: 8px; text-align: center;
        }
        #toastNotification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .sidebar { display: none; background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: var(--shadow); max-height: 75vh; overflow-y: auto; animation: fadeIn 0.3s ease; }
        .sidebar.open { display: block; }
        .sidebar h3 { font-size: 0.95rem; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        .menu-item { background: rgba(16, 185, 129, 0.08); color: var(--text-main); padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; border: none; width: 100%; text-align: left; font-size: 0.85rem; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .menu-item:hover { background: rgba(16, 185, 129, 0.18); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .module-container { flex: 1; max-width: 750px; width: 100%; margin: 0 auto; animation: fadeIn 0.3s ease; }
        .card { background-color: var(--card-bg); padding: 22px; border-radius: 14px; margin-bottom: 15px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-top: 0; margin-bottom: 10px; }
        .text { font-size: 14px; color: var(--text-secondary); margin-bottom: 15px; line-height: 1.6; }
        .input { width: 100%; border: 1px solid var(--border-color); border-radius: 8px; padding: 11px; background: var(--card-bg); color: var(--text-main); font-size: 14px; outline: none; margin-bottom: 10px; transition: border-color 0.2s; }
        .input:focus { border-color: var(--accent); }
        select.input { width: 100%; }
        .btn-action { background: var(--accent-gradient); color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14px; box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25); transition: transform 0.1s, opacity 0.2s; }
        .btn-action:active { transform: scale(0.98); opacity: 0.9; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background: var(--bg-color); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; text-align: center; }
        .stat-num { font-size: 18px; font-weight: 800; color: var(--accent); margin-top: 4px; }
        
        .badge-gamified { display: inline-flex; align-items: center; gap: 5px; background: rgba(5, 150, 105, 0.15); border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; margin-bottom: 12px; }
    </style>
</head>
<body data-theme="dark">

    <div id="toastNotification">✨ <span id="toastText">Action</span></div>

    <div id="appHeader" style="display:none;">
        <header>
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
                <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo ELAWS" class="app-logo">
                <div class="title">E.V.A.T. & ELAWS</div>
            </div>
            <div class="header-right">
                <button class="btn-top" onclick="changerTheme()">🎨 Thème</button>
                <button class="btn-top" onclick="changerProfilSession()">👤 Profils</button>
            </div>
        </header>
        <div class="badge-info">
            <span id="badgeDomaineActif">🌍 Écosystème Universel Intégral (v24.2)</span>
            <span class="offline-status" id="reseauStatusIndicator">⚡ Verrouillé & Prêt</span>
        </div>
    </div>

    <div id="sideMenu" class="sidebar">
        <h3>📂 Navigation Universelle (v24.2 Intégrale)</h3>
        <button class="menu-item" onclick="switchTab('accueil')">🏠 Accueil & Profil Actif</button>
        <button class="menu-item" onclick="switchTab('appels_traduction')" style="background:rgba(14,165,233,0.2); border:1px solid #0ea5e9; color:#0ea5e9;">📞 <strong>Appels (GSM & Internet) & Traduction Dialecte</strong></button>
        <button class="menu-item" onclick="switchTab('elaws_compagnon')" style="background:rgba(5,150,105,0.2); border:1px solid var(--accent);">🤖 <strong>Parler à ELAWS (Micro & Vocal 🎤)</strong></button>
        <button class="menu-item" onclick="switchTab('outils_metier')" style="background:rgba(245,158,11,0.15); border:1px solid #f59e0b; color:#f59e0b;">✂️ <strong>Outils Spécifiques Métier (Tous Corps)</strong></button>
        <button class="menu-item" onclick="switchTab('voyages_papiers')" style="background:rgba(14,165,233,0.15); border:1px solid #0ea5e9; color:#0ea5e9;">✈️ <strong>Voyages, Passeport & CNI</strong></button>
        <button class="menu-item" onclick="switchTab('dashboard')" style="background:rgba(59,130,246,0.15); border:1px solid #3b82f6; color:#3b82f6;">📊 <strong>Tableau de Bord & Score</strong></button>
        <button class="menu-item" onclick="switchTab('agenda')" style="background:rgba(245,158,11,0.15); border:1px solid #f59e0b; color:#f59e0b;">📅 <strong>Agenda & Rendez-vous</strong></button>
        <button class="menu-item" onclick="switchTab('economie')">🪙 Journal de Caisse & Trésorerie</button>
        <button class="menu-item" onclick="switchTab('facturation')">📄 Facturation & Reçus</button>
        <button class="menu-item" onclick="switchTab('sauvegarde')">💾 Sauvegarde & Sécurité</button>
    </div>

    <div class="module-container" id="mainContent"></div>

    <div id="bottomBar" class="bottom-action-bar" style="display:none;">
        <button class="bar-item active" onclick="switchTab('accueil')" id="barAccueil"><span class="icon">💼</span><span>Profil</span></button>
        <button class="bar-item" onclick="switchTab('appels_traduction')" id="barAppel" style="color:#0ea5e9;"><span class="icon">📞</span><span>Appels & Trad</span></button>
        <button class="bar-item" onclick="switchTab('elaws_compagnon')" id="barElaws" style="color:var(--accent);"><span class="icon">🤖</span><span>ELAWS</span></button>
        <button class="bar-item" onclick="switchTab('outils_metier')" id="barOutil" style="color:#f59e0b;"><span class="icon">✂️</span><span>Métier</span></button>
        <button class="bar-item" onclick="switchTab('voyages_papiers')" id="barVoyage" style="color:#0ea5e9;"><span class="icon">✈️</span><span>Voyages</span></button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        let activeTab = 'accueil';
        let currentThemeIndex = 0;
        const themes = ['dark', 'light', 'eco'];

        function jouerSonSucces() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function changerTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            document.body.setAttribute('data-theme', themes[currentThemeIndex]);
            showToast(`Thème : ${themes[currentThemeIndex].toUpperCase()}`);
        }

        let listeProfils = JSON.parse(localStorage.getItem('evat_tous_profils')) || [];
        let idProfilActif = localStorage.getItem('evat_profil_actif_id') || null;
        let utilisateurActif = null;

        function chargerDonneesProfil() {
            if (idProfilActif) {
                utilisateurActif = listeProfils.find(p => p.id == idProfilActif) || null;
            }
            if (!utilisateurActif && listeProfils.length > 0) {
                utilisateurActif = listeProfils[0];
                idProfilActif = utilisateurActif.id;
                localStorage.setItem('evat_profil_actif_id', idProfilActif);
            }
        }
        chargerDonneesProfil();

        function showToast(m) {
            const t = document.getElementById('toastNotification');
            document.getElementById('toastText').innerHTML = m;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('open'); }

        function creerNouveauProfil() {
            const nom = document.getElementById('regNom').value.trim();
            const contact = document.getElementById('regContact').value.trim();
            const selectMetier = document.getElementById('selectMetierBase').value;
            const metierCustom = document.getElementById('regMetierCustom').value.trim();
            const metierUnique = metierCustom || selectMetier;

            if (!nom) { showToast("Veuillez renseigner votre nom."); return; }

            const nouveauId = 'prof_' + Date.now();
            const nouveauProfil = {
                id: nouveauId,
                nom: nom,
                contact: contact || "Non renseigné",
                metierUnique: metierUnique,
                solde: 50000,
                journalCaisse: [
                    { id: 1, type: 'entree', libelle: 'Capital initial', montant: 50000, date: new Date().toLocaleDateString() }
                ],
                factures: [],
                agendaRdv: [],
                mesuresCouture: [],
                consultationsMedicales: [],
                stocksBoutique: [],
                notesPastorales: [],
                ateliersMecanique: [],
                coursEnseignant: [],
                dossiersVoyagePapiers: [],
                carnetContacts: [],
                discussionsElaws: [
                    { role: 'ai', texte: `Bonjour ${nom} ! Bienvenue dans EVAT & ELAWS (v24.2). Ton numéro (${contact || 'Non défini'}) est enregistré. Tous les outils, les appels GSM/Internet avec traduction en direct des dialectes, et l'assistant voyages sont prêts.` }
                ]
            };

            listeProfils.push(nouveauProfil);
            localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils));
            localStorage.setItem('evat_profil_actif_id', nouveauId);
            
            idProfilActif = nouveauId;
            utilisateurActif = nouveauProfil;

            jouerSonSucces();
            showToast(`Bienvenue, ${nom} !`);
            render();
        }

        function changerProfilSession() {
            idProfilActif = null; utilisateurActif = null;
            localStorage.removeItem('evat_profil_actif_id');
            render();
        }

        function selectionnerProfilExistant(id) {
            idProfilActif = id;
            localStorage.setItem('evat_profil_actif_id', id);
            chargerDonneesProfil();
            showToast(`Profil chargé : ${utilisateurActif.nom}`);
            render();
        }

        function sauvegarderProfilActif() {
            const index = listeProfils.findIndex(p => p.id == utilisateurActif.id);
            if (index !== -1) { listeProfils[index] = utilisateurActif; localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils)); }
        }

        // --- GESTION DES CONTACTS & APPELS (GSM & INTERNET) AVEC TRADUCTION DE DIALECTE ---
        function mettreAJourMonContact() {
            const nouveauNum = document.getElementById('monNumeroContact')?.value.trim();
            if(nouveauNum) {
                utilisateurActif.contact = nouveauNum;
                sauvegarderProfilActif();
                jouerSonSucces();
                showToast("Votre numéro de contact a été mis à jour !");
                render();
            } else { showToast("Veuillez saisir un numéro valide."); }
        }

        function ajouterRepertoireContact() {
            const nomC = document.getElementById('nomContactRepertoire')?.value.trim();
            const numC = document.getElementById('numContactRepertoire')?.value.trim();
            const emailC = document.getElementById('emailContactRepertoire')?.value.trim();
            const dialC = document.getElementById('dialecteContactRepertoire')?.value || 'Français';

            if(nomC && numC) {
                if(!utilisateurActif.carnetContacts) utilisateurActif.carnetContacts = [];
                utilisateurActif.carnetContacts.unshift({ id: Date.now(), nom: nomC, numero: numC, email: emailC, dialecte: dialC });
                sauvegarderProfilActif();
                jouerSonSucces();
                showToast("Contact ajouté au répertoire !");
                render();
            } else { showToast("Indiquez au moins le nom et le numéro."); }
        }

        function lancerAppelGSM(numero) {
            window.location.href = `tel:${numero}`;
            showToast(`📞 Appel GSM en cours vers ${numero}...`);
        }

        function lancerAppelInternetAvecTraduction(nomDest, dialecteDest) {
            jouerSonSucces();
            showToast(`🌐 Appel Internet VoIP chiffré & Traduction ELAWS vers ${nomDest} (${dialecteDest})...`);
            setTimeout(() => {
                alert(`[Appel Intelligent ELAWS v24.2] 
Connexion établie avec ${nomDest} !
🗣️ Langue source détectée : Votre voix.
🔄 Traduction active en temps réel vers : ${dialecteDest}.
L'interlocuteur vous entendra instantanément dans sa propre langue/dialecte sans barrière linguistique !`);
            }, 600);
        }

        // --- OUTILS MÉTIERS & PAPIERS ---
        function enregistrerMesureCouture() {
            const client = document.getElementById('coutureClient')?.value.trim();
            const epaule = document.getElementById('coutureEpaule')?.value || '';
            const poitrine = document.getElementById('couturePoitrine')?.value || '';
            const longueur = document.getElementById('coutureLongueur')?.value || '';
            const details = document.getElementById('coutureDetails')?.value.trim() || '';

            if(client) {
                if(!utilisateurActif.mesuresCouture) utilisateurActif.mesuresCouture = [];
                utilisateurActif.mesuresCouture.unshift({ id: Date.now(), client, epaule, poitrine, longueur, details, date: new Date().toLocaleDateString() });
                sauvegarderProfilActif();
                jouerSonSucces();
                showToast("Mesures du client enregistrées !");
                render();
            } else { showToast("Veuillez indiquer le nom du client."); }
        }

        function ajouterNotePastorale() {
            const titre = document.getElementById('pasteurTitre')?.value.trim();
            const contenu = document.getElementById('pasteurContenu')?.value.trim();
            if(titre) {
                if(!utilisateurActif.notesPastorales) utilisateurActif.notesPastorales = [];
                utilisateurActif.notesPastorales.unshift({ id: Date.now(), titre, contenu, date: new Date().toLocaleDateString() });
                sauvegarderProfilActif();
                jouerSonSucces();
                showToast("Prédication enregistrée !");
                render();
            } else { showToast("Indiquez le titre du message."); }
        }

        function ajouterConsultationMedicale() {
            const patient = document.getElementById('medPatient')?.value.trim();
            const diagnostic = document.getElementById('medDiagnostic')?.value.trim();
            const prescription = document.getElementById('medPrescription')?.value.trim();

            if(patient && diagnostic) {
                if(!utilisateurActif.consultationsMedicales) utilisateurActif.consultationsMedicales = [];
                utilisateurActif.consultationsMedicales.unshift({ id: Date.now(), patient, diagnostic, prescription, date: new Date().toLocaleDateString() });
                sauvegarderProfilActif();
                jouerSonSucces();
                showToast("Consultation enregistrée !");
                render();
            } else { showToast("Remplissez le patient et le diagnostic."); }
        }

        function ajouterStockBoutique() {
            const article = document.getElementById('boutiqueArticle')?.value.trim();
            const qte = parseInt(document.getElementById('boutiqueQte')?.value);
            const prix = parseFloat(document.getElementById('boutiquePrix')?.value);

            if(article && !isNaN(qte) && !isNaN(prix)) {
                if(!utilisateurActif.stocksBoutique) utilisateurActif.stocksBoutique = [];
                utilisateurActif.stocksBoutique.unshift({ id: Date.now(), article, qte, prix });
                sauvegarderProfilActif();
                jouerSonSucces();
                showToast("Article ajouté au stock !");
                render();
            } else { showToast("Remplissez correctement les champs du stock."); }
        }

        function ajouterAtelierMecanique() {
            const vehicule = document.getElementById('mecaVehicule')?.value.trim();
            const panne = document.getElementById('mecaPanne')?.value.trim();
            const cout = parseFloat(document.getElementById('mecaCout')?.value) || 0;

            if(vehicule && panne) {
                if(!utilisateurActif.ateliersMecanique) utilisateurActif.ateliersMecanique = [];
                utilisateurActif.ateliersMecanique.unshift({ id: Date.now(), vehicule, panne, cout, date: new Date().toLocaleDateString() });
                sauvegarderProfilActif();
                jouerSonSucces();
                showToast("Réparation enregistrée !");
                render();
            } else { showToast("Remplissez le véhicule et la panne."); }
        }

        function verifierDossierPapier() {
            const typeDoc = document.getElementById('typeDocAdministratif')?.value;
            const paysDestination = document.getElementById('paysDestinationVoyage')?.value.trim() || "National / International";
            const resultatDiv = document.getElementById('resultatAnalyseDossier');
            if(!resultatDiv) return;

            let pieces = [];
            let conseils = "";

            if (typeDoc === 'passeport') {
                pieces = [
                    "Acte de naissance sécurisé (original ou copie certifiée)",
                    "Carte nationale d'identité biométrique valide",
                    "Certificat de nationalité",
                    "Photos d'identité aux normes (fond blanc)",
                    "Quittance / Reçu de paiement des frais de timbre passeport",
                    "Justificatif de domicile ou attestation de résidence"
                ];
                conseils = `Pour l'obtention ou le renouvellement de votre passeport pour ${paysDestination}, assurez-vous que tous vos documents d'état civil portent les mêmes noms et prénoms exacts.`;
            } else if (typeDoc === 'cni') {
                pieces = [
                    "Ancienne carte d'identité (en cas de renouvellement) ou Déclaration de perte",
                    "Acte de naissance original sécurisé",
                    "Certificat de nationalité",
                    "Justificatif de profession ou de résidence",
                    "Timbres fiscaux ou reçu de quittance"
                ];
                conseils = `Le dépôt pour la carte d'identité (CNI) se fait auprès des services compétents de votre localité. Vérifiez la validité de votre certificat de nationalité.`;
            } else if (typeDoc === 'sejour') {
                pieces = [
                    "Passeport en cours de validité",
                    "Visa d'établissement ou d'entrée",
                    "Contrat de travail ou attestation d'inscription / stage",
                    "Justificatif de logement (bail ou attestation d'hébergement)",
                    "Visite médicale / Carnet de vaccination international",
                    "Justificatifs de ressources financières"
                ];
                conseils = `Pour une carte de séjour ou un titre de résidence à ${paysDestination}, constituez votre dossier au moins 2 mois avant l'expiration de votre visa actuel.`;

        function sauvegarderDossierActif(doc, pays) {
            if(!utilisateurActif.dossiersVoyagePapiers) utilisateurActif.dossiersVoyagePapiers = [];
            utilisateurActif.dossiersVoyagePapiers.unshift({ id: Date.now(), doc, pays, date: new Date().toLocaleDateString() });

        // --- DISCUSSION ELAWS + MICRO ---
        function envoyerMessageElawsAI(texteForce) {
            const input = document.getElementById('inputElawsChat');
            const q = texteForce || (input ? input.value.trim() : '');
            if (!q) return;

            if (!utilisateurActif.discussionsElaws) utilisateurActif.discussionsElaws = [];
            utilisateurActif.discussionsElaws.push({ role: 'user', texte: q });

            const lowerQ = q.toLowerCase();
            let reponse = "";
            const metier = utilisateurActif.metierUnique.toLowerCase();

            if (lowerQ.includes('bonjour') || lowerQ.includes('salut') || lowerQ.includes('coucou')) {
                reponse = `Salut ${utilisateurActif.nom} ! Ton contact (${utilisateurActif.contact}) est bien enregistré. En tant que ${utilisateurActif.metierUnique}, je suis là pour t'assister, y compris pour la traduction vocale en direct lors des appels.`;
            } else if (lowerQ.includes('passeport') || lowerQ.includes('carte') || lowerQ.includes('voyage') || lowerQ.includes('sejour')) {
                reponse = `[Expert Voyages & Papiers ELAWS] Pour tes démarches de passeport, carte d'identité, carte de séjour ou visa, rends-toi dans l'onglet dédié "Voyages".`;
            } else if (lowerQ.includes('appel') || lowerQ.includes('contact') || lowerQ.includes('traduction')) {
                reponse = `[Appels & Traduction Dialecte] Tu peux lancer des appels GSM ou des appels Internet VoIP avec traduction instantanée des dialectes depuis l'onglet "Appels & Trad" !`;
            } else {
                reponse = `J'ai bien noté ton point : "${q}". Tout est verrouillé et sécurisé dans ton écosystème v24.2.`;
            }

            utilisateurActif.discussionsElaws.push({ role: 'ai', texte: reponse });
            sauvegarderProfilActif();
            jouerSonSucces();
            
            if(input) input.value = '';
            render();

            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(reponse));
            }
        }

        function demarrerMicroElaws() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast("Reconnaissance vocale non supportée.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            showToast("🎤 Parle à ELAWS, j'écoute...");
            recognition.onresult = (event) => {
                const texteRecu = event.results[0][0].transcript;
                const input = document.getElementById('inputElawsChat');
                if(input) input.value = texteRecu;
                envoyerMessageElawsAI(texteRecu);
            };
            recognition.onerror = () => { showToast("Erreur du micro."); };
            recognition.start();
        }

                                <button class="btn-action" style="background:#10b981;" onclick="ajouterStockBoutique()">➕ Ajouter au Stock</button>
                            </div>
                            <h4 style="margin-bottom:8px;">Inventaire Actuel :</h4>
                            ${stockHtml}
                        </div>
                    `;
                }

                if (metier.includes('mecanicien') || metier.includes('artisan')) {
                    let mecaHtml = '';
                    if(utilisateurActif.ateliersMecanique && utilisateurActif.ateliersMecanique.length > 0) {
                        utilisateurActif.ateliersMecanique.forEach(m => {
                            mecaHtml += `<div style="background:var(--bg-color); padding:10px; border-radius:8px; margin-bottom:8px; border-left:3px solid #f59e0b;"><strong>🔧 Véhicule : ${m.vehicule}</strong> (${m.date})<br>Panne : ${m.panne}<br>Coût : ${m.cout.toLocaleString()} FCFA</div>`;
                        });
                    } else { mecaHtml = '<p style="color:var(--text-secondary);">Aucun véhicule enregistré.</p>'; }

                    outilsHtml += `
                        <div class="card" style="border-color:#f59e0b;">
                            <h3 class="card-title" style="color:#f59e0b;">🔧 Suivi Atelier Mécanique</h3>
                            <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px; border:1px solid var(--border-color);">
                                <input type="text" id="mecaVehicule" class="input" placeholder="Véhicule / Client *" style="margin-bottom:8px;">
                                <input type="text" id="mecaPanne" class="input" placeholder="Description de la panne *" style="margin-bottom:8px;">
                                <input type="number" id="mecaCout" class="input" placeholder="Coût estimé (FCFA)" style="margin-bottom:10px;">
                                <button class="btn-action" style="background:#f59e0b;" onclick="ajouterAtelierMecanique()">💾 Enregistrer la Réparation</button>
                            </div>
                            <h4 style="margin-bottom:8px;">Véhicules en Atelier :</h4>
                            ${mecaHtml}
                        </div>
                    `;
                }

                if (!outilsHtml) {
                    outilsHtml = `
                        <div class="card" style="border-color:#f59e0b;">
                            <h3 class="card-title" style="color:#f59e0b;">🛠️ Espace Professionnel — ${utilisateurActif.metierUnique}</h3>
                            <p class="text">Votre profil et vos contacts sont pleinement actifs.</p>
                        </div>
                    `;
                }

                content.innerHTML = outilsHtml;
            } else if (activeTab === 'voyages_papiers') {
                let savedDossiersHtml = '';
                if(utilisateurActif.dossiersVoyagePapiers && utilisateurActif.dossiersVoyagePapiers.length > 0) {
                    utilisateurActif.dossiersVoyagePapiers.forEach(d => {
                        savedDossiersHtml += `<div style="background:var(--bg-color); padding:10px; border-radius:8px; margin-bottom:8px; border-left:3px solid #0ea5e9;"><strong>✈️ Document : ${d.doc.toUpperCase()}</strong> — Destination : ${d.pays} <small>(${d.date})</small></div>`;
                    });
                } else { savedDossiersHtml = '<p style="color:var(--text-secondary);">Aucun dossier sauvegardé.</p>'; }

                content.innerHTML = `
                    <div class="card" style="border-color:#0ea5e9;">
                        <h3 class="card-title" style="color:#0ea5e9;">✈️ Assistant Voyages, Passeport & Papiers d'Identité</h3>
                        <p class="text">Sélectionnez le document ou la démarche souhaitée pour obtenir instantanément la liste complète des pièces à fournir :</p>
                        
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px; border:1px solid var(--border-color);">
                            <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:4px;">Type de Document / Démarche :</label>
                            <select id="typeDocAdministratif" class="input" style="margin-bottom:8px;">
                                <option value="passeport">📘 Passeport Biométrique</option>
                                <option value="cni">🪪 Carte Nationale d'Identité (CNI)</option>
                                <option value="sejour">📄 Carte de Séjour / Résidence</option>
                                <option value="visa">✈️ Visa de Voyage / Tourisme</option>
                            </select>

                            <input type="text" id="paysDestinationVoyage" class="input" placeholder="Pays de destination ou d'émission (ex: Togo, France, etc.)" style="margin-bottom:10px;">
                            
                            <button class="btn-action" style="background:#0ea5e9;" onclick="verifierDossierPapier()">🔍 Afficher les Dossiers à Fournir</button>
                        </div>

                        <div id="resultatAnalyseDossier"></div>

                        <h4 style="margin-top:20px; margin-bottom:8px;">📁 Mes Dossiers Archivés :</h4>
                        ${savedDossiersHtml}
                    </div>
                `;
            } else if (activeTab === 'dashboard') {
                content.innerHTML = `
                    <div class="card" style="border-color:#3b82f6;">
                        <h3 class="card-title" style="color:#3b82f6;">📊 Tableau de Bord</h3>
                        <div class="stat-grid">
                            <div class="stat-box">
                                <div style="font-size:12px; color:var(--text-secondary);">Trésorerie Caisse</div>
                                <div class="stat-num" style="color:var(--accent);">${utilisateurActif.solde.toLocaleString()} FCFA</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'agenda') {
                content.innerHTML = `
                    <div class="card" style="border-color:#f59e0b;">
                        <h3 class="card-title" style="color:#f59e0b;">📅 Agenda & Rendez-vous</h3>
                        <p class="text">Planifiez vos rendez-vous professionnels.</p>
                    </div>
                `;
            } else if (activeTab === 'economie') {
                content.innerHTML = `
                    <div class="card" style="border-color:var(--accent);">
                        <h3 class="card-title">🪙 Journal de Caisse</h3>
                        <div style="font-size:24px; font-weight:800; color:var(--accent); text-align:center; padding:10px; background:var(--bg-color); border-radius:10px; margin-bottom:15px;">${utilisateurActif.solde.toLocaleString()} FCFA</div>
                    </div>
                `;
            }
        }

        function switchTab(t) { activeTab = t; document.getElementById('sideMenu').classList.remove('open'); render(); window.scrollTo(0, 0); }
        render();
    </script>
</body>
</html>
