<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.V.A.T. & ELAWS - Écosystème Souverain Immersif (v22.5 Final)</title>
    
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#059669">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #34d399;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --accent: #059669;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        [data-theme="eco"] {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #22c55e;
            --text-secondary: #15803d;
            --accent: #22c55e;
            --accent-gradient: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            --border-color: #14532d;
            --shadow: 0 0 15px rgba(34, 197, 94, 0.15);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 90px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-logo { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 2px solid var(--accent); }
        .menu-toggle { background: var(--accent-gradient); color: white; border: none; padding: 10px 14px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; transition: transform 0.2s; }
        .menu-toggle:active { transform: scale(0.95); }
        .title { font-size: 1.05rem; font-weight: 800; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .btn-top { background-color: var(--border-color); padding: 8px 12px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; color: var(--text-main); cursor: pointer; }
        .badge-info { font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .offline-status { background: rgba(16, 185, 129, 0.2); color: var(--accent); padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 800; }
        
        .bottom-action-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border-color);
            padding: 10px 15px; display: flex; justify-content: space-around; align-items: center; z-index: 999; box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }
        .bar-item { background: none; border: none; color: var(--text-secondary); font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; transition: color 0.2s; }
        .bar-item span.icon { font-size: 16px; }
        .bar-item.active, .bar-item:hover { color: var(--accent); }

        #toastNotification {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--card-bg); color: var(--text-main); border: 1px solid var(--accent); padding: 12px 20px;
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); font-size: 13px; font-weight: 700; z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease; opacity: 0; display: flex; align-items: center; gap: 8px; text-align: center;
        }
        #toastNotification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .sidebar { display: none; background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: var(--shadow); max-height: 75vh; overflow-y: auto; animation: fadeIn 0.3s ease; }
        .sidebar.open { display: block; }
        .sidebar h3 { font-size: 0.95rem; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        .menu-item { background: rgba(16, 185, 129, 0.08); color: var(--text-main); padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; border: none; width: 100%; text-align: left; font-size: 0.85rem; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .menu-item:hover { background: rgba(16, 185, 129, 0.18); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .module-container { flex: 1; max-width: 750px; width: 100%; margin: 0 auto; animation: fadeIn 0.3s ease; }
        .card { background-color: var(--card-bg); padding: 22px; border-radius: 14px; margin-bottom: 15px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-top: 0; margin-bottom: 10px; }
        .text { font-size: 14px; color: var(--text-secondary); margin-bottom: 15px; line-height: 1.6; }
        .input { width: 100%; border: 1px solid var(--border-color); border-radius: 8px; padding: 11px; background: var(--card-bg); color: var(--text-main); font-size: 14px; outline: none; margin-bottom: 10px; transition: border-color 0.2s; }
        .input:focus { border-color: var(--accent); }
        select.input { width: 100%; }
        .btn-action { background: var(--accent-gradient); color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14px; box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25); transition: transform 0.1s, opacity 0.2s; }
        .btn-action:active { transform: scale(0.98); opacity: 0.9; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background: var(--bg-color); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; text-align: center; }
        .stat-num { font-size: 18px; font-weight: 800; color: var(--accent); margin-top: 4px; }
        
        .badge-gamified { display: inline-flex; align-items: center; gap: 5px; background: rgba(5, 150, 105, 0.15); border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; margin-bottom: 12px; }
    </style>
</head>
<body data-theme="dark">

    <div id="toastNotification">✨ <span id="toastText">Action</span></div>

    <div id="appHeader" style="display:none;">
        <header>
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
                <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo ELAWS" class="app-logo">
                <div class="title">E.V.A.T. & ELAWS</div>
            </div>
            <div class="header-right">
                <button class="btn-top" onclick="changerTheme()">🎨 Thème</button>
                <button class="btn-top" onclick="changerProfilSession()">👤 Profils</button>
            </div>
        </header>
        <div class="badge-info">
            <span id="badgeDomaineActif">🌍 Écosystème Souverain Immersif (v22.5)</span>
            <span class="offline-status" id="reseauStatusIndicator">⚡ Hors-Ligne Prêt</span>
        </div>
    </div>

    <div id="sideMenu" class="sidebar">
        <h3>📂 Navigation & Outils (v22.5)</h3>
        <button class="menu-item" onclick="switchTab('accueil')">🏠 Accueil & Profil Actif</button>
        <button class="menu-item" onclick="switchTab('elaws_compagnon')" style="background:rgba(5,150,105,0.2); border:1px solid var(--accent);">🤖 <strong>Parler à ELAWS (Conversation Fluide)</strong></button>
        <button class="menu-item" onclick="switchTab('dashboard')" style="background:rgba(59,130,246,0.15); border:1px solid #3b82f6; color:#3b82f6;">📊 <strong>Tableau de Bord & Score</strong></button>
        <button class="menu-item" onclick="switchTab('agenda')" style="background:rgba(245,158,11,0.15); border:1px solid #f59e0b; color:#f59e0b;">📅 <strong>Agenda & Rendez-vous</strong></button>
        <button class="menu-item" onclick="switchTab('economie')">🪙 Journal de Caisse & Trésorerie</button>
        <button class="menu-item" onclick="switchTab('facturation')">📄 Facturation & Reçus</button>
        <button class="menu-item" onclick="switchTab('sauvegarde')">💾 Sauvegarde & Sécurité</button>
    </div>

    <div class="module-container" id="mainContent"></div>

    <div id="bottomBar" class="bottom-action-bar" style="display:none;">
        <button class="bar-item active" onclick="switchTab('accueil')" id="barAccueil"><span class="icon">💼</span><span>Profil</span></button>
        <button class="bar-item" onclick="switchTab('elaws_compagnon')" id="barElaws" style="color:var(--accent);"><span class="icon">🤖</span><span>ELAWS</span></button>
        <button class="bar-item" onclick="switchTab('dashboard')" id="barDash" style="color:#3b82f6;"><span class="icon">📊</span><span>Score</span></button>
        <button class="bar-item" onclick="switchTab('agenda')" id="barAgenda" style="color:#f59e0b;"><span class="icon">📅</span><span>Agenda</span></button>
        <button class="bar-item" onclick="switchTab('economie')" id="barEco"><span class="icon">🪙</span><span>Caisse</span></button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        let activeTab = 'accueil';
        let currentThemeIndex = 0;
        const themes = ['dark', 'light', 'eco'];

        function jouerSonSucces() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function changerTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            document.body.setAttribute('data-theme', themes[currentThemeIndex]);
            showToast(`Thème : ${themes[currentThemeIndex].toUpperCase()}`);
        }

        let listeProfils = JSON.parse(localStorage.getItem('evat_tous_profils')) || [];
        let idProfilActif = localStorage.getItem('evat_profil_actif_id') || null;
        let utilisateurActif = null;

        function chargerDonneesProfil() {
            if (idProfilActif) {
                utilisateurActif = listeProfils.find(p => p.id == idProfilActif) || null;
            }
            if (!utilisateurActif && listeProfils.length > 0) {
                utilisateurActif = listeProfils[0];
                idProfilActif = utilisateurActif.id;
                localStorage.setItem('evat_profil_actif_id', idProfilActif);
            }
        }
        chargerDonneesProfil();

        function showToast(m) {
            const t = document.getElementById('toastNotification');
            document.getElementById('toastText').innerHTML = m;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('open'); }

        function creerNouveauProfil() {
            const nom = document.getElementById('regNom').value.trim();
            const metierUnique = document.getElementById('regMetierCustom').value.trim() || 'Pasteur / Guide';

            if (!nom) { showToast("Veuillez renseigner votre nom."); return; }

            const nouveauId = 'prof_' + Date.now();
            const nouveauProfil = {
                id: nouveauId,
                nom: nom,
                metierUnique: metierUnique,
                solde: 50000,
                journalCaisse: [
                    { id: 1, type: 'entree', libelle: 'Capital initial', montant: 50000, date: new Date().toLocaleDateString() }
                ],
                factures: [],
                agendaRdv: [],
                discussionsElaws: [
                    { role: 'ai', texte: `Bonjour ${nom} ! C'est un plaisir de t'accompagner. En tant que ${metierUnique}, je suis là pour discuter avec toi en toute simplicité. Qu'est-ce qu'on fait aujourd'hui ?` }
                ]
            };

            listeProfils.push(nouveauProfil);
            localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils));
            localStorage.setItem('evat_profil_actif_id', nouveauId);
            
            idProfilActif = nouveauId;
            utilisateurActif = nouveauProfil;

            jouerSonSucces();
            showToast(`Bienvenue, ${nom} !`);
            render();
        }

        function changerProfilSession() {
            idProfilActif = null; utilisateurActif = null;
            localStorage.removeItem('evat_profil_actif_id');
            render();
        }

        function selectionnerProfilExistant(id) {
            idProfilActif = id;
            localStorage.setItem('evat_profil_actif_id', id);
            chargerDonneesProfil();
            showToast(`Profil chargé : ${utilisateurActif.nom}`);
            render();
        }

        function sauvegarderProfilActif() {
            const index = listeProfils.findIndex(p => p.id == utilisateurActif.id);
            if (index !== -1) { listeProfils[index] = utilisateurActif; localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils)); }
        }

        // --- DISCUSSION HUMAINE ET CONVERSATIONNELLE AVEC ELAWS ---
        function envoyerMessageElawsAI(texteForce) {
            const input = document.getElementById('inputElawsChat');
            const q = texteForce || (input ? input.value.trim() : '');
            if (!q) return;

            if (!utilisateurActif.discussionsElaws) utilisateurActif.discussionsElaws = [];
            utilisateurActif.discussionsElaws.push({ role: 'user', texte: q });

            const lowerQ = q.toLowerCase();
            let reponse = "";

            // Réactions naturelles et conversationnelles, sans jargon robotique
            if (lowerQ.includes('bonjour') || lowerQ.includes('salut') || lowerQ.includes('coucou')) {
                reponse = `Salut ${utilisateurActif.nom} ! Comment ça va aujourd'hui ? Qu'est-ce qu'on prépare ensemble ?`;
            } else if (lowerQ.includes('culte') || lowerQ.includes('prédication') || lowerQ.includes('foi') || lowerQ.includes('prier')) {
                reponse = `Frère ${utilisateurActif.nom}, pour ton message ou ton culte : appuie-toi sur la simplicité et l'écoute. Je suis là pour t'aider à structurer tes notes si tu veux !`;
            } else if (lowerQ.includes('argent') || lowerQ.includes('caisse') || lowerQ.includes('solde')) {
                reponse = `Ton solde actuel est de ${utilisateurActif.solde.toLocaleString()} FCFA. Veux-tu enregistrer un mouvement ?`;
            } else if (lowerQ.includes('fatigué') || lowerQ.includes('dur') || lowerQ.includes('stress')) {
                reponse = `Je comprends... Les journées peuvent être intenses. Prends une grande respiration, on gère les choses une par une.`;
            } else if (lowerQ.includes('merci')) {
                reponse = `Avec tout mon plaisir, ${utilisateurActif.nom} ! On forme une bonne équipe. Dis-moi la suite.`;
            } else {
                reponse = `J'ai bien capté ton idée : "${q}". C'est très clair. Dis-moi ce que tu veux qu'on pose en priorité sur ce sujet, je m'en charge.`;
            }

            utilisateurActif.discussionsElaws.push({ role: 'ai', texte: reponse });
            sauvegarderProfilActif();
            jouerSonSucces();
            
            if(input) input.value = '';
            render();

            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(reponse));
            }
        }

        function render() {
            const content = document.getElementById('mainContent');
            content.innerHTML = '';

            if (!utilisateurActif) {
                document.getElementById('appHeader').style.display = 'none';
                document.getElementById('bottomBar').style.display = 'none';
                
                let profilsExistantsHtml = '';
                if (listeProfils.length > 0) {
                    profilsExistantsHtml = `<div style="margin-bottom:20px;"><h4 style="margin-bottom:8px;">👥 Profils enregistrés :</h4><div style="display:flex; flex-direction:column; gap:8px;">`;
                    listeProfils.forEach(p => {
                        profilsExistantsHtml += `<button class="btn-action" style="background:var(--card-bg); border:1px solid var(--accent); color:var(--text-main); text-align:left; padding:12px;" onclick="selectionnerProfilExistant('${p.id}')">👤 <strong>${p.nom}</strong> <small style="float:right; color:var(--accent);">[${p.metierUnique}]</small></button>`;
                    });
                    profilsExistantsHtml += `</div></div>`;
                }

                content.innerHTML = `
                    <div class="card" style="border-color:var(--accent); max-width:500px; margin: 10px auto; text-align:center;">
                        <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo" style="width:72px; height:72px; margin-bottom:10px; border-radius:16px; border:2px solid var(--accent);">
                        <h2 style="color:var(--accent); margin-top:0;">✨ E.V.A.T. & ELAWS</h2>
                        <p class="text" style="text-align:center;">Écosystème Souverain Immersif (v22.5 Stable)</p>
                        
                        ${profilsExistantsHtml}

                        <div style="text-align:left;">
                            <h4 style="margin-bottom:10px; border-top:1px solid var(--border-color); padding-top:15px;">📝 Créer mon Profil :</h4>
                            <input type="text" id="regNom" class="input" placeholder="Votre Nom ou Prénom *" style="margin-bottom:8px;">
                            <input type="text" id="regMetierCustom" class="input" value="Pasteur / Guide" placeholder="Rôle ou Métier *" style="margin-bottom:12px;">
                            <button class="btn-action" onclick="creerNouveauProfil()">🚀 Démarrer avec ELAWS (v22.5)</button>
                        </div>
                    </div>
                `;
                return;
            }

            document.getElementById('appHeader').style.display = 'block';
            document.getElementById('bottomBar').style.display = 'flex';
            document.getElementById('badgeDomaineActif').innerHTML = `💼 ${utilisateurActif.nom} (${utilisateurActif.metierUnique})`;

            document.querySelectorAll('.bar-item').forEach(el => el.classList.remove('active'));
            if(activeTab === 'accueil') document.getElementById('barAccueil')?.classList.add('active');
            if(activeTab === 'elaws_compagnon') document.getElementById('barElaws')?.classList.add('active');
            if(activeTab === 'dashboard') document.getElementById('barDash')?.classList.add('active');
            if(activeTab === 'agenda') document.getElementById('barAgenda')?.classList.add('active');
            if(activeTab === 'economie') document.getElementById('barEco')?.classList.add('active');

            if (activeTab === 'accueil') {
                content.innerHTML = `
                    <div class="card" style="border-color: var(--accent);">
                        <div class="badge-gamified">🌟 Version v22.5 Stable Active</div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <div>
                                <span style="font-size:11px; color:var(--accent); font-weight:700;">👤 PROFIL ACTIF</span>
                                <div style="font-size:17px; font-weight:800;">${utilisateurActif.nom}</div>
                            </div>
                            <button class="btn-top" onclick="changerProfilSession()">🔄 Changer</button>
                        </div>
                        <p class="text">Rôle : <strong style="color:var(--accent);">${utilisateurActif.metierUnique}</strong>. L'assistant ELAWS est connecté et prêt à discuter naturellement avec toi.</p>
                    </div>
                `;
            } else if (activeTab === 'elaws_compagnon') {
                let chatHtml = '';
                if (utilisateurActif.discussionsElaws) {
                    utilisateurActif.discussionsElaws.forEach(msg => {
                        const isAi = msg.role === 'ai';
                        chatHtml += `
                            <div style="background:${isAi ? 'rgba(5,150,105,0.15)' : 'var(--bg-color)'}; border-left:4px solid ${isAi ? 'var(--accent)' : 'var(--border-color)'}; padding:14px; border-radius:10px; margin-bottom:12px; position:relative;">
                                <strong style="font-size:12px; color:${isAi ? 'var(--accent)' : 'var(--text-secondary)'};">${isAi ? '🤖 ELAWS (Sincère & Complice)' : utilisateurActif.nom}</strong>
                                <p style="margin:8px 0 0 0; font-size:14px; white-space: pre-line;">${msg.texte}</p>
                                ${isAi ? `<button onclick="window.speechSynthesis.speak(new SpeechSynthesisUtterance('${msg.texte.replace(/'/g, "'").replace(/\n/g, " ")}'))" style="position:absolute; top:10px; right:10px; background:var(--accent); color:#000; border:none; padding:4px 8px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer;">🔊 Écouter</button>` : ''}
                            </div>
                        `;
                    });
                }
                content.innerHTML = `
                    <div class="card" style="border-color:var(--accent);">
                        <h3 class="card-title" style="color:var(--accent);">🤖 ELAWS — Ton Compagnon de Route</h3>
                        <p class="text">Discute librement avec ELAWS, exactement comme dans une conversation naturelle :</p>
                        
                        <div style="background:var(--bg-color); padding:15px; border-radius:12px; max-height:350px; overflow-y:auto; margin-bottom:15px; border:1px solid var(--border-color);" id="boiteDiscussionElaws">
                            ${chatHtml}
                        </div>
                        <div style="display:flex; gap:8px;">
                            <input type="text" id="inputElawsChat" class="input" placeholder="Écris ton message à ELAWS..." style="margin-bottom:0;" onkeypress="if(event.key === 'Enter') envoyerMessageElawsAI()">
                            <button class="btn-action" style="width:auto; padding:0 22px;" onclick="envoyerMessageElawsAI()">Envoyer 🚀</button>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'dashboard') {
                content.innerHTML = `
                    <div class="card" style="border-color:#3b82f6;">
                        <h3 class="card-title" style="color:#3b82f6;">📊 Tableau de Bord</h3>
                        <div class="stat-grid">
                            <div class="stat-box">
                                <div style="font-size:12px; color:var(--text-secondary);">Trésorerie Caisse</div>
                                <div class="stat-num" style="color:var(--accent);">${utilisateurActif.solde.toLocaleString()} FCFA</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'agenda') {
                content.innerHTML = `
                    <div class="card" style="border-color:#f59e0b;">
                        <h3 class="card-title" style="color:#f59e0b;">📅 Agenda & Rendez-vous</h3>
                        <p class="text">Gère tes plannings et cultes en toute simplicité.</p>
                    </div>
                `;
            } else if (activeTab === 'economie') {
                content.innerHTML = `
                    <div class="card" style="border-color:var(--accent);">
                        <h3 class="card-title">🪙 Journal de Caisse</h3>
                        <div style="font-size:24px; font-weight:800; color:var(--accent); text-align:center; padding:10px; background:var(--bg-color); border-radius:10px; margin-bottom:15px;">${utilisateurActif.solde.toLocaleString()} FCFA</div>
                    </div>
                `;
            }
        }

        function switchTab(t) { activeTab = t; document.getElementById('sideMenu').classList.remove('open'); render(); window.scrollTo(0, 0); }
        render();
    </script>
</body>
</html>
