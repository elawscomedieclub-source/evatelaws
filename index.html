<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.V.A.T. & ELAWS - Écosystème Universel (v24)</title>
    
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#059669">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #34d399;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --accent: #059669;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        [data-theme="eco"] {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #22c55e;
            --text-secondary: #15803d;
            --accent: #22c55e;
            --accent-gradient: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            --border-color: #14532d;
            --shadow: 0 0 15px rgba(34, 197, 94, 0.15);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 90px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-logo { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 2px solid var(--accent); }
        .menu-toggle { background: var(--accent-gradient); color: white; border: none; padding: 10px 14px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; transition: transform 0.2s; }
        .menu-toggle:active { transform: scale(0.95); }
        .title { font-size: 1.05rem; font-weight: 800; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .btn-top { background-color: var(--border-color); padding: 8px 12px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; color: var(--text-main); cursor: pointer; }
        .badge-info { font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .offline-status { background: rgba(16, 185, 129, 0.2); color: var(--accent); padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 800; }
        
        .bottom-action-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border-color);
            padding: 10px 15px; display: flex; justify-content: space-around; align-items: center; z-index: 999; box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }
        .bar-item { background: none; border: none; color: var(--text-secondary); font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; transition: color 0.2s; }
        .bar-item span.icon { font-size: 16px; }
        .bar-item.active, .bar-item:hover { color: var(--accent); }

        #toastNotification {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--card-bg); color: var(--text-main); border: 1px solid var(--accent); padding: 12px 20px;
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); font-size: 13px; font-weight: 700; z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease; opacity: 0; display: flex; align-items: center; gap: 8px; text-align: center;
        }
        #toastNotification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .sidebar { display: none; background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: var(--shadow); max-height: 75vh; overflow-y: auto; animation: fadeIn 0.3s ease; }
        .sidebar.open { display: block; }
        .sidebar h3 { font-size: 0.95rem; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        .menu-item { background: rgba(16, 185, 129, 0.08); color: var(--text-main); padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; border: none; width: 100%; text-align: left; font-size: 0.85rem; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .menu-item:hover { background: rgba(16, 185, 129, 0.18); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .module-container { flex: 1; max-width: 750px; width: 100%; margin: 0 auto; animation: fadeIn 0.3s ease; }
        .card { background-color: var(--card-bg); padding: 22px; border-radius: 14px; margin-bottom: 15px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-top: 0; margin-bottom: 10px; }
        .text { font-size: 14px; color: var(--text-secondary); margin-bottom: 15px; line-height: 1.6; }
        .input { width: 100%; border: 1px solid var(--border-color); border-radius: 8px; padding: 11px; background: var(--card-bg); color: var(--text-main); font-size: 14px; outline: none; margin-bottom: 10px; transition: border-color 0.2s; }
        .input:focus { border-color: var(--accent); }
        select.input { width: 100%; }
        .btn-action { background: var(--accent-gradient); color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14px; box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25); transition: transform 0.1s, opacity 0.2s; }
        .btn-action:active { transform: scale(0.98); opacity: 0.9; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background: var(--bg-color); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; text-align: center; }
        .stat-num { font-size: 18px; font-weight: 800; color: var(--accent); margin-top: 4px; }
        
        .badge-gamified { display: inline-flex; align-items: center; gap: 5px; background: rgba(5, 150, 105, 0.15); border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; margin-bottom: 12px; }

        .faq-item { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 15px; margin-bottom: 10px; cursor: pointer; }
        .faq-question { font-weight: 700; font-size: 13.5px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .faq-answer { font-size: 13px; color: var(--text-secondary); margin-top: 8px; display: none; line-height: 1.5; border-top: 1px dashed var(--border-color); padding-top: 8px; }
        .faq-item.active .faq-answer { display: block; }
    </style>
</head>
<body data-theme="dark">

    <div id="toastNotification">✨ <span id="toastText">Action</span></div>

    <div id="appHeader" style="display:none;">
        <header>
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
                <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo ELAWS" class="app-logo">
                <div class="title">E.V.A.T. & ELAWS</div>
            </div>
            <div class="header-right">
                <button class="btn-top" onclick="changerTheme()">🎨 Thème</button>

        </header>
        <div class="badge-info">
            <span id="badgeDomaineActif">🌍 Écosystème Universel & Sincère (v24)</span>
            <span class="offline-status" id="reseauStatusIndicator">⚡ Vérification...</span>
        </div>
    </div>

    <!-- BOUTON D'INSTALLATION DIRECTE AUTOMATIQUE -->
    <div id="installCardContainer" class="card" style="border-color:var(--accent); background:rgba(5,150,105,0.15); display:none; text-align:center;">
        <h3 class="card-title" style="color:var(--accent);">📲 Mode Testeurs & Installation Prête</h3>
        <p class="text">Installez E.V.A.T. sur votre mobile pour tester l'application en conditions réelles !</p>
        <button class="btn-action" id="btnInstallApp" style="font-size:16px; padding:16px;">🚀 Installer l'Application sur l'Écran d'Accueil</button>
    </div>

    <div id="sideMenu" class="sidebar">
        <h3>📂 Navigation & Modules (v24)</h3>
        <button class="menu-item" onclick="switchTab('accueil')">🏠 Accueil & Profil Actif</button>
        <button class="menu-item" onclick="switchTab('elaws_compagnon')" style="background:rgba(5,150,105,0.2); border:1px solid var(--accent);">🤖 <strong>Assistant ELAWS (Sincère & Fluide)</strong></button>
        <button class="menu-item" onclick="switchTab('ecole_tuteur')" style="background:rgba(245,158,11,0.2); border:1px solid #f59e0b; color:#f59e0b;">🎓 <strong>ELAWS École & Tuteur</strong></button>
        <button class="menu-item" onclick="switchTab('quiz_annales')" style="background:rgba(139,92,246,0.2); border:1px solid #8b5cf6; color:#8b5cf6;">📝 <strong>Quiz & Annales d'Examens</strong></button>
        <button class="menu-item" onclick="switchTab('contacts_urgences')" style="background:rgba(239,68,68,0.2); border:1px solid #ef4444; color:#ef4444;">📇 <strong>Contacts & Urgences / Pastorale</strong></button>
        <button class="menu-item" onclick="switchTab('gestion_stocks')" style="background:rgba(16,185,129,0.2); border:1px solid #10b981; color:#10b981;">📦 <strong>Gestion de Stocks & Matériel</strong></button>
        <button class="menu-item" onclick="switchTab('convertisseur_devise')" style="background:rgba(59,130,246,0.2); border:1px solid #3b82f6; color:#3b82f6;">💱 <strong>Convertisseur & Unités</strong></button>
        <button class="menu-item" onclick="switchTab('dashboard')" style="background:rgba(59,130,246,0.15); border:1px solid #3b82f6; color:#3b82f6;">📊 <strong>Tableau de Bord & Score</strong></button>
        <button class="menu-item" onclick="switchTab('agenda')" style="background:rgba(245,158,11,0.15); border:1px solid #f59e0b; color:#f59e0b;">📅 <strong>Agenda & Rendez-vous / Cultes</strong></button>
        <button class="menu-item" onclick="switchTab('calculatrice_marge')" style="background:rgba(16,185,129,0.15); border:1px solid #10b981; color:#10b981;">🧮 <strong>Calculatrice & Tarifs</strong></button>
        <button class="menu-item" onclick="switchTab('recherche')">🔍 Recherche Globale Rapide</button>
        <button class="menu-item" onclick="switchTab('traduction_croisee')">🌐 Traduction & Dialectes Locaux</button>
        <button class="menu-item" onclick="switchTab('facturation')">📄 Facturation & Reçus PDF</button>
        <button class="menu-item" onclick="switchTab('notes_vocales')">🎙️ Dictaphone & Notes</button>
        <button class="menu-item" onclick="switchTab('economie')">🪙 Journal de Caisse & Trésorerie</button>
        <button class="menu-item" onclick="switchTab('sauvegarde')">💾 Sauvegarde & Sécurité Données</button>
        <button class="menu-item" onclick="switchTab('faq')" style="color:#f59e0b;">❓ Guide & FAQ Testeurs</button>
    </div>

    <div class="module-container" id="mainContent"></div>

    <div id="bottomBar" class="bottom-action-bar" style="display:none;">
        <button class="bar-item active" onclick="switchTab('accueil')" id="barAccueil"><span class="icon">💼</span><span>Profil</span></button>
        <button class="bar-item" onclick="switchTab('elaws_compagnon')" id="barElaws" style="color:var(--accent);"><span class="icon">🤖</span><span>ELAWS</span></button>
        <button class="bar-item" onclick="switchTab('ecole_tuteur')" id="barEcole" style="color:#f59e0b;"><span class="icon">🎓</span><span>École</span></button>
        <button class="bar-item" onclick="switchTab('contacts_urgences')" id="barContacts" style="color:#ef4444;"><span class="icon">📇</span><span>Contacts</span></button>
        <button class="bar-item" onclick="switchTab('gestion_stocks')" id="barStocks" style="color:#10b981;"><span class="icon">📦</span><span>Stocks</span></button>
        <button class="bar-item" onclick="switchTab('convertisseur_devise')" id="barConv" style="color:#3b82f6;"><span class="icon">💱</span><span>Devises</span></button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        let activeTab = 'accueil';
        let currentThemeIndex = 0;
        const themes = ['dark', 'light', 'eco'];

        function jouerSonSucces() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function changerTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            document.body.setAttribute('data-theme', themes[currentThemeIndex]);
            showToast(`Thème : ${themes[currentThemeIndex].toUpperCase()}`);
        }

        let listeProfils = JSON.parse(localStorage.getItem('evat_tous_profils')) || [];
        let idProfilActif = localStorage.getItem('evat_profil_actif_id') || null;
        let utilisateurActif = null;
        let voixActiveIndex = localStorage.getItem('evat_voix_index') || 0;

        function verifierEspaceStockage() {
            try {
                let totalUtilise = 0;
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        totalUtilise += ((localStorage[key].length * 2) / 1024 / 1024);
                    }
                }
                if (totalUtilise > 4.5) {
                    showToast("⚠️ Attention : Stockage presque saturé. Pensez à exporter vos données en JSON !");
                }
            } catch(e) {}
        }

        function chargerDonneesProfil() {
            if (idProfilActif) {
                utilisateurActif = listeProfils.find(p => p.id == idProfilActif) || null;
            }
            if (!utilisateurActif && listeProfils.length > 0) {
                utilisateurActif = listeProfils[0];
                idProfilActif = utilisateurActif.id;
                localStorage.setItem('evat_profil_actif_id', idProfilActif);
            }
            verifierEspaceStockage();
        }
        chargerDonneesProfil();

        function showToast(m) {
            const t = document.getElementById('toastNotification');
            document.getElementById('toastText').innerHTML = m;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function mettreAJourEtatReseau() {
            const ind = document.getElementById('reseauStatusIndicator');
            if(!ind) return;
            ind.innerText = navigator.onLine ? "🌐 En Ligne" : "⚡ Hors-Ligne";
        }
        window.addEventListener('online', mettreAJourEtatReseau);
        window.addEventListener('offline', mettreAJourEtatReseau);

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const container = document.getElementById('installCardContainer');
            if(container) container.style.display = 'block';
        });

        document.addEventListener('DOMContentLoaded', () => {
            const btnInstall = document.getElementById('btnInstallApp');
            if(btnInstall) {
                btnInstall.addEventListener('click', async () => {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        const { outcome } = await deferredPrompt.userChoice;
                        if (outcome === 'accepted') { showToast("Application installée avec succès !"); }
                        deferredPrompt = null;
                        document.getElementById('installCardContainer').style.display = 'none';
                    } else { showToast("Installation déjà active ou non requise."); }
                });
            }
        });

        function initialiserAudioVocale() {
            if ('speechSynthesis' in window) {
                const silentUtterance = new SpeechSynthesisUtterance("");
                silentUtterance.volume = 0;
                window.speechSynthesis.speak(silentUtterance);
            }
        }
        window.addEventListener('click', initialiserAudioVocale, { once: true });

        function getAvailableVoices() {
            if (!('speechSynthesis' in window)) return [];
            return window.speechSynthesis.getVoices();
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                if (activeTab === 'accueil') render();
            };
        }

        function lireTexteAAvoix(texte, langOverride) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texte);
                utterance.lang = langOverride || 'fr-FR';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                const voixList = getAvailableVoices();
                if (voixList.length > 0 && voixList[voixActiveIndex] && !langOverride) {
                    utterance.voice = voixList[voixActiveIndex];
                } else {
                    const voixLang = voixList.find(v => v.lang.startsWith(utterance.lang.substring(0,2)));
                    if (voixLang) utterance.voice = voixLang;
                }

                window.speechSynthesis.speak(utterance);
                showToast("🔊 ELAWS / Lecture vocale...");
            }
        }

        function changerVoixElaws(selectElement) {
            voixActiveIndex = selectElement.value;
            localStorage.setItem('evat_voix_index', voixActiveIndex);
            showToast("Voix d'ELAWS mise à jour !");
            lireTexteAAvoix("Bonjour ! Je suis ELAWS, ton assistant personnel.");
        }

        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('open'); }

        function creerNouveauProfil() {
            const nom = document.getElementById('regNom').value.trim();
            const metierUnique = document.getElementById('regMetierCustom').value.trim() || 'Pasteur / Guide';
            const tel = document.getElementById('regTel').value.trim();
            const pays = document.getElementById('regPays').value || 'Togo';
            const classe = document.getElementById('regClasse').value || 'Professionnel';

            if (!nom) { showToast("Veuillez renseigner votre nom."); return; }

            const nouveauId = 'prof_' + Date.now();
            const nouveauProfil = {
                id: nouveauId,
                nom: nom,
                telephone: tel || '+228 98231402',
                metierUnique: metierUnique,
                pays: pays,
                classe: classe,
                solde: 50000,
                journalCaisse: [
                    { id: 1, type: 'entree', libelle: 'Capital / Offrande initiale', montant: 50000, date: new Date().toLocaleDateString() }
                ],
                notesVocales: [],
                factures: [],
                agendaRdv: [
                    { id: 1, titre: "Culte / Réunion de prière", date: new Date().toLocaleDateString(), heure: "09:00" }
                ],
                contactsUrgences: [
                    { id: 1, nom: "Urgences / Secours", tel: "118 / +228 98231402", type: "Secours" },
                    { id: 2, nom: "Diaconat / Église", tel: "+228 90000000", type: "Pro" }
                ],
                stocksMatériel: [
                    { id: 1, nom: "Matériel de sonorisation / Micros", qte: 5, alerte: 2 }
                ],
                quizScores: [],
                discussionsElaws: [
                    { role: 'ai', texte: `Bonjour ${nom} ! C'est un plaisir de t'accompagner. En tant que ${metierUnique} ici au ${pays}, je suis là pour t'épauler au quotidien avec fluidité, simplicité et sincérité. Qu'est-ce qu'on fait ensemble aujourd'hui ?` }
                ],
                discussionsEcole: [
                    { role: 'ai', texte: `Bonjour ${nom} ! Bienvenue sur ELAWS École, prêt pour t'accompagner dans tes études ou tes enseignements avec des explications claires et directes.` }
                ]
            };

            listeProfils.push(nouveauProfil);
            localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils));
            localStorage.setItem('evat_profil_actif_id', nouveauId);
            
            idProfilActif = nouveauId;
            utilisateurActif = nouveauProfil;

            jouerSonSucces();
            lireTexteAAvoix(`Bonjour ${nom}. Ton profil ${metierUnique} est parfaitement configuré.`);
            showToast(`Bienvenue, ${nom} !`);
            render();
        }

        function changerProfilSession() {
            idProfilActif = null; utilisateurActif = null;
            localStorage.removeItem('evat_profil_actif_id');
            render();
        }

        function selectionnerProfilExistant(id) {
            idProfilActif = id;
            localStorage.setItem('evat_profil_actif_id', id);
            chargerDonneesProfil();
            showToast(`Profil chargé : ${utilisateurActif.nom}`);
            render();
        }

        function sauvegarderProfilActif() {
            const index = listeProfils.findIndex(p => p.id == utilisateurActif.id);
            if (index !== -1) { listeProfils[index] = utilisateurActif; localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils)); }
            verifierEspaceStockage();
        }

        function toggleFaqItem(element) {
            element.classList.toggle('active');
        }

        // --- ASSISTANT ELAWS SINCÈRE ET FLUIDE ---
        function envoyerMessageElawsAI(texteForce) {
            const input = document.getElementById('inputElawsChat');
            const q = texteForce || (input ? input.value.trim() : '');
            if (!q) return;

            if (!utilisateurActif.discussionsElaws) utilisateurActif.discussionsElaws = [];
            utilisateurActif.discussionsElaws.push({ role: 'user', texte: q });

            const qLower = q.toLowerCase();
            let reponse = "";

            // Réponses chaleureuses, sincères et directes adaptées aux métiers (y compris Pasteur)
            if (qLower.includes('culte') || qLower.includes('predication') || qLower.includes('verset') || qLower.includes('foi') || qLower.includes('prier')) {
                reponse = `[Accompagnement Pastoral — ELAWS]
Frère ${utilisateurActif.nom}, voici une inspiration directe pour ton ministère :
1. Piste de méditation : Appuie-toi sur la grâce et la simplicité dans le message.
2. Structure suggérée : Accueil chaleureux, partage de la Parole avec des exemples de la vie quotidienne, puis un moment de prière fraternelle.

        function importerDonneesJSON(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if(Array.isArray(parsed)) {
                        listeProfils = parsed;
                        localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils));
                        jouerSonSucces();
                        showToast("Données restaurées !");
                        render();
                    } else { showToast("Format invalide."); }
                } catch(err) { showToast("Erreur de lecture."); }
            };
            reader.readAsText(file);
        }

                    <div class="card" style="border-color:var(--accent);">

                        <div style="display:flex; gap:8px;">
                            <input type="text" id="inputElawsChat" class="input" placeholder="Ex: Aide-moi pour la prédication de dimanche..." style="margin-bottom:0;" onkeypress="if(event.key === 'Enter') envoyerMessageElawsAI()">

                    <div class="card" style="border-color:#f59e0b;">

                            <button class="btn-action" style="width:auto; padding:0 20px; background:#f59e0b;" onclick="envoyerMessageEcoleAI()">Envoyer</button>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'quiz_annales') {

                        <div style="background:var(--bg-color); padding:16px; border-radius:10px; border:1px solid #8b5cf6; margin-bottom:15px;">
                            <strong>Question ${quizActuelIndex + 1} / ${questionsQuizExemple.length} :</strong>
                            <p style="font-size:15px; font-weight:700; color:#8b5cf6; margin:8px 0 14px 0;">${q.question}</p>
                            ${optionsHtml}
                        </div>
                        <div id="resultatQuizDiv"></div>
                    </div>
                `;
            } else if (activeTab === 'contacts_urgences') {
                let contactsHtml = '';
                if(utilisateurActif.contactsUrgences) {
                    utilisateurActif.contactsUrgences.forEach(c => {

                            <input type="text" id="contactTel" class="input" placeholder="Téléphone *" style="margin-bottom:8px;">

                `;

                        <div id="apercuFactureContainer"></div>
                    </div>
                `;

                let notesHtml = '';

                            <input type="number" id="caisseMontant" class="input" placeholder="Montant *" style="margin-bottom:10px;">
                            <div style="display:flex; gap:8px;">
                                <button class="btn-action" style="background:#10b981;" onclick="ajouterMouvementCaisse('entree')">➕ Entrée</button>

                        </div>

                    </div>
                `;
            } else if (activeTab === 'sauvegarde') {
                content.innerHTML = `
                    <div class="card" style="border-color:#3b82f6;">
                        <h3 class="card-title" style="color:#3b82f6;">💾 Sauvegarde & Sécurité</h3>
                        <div style="display:flex; flex-direction:column; gap:12px; margin-top:15px;">

                            </div>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'faq') {
                content.innerHTML = `
                    <div class="card" style="border-color:#f59e0b;">
                        <h3 class="card-title" style="color:#f59e0b;">❓ Guide pour les Testeurs (v24)</h3>
                        <p class="text">Bienvenue ! Cette application fonctionne 100% hors-ligne. Vous pouvez créer votre profil (Pasteur, Élève, Professionnel), tester l'assistant ELAWS qui répond de manière fluide et sincère, gérer vos contacts, vos stocks, votre agenda et vos notes vocales.</p>
                    </div>

        function switchTab(t) { activeTab = t; document.getElementById('sideMenu').classList.remove('open'); render(); window.scrollTo(0, 0); }
        render();
    </script>
