<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.V.A.T. & ELAWS - FAQ & Guide Interactif</title>
    
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#059669">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #34d399;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --accent: #059669;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        [data-theme="eco"] {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #22c55e;
            --text-secondary: #15803d;
            --accent: #22c55e;
            --accent-gradient: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            --border-color: #14532d;
            --shadow: 0 0 15px rgba(34, 197, 94, 0.15);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 90px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-logo { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 2px solid var(--accent); }
        .menu-toggle { background: var(--accent-gradient); color: white; border: none; padding: 10px 14px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; }
        .title { font-size: 1.05rem; font-weight: 800; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .btn-top { background-color: var(--border-color); padding: 8px 12px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; color: var(--text-main); cursor: pointer; }
        .badge-info { font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .offline-status { background: rgba(16, 185, 129, 0.2); color: var(--accent); padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: 800; }
        
        .bottom-action-bar {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border-color);
            padding: 10px 15px; display: flex; justify-content: space-around; align-items: center; z-index: 999; box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }
        .bar-item { background: none; border: none; color: var(--text-secondary); font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .bar-item span.icon { font-size: 18px; }
        .bar-item.active, .bar-item:hover { color: var(--accent); }

        #toastNotification {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--card-bg); color: var(--text-main); border: 1px solid var(--accent); padding: 12px 20px;
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); font-size: 13px; font-weight: 700; z-index: 1000;
            transition: transform 0.3s ease, opacity 0.3s ease; opacity: 0; display: flex; align-items: center; gap: 8px; text-align: center;
        }
        #toastNotification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .sidebar { display: none; background-color: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: var(--shadow); max-height: 70vh; overflow-y: auto; }
        .sidebar.open { display: block; }
        .sidebar h3 { font-size: 0.95rem; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        .menu-item { background: rgba(16, 185, 129, 0.08); color: var(--text-main); padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; border: none; width: 100%; text-align: left; font-size: 0.85rem; cursor: pointer; font-weight: 600; }
        .menu-item:hover { background: rgba(16, 185, 129, 0.18); }
        
        .module-container { flex: 1; max-width: 750px; width: 100%; margin: 0 auto; }
        .card { background-color: var(--card-bg); padding: 22px; border-radius: 14px; margin-bottom: 15px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-top: 0; margin-bottom: 10px; }
        .text { font-size: 14px; color: var(--text-secondary); margin-bottom: 15px; line-height: 1.6; }
        .input { width: 100%; border: 1px solid var(--border-color); border-radius: 8px; padding: 11px; background: var(--card-bg); color: var(--text-main); font-size: 14px; outline: none; margin-bottom: 10px; }
        select.input { width: 100%; }
        .btn-action { background: var(--accent-gradient); color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 14px; box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25); }
        
        .faq-item { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 15px; margin-bottom: 10px; cursor: pointer; }
        .faq-question { font-weight: 700; font-size: 13.5px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .faq-answer { font-size: 13px; color: var(--text-secondary); margin-top: 8px; display: none; line-height: 1.5; border-top: 1px dashed var(--border-color); padding-top: 8px; }
        .faq-item.active .faq-answer { display: block; }
    </style>
</head>
<body data-theme="dark">

    <div id="toastNotification">✨ <span id="toastText">Action</span></div>

    <div id="appHeader" style="display:none;">
        <header>
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
                <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo ELAWS" class="app-logo">
                <div class="title">E.V.A.T. & ELAWS</div>
            </div>
            <div class="header-right">
                <button class="btn-top" onclick="changerTheme()">🎨 Thème</button>
                <button class="btn-top" onclick="changerProfilSession()">👤 Profils</button>
            </div>
        </header>
        <div class="badge-info">
            <span id="badgeDomaineActif">🌍 Écosystème Souverain & FAQ Intégrée</span>
            <span class="offline-status" id="reseauStatusIndicator">⚡ Vérification...</span>
        </div>
    </div>

    <!-- BOUTON D'INSTALLATION DIRECTE AUTOMATIQUE -->
    <div id="installCardContainer" class="card" style="border-color:var(--accent); background:rgba(5,150,105,0.15); display:none; text-align:center;">
        <h3 class="card-title" style="color:var(--accent);">📲 Installation Automatique Prête</h3>
        <p class="text">Installez E.V.A.T. directement sur votre téléphone en un seul clic !</p>
        <button class="btn-action" id="btnInstallApp" style="font-size:16px; padding:16px;">🚀 Installer l'Application sur l'Écran d'Accueil</button>
    </div>

    <div id="sideMenu" class="sidebar">
        <h3>📂 Navigation & Aide</h3>
        <button class="menu-item" onclick="switchTab('accueil')">🏠 Accueil & Paramètres Vocaux</button>
        <button class="menu-item" onclick="switchTab('elaws_compagnon')" style="background:rgba(5,150,105,0.2); border:1px solid var(--accent);">🤖 <strong>Parler à ELAWS (Expert Métier 🎤)</strong></button>
        <button class="menu-item" onclick="switchTab('traduction_croisee')" style="background:rgba(59,130,246,0.15); border:1px solid #3b82f6;">🌐 <strong>Traduction Croisée & Dialectes</strong></button>
        <button class="menu-item" onclick="switchTab('faq')" style="background:rgba(245,158,11,0.15); border:1px solid #f59e0b; color:#f59e0b;">❓ <strong>Guide & FAQ (Aide Utilisateur)</strong></button>
        <button class="menu-item" onclick="switchTab('appels')">📞 Appels & Contacts (GSM / Data)</button>
        <button class="menu-item" onclick="switchTab('atelier_specifique')" id="menuItemAtelier">⚡ Outils & Logiciels Métier</button>
        <button class="menu-item" onclick="switchTab('economie')">🪙 Caisse & Trésorerie</button>
    </div>

    <div class="module-container" id="mainContent"></div>

    <div id="bottomBar" class="bottom-action-bar" style="display:none;">
        <button class="bar-item active" onclick="switchTab('accueil')" id="barAccueil"><span class="icon">💼</span><span>Profil</span></button>
        <button class="bar-item" onclick="switchTab('elaws_compagnon')" id="barElaws" style="color:var(--accent);"><span class="icon">🤖</span><span>ELAWS</span></button>
        <button class="bar-item" onclick="switchTab('traduction_croisee')" id="barTrad" style="color:#3b82f6;"><span class="icon">🌐</span><span>Traduo</span></button>
        <button class="bar-item" onclick="switchTab('faq')" id="barFaq" style="color:#f59e0b;"><span class="icon">❓</span><span>FAQ</span></button>
        <button class="bar-item" onclick="switchTab('economie')" id="barEco"><span class="icon">🪙</span><span>Caisse</span></button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        let activeTab = 'accueil';
        let currentThemeIndex = 0;
        const themes = ['dark', 'light', 'eco'];

        function changerTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            document.body.setAttribute('data-theme', themes[currentThemeIndex]);
            showToast(`Thème : ${themes[currentThemeIndex].toUpperCase()}`);
        }

        let listeProfils = JSON.parse(localStorage.getItem('evat_tous_profils')) || [];
        let idProfilActif = localStorage.getItem('evat_profil_actif_id') || null;
        let utilisateurActif = null;
        let voixActiveIndex = localStorage.getItem('evat_voix_index') || 0;

        function chargerDonneesProfil() {
            if (idProfilActif) {
                utilisateurActif = listeProfils.find(p => p.id == idProfilActif) || null;
            }
            if (!utilisateurActif && listeProfils.length > 0) {
                utilisateurActif = listeProfils[0];
                idProfilActif = utilisateurActif.id;
            }
        }
        chargerDonneesProfil();

        function showToast(m) {
            const t = document.getElementById('toastNotification');
            document.getElementById('toastText').innerHTML = m;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function mettreAJourEtatReseau() {
            const ind = document.getElementById('reseauStatusIndicator');
            if(!ind) return;
            ind.innerText = navigator.onLine ? "🌐 En Ligne" : "⚡ Hors-Ligne";
        }
        window.addEventListener('online', mettreAJourEtatReseau);
        window.addEventListener('offline', mettreAJourEtatReseau);

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const container = document.getElementById('installCardContainer');
            if(container) container.style.display = 'block';
        });

        document.addEventListener('DOMContentLoaded', () => {
            const btnInstall = document.getElementById('btnInstallApp');
            if(btnInstall) {
                btnInstall.addEventListener('click', async () => {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        const { outcome } = await deferredPrompt.userChoice;
                        if (outcome === 'accepted') { showToast("Application installée avec succès !"); }
                        deferredPrompt = null;
                        document.getElementById('installCardContainer').style.display = 'none';
                    } else { showToast("Installation déjà active ou non requise."); }
                });
            }
        });

        function initialiserAudioVocale() {
            if ('speechSynthesis' in window) {
                const silentUtterance = new SpeechSynthesisUtterance("");
                silentUtterance.volume = 0;
                window.speechSynthesis.speak(silentUtterance);
            }
        }
        window.addEventListener('click', initialiserAudioVocale, { once: true });

        function getAvailableVoices() {
            if (!('speechSynthesis' in window)) return [];
            return window.speechSynthesis.getVoices();
        }

        function lireTexteAAvoix(texte, langOverride) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texte);
                utterance.lang = langOverride || 'fr-FR';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                const voixList = getAvailableVoices();
                if (voixList.length > 0 && voixList[voixActiveIndex] && !langOverride) {
                    utterance.voice = voixList[voixActiveIndex];
                } else {
                    const voixLang = voixList.find(v => v.lang.startsWith(utterance.lang.substring(0,2)));
                    if (voixLang) utterance.voice = voixLang;
                }

                window.speechSynthesis.speak(utterance);
                showToast("🔊 ELAWS / Assistant vocal actif...");
            }
        }

        function changerVoixElaws(selectElement) {
            voixActiveIndex = selectElement.value;
            localStorage.setItem('evat_voix_index', voixActiveIndex);
            showToast("Voix d'ELAWS mise à jour !");
            lireTexteAAvoix("Bonjour, je suis ELAWS avec ma nouvelle voix.");
        }

        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('open'); }

        function creerNouveauProfil() {
            const nom = document.getElementById('regNom').value.trim();
            const metierUnique = document.getElementById('regMetierCustom').value.trim() || 'Artisan';
            const tel = document.getElementById('regTel').value.trim();

            if (!nom) { showToast("Veuillez renseigner votre nom."); return; }

            const nouveauId = 'prof_' + Date.now();
            const nouveauProfil = {
                id: nouveauId,
                nom: nom,
                telephone: tel || '+228 98231402',
                metierUnique: metierUnique,
                solde: 50000,
                contactsAppels: [{ id: 1, nom: "Contact Test", tel: "+228 98231402", type: "Client / Patient" }],
                donneesMetierSpecifique: { registreUniversel: [] },
                discussionsElaws: [
                    { role: 'ai', texte: `Bonjour ${nom} ! Je suis **ELAWS**, votre assistant expert en **${metierUnique}**. Consultez le module FAQ si vous avez besoin d'aide sur l'utilisation de l'application.` }
                ]
            };

            listeProfils.push(nouveauProfil);
            localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils));
            localStorage.setItem('evat_profil_actif_id', nouveauId);
            
            idProfilActif = nouveauId;
            utilisateurActif = nouveauProfil;

            lireTexteAAvoix(`Bonjour ${nom}. Votre environnement ELAWS pour ${metierUnique} est prêt.`);
            showToast(`Bienvenue, ${nom} !`);
            render();
        }

        function changerProfilSession() {
            idProfilActif = null; utilisateurActif = null;
            localStorage.removeItem('evat_profil_actif_id');
            render();
        }

        function selectionnerProfilExistant(id) {
            idProfilActif = id;
            localStorage.setItem('evat_profil_actif_id', id);
            chargerDonneesProfil();
            showToast(`Profil chargé : ${utilisateurActif.nom}`);
            render();
        }

        function sauvegarderProfilActif() {
            const index = listeProfils.findIndex(p => p.id == utilisateurActif.id);
            if (index !== -1) { listeProfils[index] = utilisateurActif; localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils)); }
        }

        function toggleFaqItem(element) {
            element.classList.toggle('active');
        }

        // EXPERT MÉTIER & PRESCRIPTION INTELLIGENTE
        function envoyerMessageElawsAI(texteForce) {
            const input = document.getElementById('inputElawsChat');
            const q = texteForce || (input ? input.value.trim() : '');
            if (!q) return;

            if (!utilisateurActif.discussionsElaws) utilisateurActif.discussionsElaws = [];
            utilisateurActif.discussionsElaws.push({ role: 'user', texte: q });

            const metier = utilisateurActif.metierUnique.toLowerCase();
            let reponse = "";

            if (metier.includes('docteur') || metier.includes('medecin') || metier.includes('sante')) {
                reponse = `[Assistant Médical ELAWS] Analyse clinique pour "${q}". Recommandation : Examen approfondi, prescription suggérée (Paracétamol 1000mg / Amoxicilline 500mg selon diagnostic) et hydratation.`;
            } else if (metier.includes('mecanicien') || metier.includes('meca')) {
                reponse = `[Expert Technique ELAWS] Diagnostic panne pour "${q}" : Vérification allumage, alimentation carburant et capteurs OBD. Nettoyage des injecteurs recommandé.`;
            } else {
                reponse = `[Expert Métier ELAWS] En tant qu'expert en ${utilisateurActif.metierUnique}, voici mon conseil pour "${q}" : Structurer l'action, valider les livrables et assurer le suivi.`;
            }

            utilisateurActif.discussionsElaws.push({ role: 'ai', texte: reponse });
            sauvegarderProfilActif();
            
            if(input) input.value = '';
            lireTexteAAvoix(reponse);
            render();
        }

        function demarrerEcouteMicrophone() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { showToast("Micro non supporté."); return; }
            const recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            showToast("🎤 Écoute de l'expert en cours...");
            recognition.onresult = (event) => {
                const texte = event.results[0][0].transcript;
                document.getElementById('inputElawsChat').value = texte;
                envoyerMessageElawsAI(texte);
            };
            recognition.start();
        }

        // TRADUCTION CROISÉE & DIALECTES TEMPS RÉEL
        function executerTraductionCroisee() {
            const texteSource = document.getElementById('tradTexteInput').value.trim();
            const langCible = document.getElementById('selectLangueCible').value;
            const dialecteSource = document.getElementById('selectDialecteSource').value;

            if(!texteSource) { showToast("Veuillez saisir un texte à traduire."); return; }

            let traductionSimulee = `[Traduction Interprète ELAWS vers ${langCible}] : "${texteSource}" (depuis ${dialecteSource}) -> Interprétation et retranscription vocale réussie.`;
            let langCode = 'fr-FR';
            if(langCible === 'en') langCode = 'en-US';
            if(langCible === 'es') langCode = 'es-ES';

            const resultatDiv = document.getElementById('resultatTraductionDiv');
            resultatDiv.innerHTML = `
                <div style="background:var(--card-bg); border:1px solid #3b82f6; padding:12px; border-radius:8px; margin-top:10px;">
                    <strong style="color:#3b82f6;">🌐 Résultat Traduction Croisée :</strong>
                    <p style="margin:6px 0 0 0; font-size:14px;">${traductionSimulee}</p>
                    <button class="btn-action" style="margin-top:8px; background:#3b82f6; padding:6px; font-size:12px;" onclick="lireTexteAAvoix('${traductionSimulee.replace(/'/g, "\'")}', '${langCode}')">🔊 Écouter</button>
                </div>
            `;
            lireTexteAAvoix(traductionSimulee, langCode);
            showToast("Traduction effectuée !");
        }

        function demarrerMicroTraduction() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { showToast("Micro non supporté."); return; }
            const recognition = new SpeechRecognition();
            recognition.lang = document.getElementById('selectDialecteSource').value;
            showToast("🌐 Écoute du dialecte source...");
            recognition.onresult = (event) => {
                const texte = event.results[0][0].transcript;
                document.getElementById('tradTexteInput').value = texte;
                executerTraductionCroisee();
            };
            recognition.start();
        }

        function ajouterContactAppel() {
            const nom = document.getElementById('appelNom').value.trim();
            const tel = document.getElementById('appelTel').value.trim();
            if(nom && tel) {
                if(!utilisateurActif.contactsAppels) utilisateurActif.contactsAppels = [];
                utilisateurActif.contactsAppels.unshift({ id: Date.now(), nom, tel, type: 'Client / Patient' });
                sauvegarderProfilActif(); showToast("Contact enregistré !"); render();
            } else { showToast("Remplissez le nom et le téléphone."); }
        }

        function lancerAppelGSM(tel) { window.location.href = `tel:${tel}`; }
        function lancerAppelInternet(nom) {
            showToast(`🌐 Appel VoIP avec ${nom} établi !`);
            lireTexteAAvoix(`Appel de données en cours avec ${nom}.`);
        }

        function ajouterDonneeMetier() {
            const titre = document.getElementById('univTitre').value.trim();
            const desc = document.getElementById('univDesc').value.trim();
            if(titre) {
                if(!utilisateurActif.donneesMetierSpecifique.registreUniversel) utilisateurActif.donneesMetierSpecifique.registreUniversel = [];
                utilisateurActif.donneesMetierSpecifique.registreUniversel.unshift({ id: Date.now(), titre, desc, date: new Date().toLocaleDateString() });
                sauvegarderProfilActif(); showToast("Enregistré !"); render();
            } else { showToast("Remplissez l'intitulé."); }
        }

        function supprimerElementMetier(id) {
            utilisateurActif.donneesMetierSpecifique.registreUniversel = utilisateurActif.donneesMetierSpecifique.registreUniversel.filter(x => x.id !== id);
            sauvegarderProfilActif(); showToast("Supprimé."); render();
        }

        function render() {
            const content = document.getElementById('mainContent');
            content.innerHTML = '';

            if (!utilisateurActif) {
                document.getElementById('appHeader').style.display = 'none';
                document.getElementById('bottomBar').style.display = 'none';
                
                let profilsExistantsHtml = '';
                if (listeProfils.length > 0) {
                    profilsExistantsHtml = `<div style="margin-bottom:20px;"><h4 style="margin-bottom:8px;">👥 Ou choisissez un profil existant :</h4><div style="display:flex; flex-direction:column; gap:8px;">`;
                    listeProfils.forEach(p => {
                        profilsExistantsHtml += `<button class="btn-action" style="background:var(--card-bg); border:1px solid var(--accent); color:var(--text-main); text-align:left; padding:12px;" onclick="selectionnerProfilExistant('${p.id}')">👤 <strong>${p.nom}</strong> <small style="float:right; color:var(--accent);">[${p.metierUnique}]</small></button>`;
                    });
                    profilsExistantsHtml += `</div></div>`;
                }

                content.innerHTML = `
                    <div class="card" style="border-color:var(--accent); max-width:500px; margin: 10px auto; text-align:center;">
                        <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo" style="width:72px; height:72px; margin-bottom:10px; border-radius:16px; border:2px solid var(--accent);">
                        <h2 style="color:var(--accent); margin-top:0;">✨ E.V.A.T. & ELAWS</h2>
                        <p class="text" style="text-align:center;">Écosystème Souverain, Voix, Traduction & FAQ.</p>
                        
                        ${profilsExistantsHtml}

                        <div style="text-align:left;">
                            <h4 style="margin-bottom:10px; border-top:1px solid var(--border-color); padding-top:15px;">📝 Créer mon Profil :</h4>
                            <input type="text" id="regNom" class="input" placeholder="Nom ou Pseudonyme *" style="margin-bottom:8px;">
                            <input type="text" id="regMetierCustom" class="input" placeholder="Votre Métier (Docteur, Journaliste, Mécanicien...)" style="margin-bottom:8px;">
                            <input type="text" id="regTel" class="input" placeholder="Téléphone (ex: +228 98231402)" style="margin-bottom:12px;">
                            <button class="btn-action" onclick="creerNouveauProfil()">🚀 Générer mon Profil</button>
                        </div>
                    </div>
                `;
                return;
            }

            document.getElementById('appHeader').style.display = 'block';
            document.getElementById('bottomBar').style.display = 'flex';
            document.getElementById('badgeDomaineActif').innerHTML = `💼 Profil : ${utilisateurActif.metierUnique}`;
            mettreAJourEtatReseau();

            document.querySelectorAll('.bar-item').forEach(el => el.classList.remove('active'));
            if(activeTab === 'accueil') document.getElementById('barAccueil')?.classList.add('active');
            if(activeTab === 'elaws_compagnon') document.getElementById('barElaws')?.classList.add('active');
            if(activeTab === 'traduction_croisee') document.getElementById('barTrad')?.classList.add('active');
            if(activeTab === 'faq') document.getElementById('barFaq')?.classList.add('active');
            if(activeTab === 'economie') document.getElementById('barEco')?.classList.add('active');

            if (activeTab === 'accueil') {
                let voixList = getAvailableVoices();
                let optionsVoixHtml = '';
                if (voixList.length > 0) {
                    voixList.forEach((v, index) => {
                        const selected = index == voixActiveIndex ? 'selected' : '';
                        optionsVoixHtml += `<option value="${index}" ${selected}>${v.name} (${v.lang})</option>`;
                    });
                } else {
                    optionsVoixHtml = `<option value="0">Voix par défaut du système</option>`;
                }

                content.innerHTML = `
                    <div class="card" style="border-color: var(--accent);">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <div>
                                <span style="font-size:11px; color:var(--accent); font-weight:700;">💼 PROFIL SOUVERAIN</span>
                                <div style="font-size:17px; font-weight:800;">${utilisateurActif.nom}</div>
                            </div>
                            <button class="btn-top" onclick="changerProfilSession()">🔄 Changer</button>
                        </div>
                        <p class="text">Métier actif : <strong style="color:var(--accent);">${utilisateurActif.metierUnique}</strong>. Prêt pour l'assistance et les outils métiers.</p>

                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-top:15px; border:1px solid var(--border-color);">
                            <h4 style="margin:0 0 8px 0; color:var(--accent);">🗣️ Voix d'ELAWS :</h4>
                            <select id="selectVoix" class="input" onchange="changerVoixElaws(this)">
                                ${optionsVoixHtml}
                            </select>
                            <button class="btn-action" style="margin-top:8px; padding:8px;" onclick="lireTexteAAvoix('Test de la voix sélectionnée pour ELAWS.')">🔊 Tester cette voix</button>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'elaws_compagnon') {
                let chatHtml = '';
                if (utilisateurActif.discussionsElaws) {
                    utilisateurActif.discussionsElaws.forEach(msg => {
                        const isAi = msg.role === 'ai';
                        chatHtml += `
                            <div style="background:${isAi ? 'rgba(5,150,105,0.15)' : 'var(--bg-color)'}; border-left:4px solid ${isAi ? 'var(--accent)' : 'var(--border-color)'}; padding:14px; border-radius:10px; margin-bottom:12px; position:relative;">
                                <strong style="font-size:12px; color:${isAi ? 'var(--accent)' : 'var(--text-secondary)'};">${isAi ? '🤖 ELAWS (Expert ' + utilisateurActif.metierUnique + ')' : utilisateurActif.nom}</strong>
                                <p style="margin:8px 0 0 0; font-size:14px;">${msg.texte}</p>
                                ${isAi ? `<button onclick="lireTexteAAvoix('${msg.texte.replace(/'/g, "'")}')" style="position:absolute; top:10px; right:10px; background:var(--accent); color:#000; border:none; padding:4px 8px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer;">🔊 Écouter</button>` : ''}
                            </div>
                        `;
                    });
                }
                content.innerHTML = `
                    <div class="card" style="border-color:var(--accent);">
                        <h3 class="card-title" style="color:var(--accent);">🤖 ELAWS — Assistant & Expert Métier</h3>
                        <p class="text">Posez vos questions ou décrivez un cas (symptômes de patient, panne technique, etc.) :</p>
                        <div style="text-align:center; margin-bottom:15px;">
                            <button class="btn-action" onclick="demarrerEcouteMicrophone()" style="background:var(--accent-gradient); font-size:18px; padding:16px; border-radius:30px;">
                                🎤 Parler à l'Expert ELAWS
                            </button>
                        </div>
                        <div style="background:var(--bg-color); padding:15px; border-radius:12px; max-height:350px; overflow-y:auto; margin-bottom:15px; border:1px solid var(--border-color);">
                            ${chatHtml}
                        </div>
                        <div style="display:flex; gap:8px;">
                            <input type="text" id="inputElawsChat" class="input" placeholder="Tapez votre question ou cas..." style="margin-bottom:0;" onkeypress="if(event.key === 'Enter') envoyerMessageElawsAI()">
                            <button class="btn-action" style="width:auto; padding:0 22px;" onclick="envoyerMessageElawsAI()">Analyser 🚀</button>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'traduction_croisee') {
                content.innerHTML = `
                    <div class="card" style="border-color:#3b82f6;">
                        <h3 class="card-title" style="color:#3b82f6;">🌐 Module de Traduction Croisée & Dialectes</h3>
                        <p class="text">Communiquez instantanément avec une personne parlant un autre dialecte ou une autre langue. ELAWS traduit et transcrit dans les deux sens.</p>
                        
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px; border:1px solid var(--border-color);">
                            <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:4px;">1. Langue / Dialecte Source :</label>
                            <select id="selectDialecteSource" class="input" style="margin-bottom:10px;">
                                <option value="fr-FR">Français</option>
                                <option value="en-US">Anglais (English)</option>
                                <option value="es-ES">Espagnol (Español)</option>
                                <option value="yo-NG">Yoruba</option>
                                <option value="ee-TG">Ewé / Gbe</option>
                            </select>

                            <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:4px;">2. Langue Cible (Votre choix) :</label>
                            <select id="selectLangueCible" class="input" style="margin-bottom:10px;">
                                <option value="fr">Français</option>
                                <option value="en">Anglais (English)</option>
                                <option value="es">Espagnol (Español)</option>
                                <option value="ew">Ewé</option>
                                <option value="yo">Yoruba</option>
                            </select>

                            <textarea id="tradTexteInput" class="input" placeholder="Saisissez ou parlez..." rows="3" style="resize:none; margin-bottom:8px;"></textarea>
                            
                            <div style="display:flex; gap:8px;">
                                <button class="btn-action" style="background:#3b82f6;" onclick="executerTraductionCroisee()">Traduire & Transcrire 🔄</button>
                                <button class="btn-action" style="background:#10b981; width:auto; padding:0 16px;" onclick="demarrerMicroTraduction()">🎤 Micro</button>
                            </div>
                        </div>

                        <div id="resultatTraductionDiv"></div>
                    </div>
                `;
            } else if (activeTab === 'faq') {
                content.innerHTML = `
                    <div class="card" style="border-color:#f59e0b;">
                        <h3 class="card-title" style="color:#f59e0b;">❓ FAQ & Guide d'Utilisation E.V.A.T.</h3>
                        <p class="text">Trouvez ici toutes les réponses pour exploiter pleinement l'écosystème et l'assistant ELAWS.</p>
                        
                        <div class="faq-item" onclick="toggleFaqItem(this)">
                            <div class="faq-question">1. Comment installer l'application sur mon téléphone ? <span>▼</span></div>
                            <div class="faq-answer">Cliquez simplement sur le bouton <strong>"🚀 Installer l'Application"</strong> qui apparaît en haut de l'écran ou utilisez le menu de votre navigateur mobile (Safari / Chrome) en sélectionnant <em>"Ajouter à l'écran d'accueil"</em>.</div>
                        </div>

                        <div class="faq-item" onclick="toggleFaqItem(this)">
                            <div class="faq-question">2. Comment changer la voix d'ELAWS ? <span>▼</span></div>
                            <div class="faq-answer">Rendez-vous dans l'onglet <strong>Profil</strong> sur la page d'accueil. Vous y trouverez un menu déroulant listant toutes les voix disponibles sur votre appareil. Choisissez celle qui vous plaît et testez-la en direct.</div>
                        </div>

                        <div class="faq-item" onclick="toggleFaqItem(this)">
                            <div class="faq-question">3. Comment fonctionne la Traduction Croisée ? <span>▼</span></div>
                            <div class="faq-answer">Allez dans le module <strong>Traduction (🌐)</strong>. Sélectionnez la langue ou le dialecte de votre interlocuteur et votre langue cible. Tapez ou utilisez le micro pour traduire et écouter instantanément la restitution vocale.</div>
                        </div>

                        <div class="faq-item" onclick="toggleFaqItem(this)">
                            <div class="faq-question">4. Comment ELAWS m'aide-t-il selon mon métier ? <span>▼</span></div>
                            <div class="faq-answer">Lors de la création de votre profil, indiquez votre profession (Docteur, Mécanicien, Journaliste, etc.). ELAWS analyse le contexte et adapte ses conseils (protocoles cliniques, diagnostics techniques, structures de texte).</div>
                        </div>

                        <div class="faq-item" onclick="toggleFaqItem(this)">
                            <div class="faq-question">5. L'application fonctionne-t-elle hors-ligne ? <span>▼</span></div>
                            <div class="faq-answer">Oui ! Grâce au Service Worker et au stockage local (localStorage), l'application fonctionne entièrement sans connexion internet, garantissant une souveraineté totale de vos données.</div>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'appels') {
                let contactsHtml = '';
                if(utilisateurActif.contactsAppels) {
                    utilisateurActif.contactsAppels.forEach(c => {
                        contactsHtml += `
                            <div style="background:var(--bg-color); padding:14px; border-radius:10px; margin-bottom:10px; border-left:4px solid var(--accent); display:flex; justify-content:space-between; align-items:center;">
                                <div><strong>👤 ${c.nom}</strong><br><small style="color:var(--text-secondary);">${c.tel}</small></div>
                                <div style="display:flex; gap:8px;">
                                    <button class="btn-action" style="width:auto; padding:8px 12px; background:#10b981;" onclick="lancerAppelGSM('${c.tel}')">📞 GSM</button>
                                    <button class="btn-action" style="width:auto; padding:8px 12px; background:#3b82f6;" onclick="lancerAppelInternet('${c.nom}')">🌐 Data</button>
                                </div>
                            </div>
                        `;
                    });
                }
                content.innerHTML = `
                    <div class="card" style="border-color:var(--accent);">
                        <h3 class="card-title">📞 Appels & Contacts</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <input type="text" id="appelNom" class="input" placeholder="Nom du contact" style="margin-bottom:8px;">
                            <input type="text" id="appelTel" class="input" placeholder="Téléphone" style="margin-bottom:8px;">
                            <button class="btn-action" onclick="ajouterContactAppel()">Enregistrer le Contact</button>
                        </div>
                        ${contactsHtml}
                    </div>
                `;
            } else if (activeTab === 'atelier_specifique') {
                let listeUniv = '';
                const dms = utilisateurActif.donneesMetierSpecifique || {};
                if(dms.registreUniversel && dms.registreUniversel.length > 0) {
                    dms.registreUniversel.forEach(u => {
                        listeUniv += `<div style="background:var(--bg-color); padding:10px; border-radius:6px; margin-bottom:6px; position:relative;"><strong>📌 ${u.titre}</strong> — ${u.desc} <button onclick="supprimerElementMetier(${u.id})" style="float:right; background:none; border:none; color:#ef4444; cursor:pointer;">❌</button></div>`;
                    });
                } else { listeUniv = '<p style="color:var(--text-secondary);">Aucun enregistrement.</p>'; }

                content.innerHTML = `
                    <div class="card" style="border-color:var(--accent);">
                        <h3 class="card-title">⚡ Outils : ${utilisateurActif.metierUnique}</h3>
                        <div style="background:var(--bg-color); padding:15px; border-radius:10px; margin-bottom:15px;">
                            <input type="text" id="univTitre" class="input" placeholder="Intitulé de la tâche / dossier patient" style="margin-bottom:8px;">
                            <input type="text" id="univDesc" class="input" placeholder="Détails ou remarques" style="margin-bottom:8px;">
                            <button class="btn-action" onclick="ajouterDonneeMetier()">Enregistrer</button>
                        </div>
                        ${listeUniv}
                    </div>
                `;
            } else if (activeTab === 'economie') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">🪙 Caisse & Trésorerie</h3>
                        <div style="font-size:24px; font-weight:800; color:var(--accent); text-align:center; padding:15px;">${utilisateurActif.solde.toLocaleString()} FCFA</div>
                    </div>
                `;
            }
        }

        function switchTab(t) { activeTab = t; document.getElementById('sideMenu').classList.remove('open'); render(); window.scrollTo(0, 0); }
        render();
    </script>
</body>
</html>
