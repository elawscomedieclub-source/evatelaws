<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.V.A.T. & ELAWS - Écosystème Souverain Universel</title>
    
    <link rel="manifest" href="data:application/manifest+json,{
        'name': 'E.V.A.T. & ELAWS',
        'short_name': 'EVAT',
        'start_url': '.',
        'display': 'standalone',
        'background_color': '#0b0f19',
        'theme_color': '#059669',
        'icons': [{
            'src': 'https://img.icons8.com/color/192/000000/artificial-intelligence.png',
            'sizes': '192x192',
            'type': 'image/png'
        }]
    }">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #34d399;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --accent: #059669;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        [data-theme="eco"] {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #22c55e;
            --text-secondary: #15803d;
            --accent: #22c55e;
            --accent-gradient: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            --border-color: #14532d;
            --shadow: 0 0 15px rgba(34, 197, 94, 0.15);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 90px;
            transition: background 0.4s ease, color 0.4s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.4);
            border: 2px solid var(--accent);
        }
        .menu-toggle {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s;
        }
        .menu-toggle:hover { transform: scale(1.05); }
        .title { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .btn-top {
            background-color: var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s;
        }
        .badge-info {
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 15px;
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bottom-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }
        .bar-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .bar-item span.icon { font-size: 18px; }
        .bar-item.active, .bar-item:hover { color: var(--accent); }

        #toastNotification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            font-size: 13px;
            font-weight: 700;
            z-index: 1000;
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90%;
            text-align: center;
        }
        #toastNotification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .sidebar {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
            max-height: 70vh;
            overflow-y: auto;
        }
        .sidebar.open { display: block; }
        .sidebar h3 { font-size: 0.95rem; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        .menu-item {
            background: rgba(16, 185, 129, 0.08);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: none;
            width: 100%;
            text-align: left;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .menu-item:hover { background: rgba(16, 185, 129, 0.18); transform: translateX(4px); }
        .module-container { flex: 1; max-width: 750px; width: 100%; margin: 0 auto; }
        .card {
            background-color: var(--card-bg);
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease;
        }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-top: 0; margin-bottom: 10px; }
        .text { font-size: 14px; color: var(--text-secondary); margin-bottom: 15px; line-height: 1.6; }
        .input {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 11px;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .input:focus { border-color: var(--accent); }
        select.input { width: 100%; }
        textarea.input { resize: vertical; min-height: 80px; }
        .btn-action {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-action:hover { transform: translateY(-1px); opacity: 0.95; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body data-theme="dark">

    <div id="toastNotification">✨ <span id="toastText">Action exécutée</span></div>

    <div id="appHeader" style="display:none;">
        <header>
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
                <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo ELAWS" class="app-logo">
                <div class="title">E.V.A.T. & ELAWS</div>
            </div>
            <div class="header-right">
                <button class="btn-top" onclick="changerTheme()">🎨 Thème</button>
                <button class="btn-top" onclick="changerProfilSession()">👤 Profils</button>
            </div>
        </header>
        <div class="badge-info" id="badgeDomaineActif">🌍 Écosystème Souverain Universel</div>
    </div>

    <!-- BANDEAU D'INSTALLATION AUTOMATIQUE -->
    <div id="installBanner" class="card" style="display:none; border-color:var(--accent); background:rgba(5,150,105,0.15); text-align:center;">
        <img src="https://img.icons8.com/color/96/000000/artificial-intelligence.png" alt="Logo" style="width:50px; height:50px; margin-bottom:8px; border-radius:12px;">
        <h3 class="card-title" style="color:var(--accent); margin-bottom:6px;">📲 Installer E.V.A.T. & ELAWS</h3>
        <p class="text" style="margin-bottom:12px;">Installez l'application en un clic pour l'utiliser en plein écran et hors-ligne !</p>
        <button class="btn-action" id="btnInstallApp" style="font-size:15px; padding:14px;">Installer l'Application Immédiatement</button>
    </div>

    <div id="sideMenu" class="sidebar">
        <h3>📂 Navigation Complète E.V.A.T.</h3>
        <button class="menu-item" onclick="switchTab('accueil')">🏠 Accueil & Mon Métier</button>
        <button class="menu-item" onclick="switchTab('objectifs')">🎯 Objectifs & Projets</button>
        <button class="menu-item" onclick="switchTab('notes')">📓 Journal de Bord (ELAWS)</button>
        <button class="menu-item" onclick="switchTab('factures')">🧾 Reçus & Factures</button>
        <button class="menu-item" onclick="switchTab('sauvegarde')">💾 Sauvegarde & Restauration (JSON)</button>
        <button class="menu-item" onclick="switchTab('dossiers')">📁 Assistant Visas & Séjour</button>
        <button class="menu-item" onclick="switchTab('convertisseur')">💱 Convertisseur de Devises</button>
        <button class="menu-item" onclick="switchTab('traduction')">🗣️ Pont de Traduction (ELAWS)</button>
        <button class="menu-item" onclick="switchTab('carnet')">📝 Carnet de Commandes</button>
        <button class="menu-item" onclick="switchTab('gps')">🧭 Géolocalisation & GPS</button>
        <button class="menu-item" onclick="switchTab('economie')">🪙 Finances & Caisse</button>
        <button class="menu-item" onclick="switchTab('camera')">📸 Caméra & Documents</button>
        <button class="menu-item" onclick="switchTab('securite')">🛡️ Sécurité & Chiffrement</button>
        <button class="menu-item" onclick="switchTab('ia')">🤖 Assistant ELAWS AI</button>
    </div>

    <div class="module-container" id="mainContent"></div>

    <div id="bottomBar" class="bottom-action-bar" style="display:none;">
        <button class="bar-item active" onclick="switchTab('accueil')" id="barAccueil">
            <span class="icon">💼</span><span>Métier</span>
        </button>
        <button class="bar-item" onclick="switchTab('objectifs')" id="barObj">
            <span class="icon">🎯</span><span>Objectifs</span>
        </button>
        <button class="bar-item" onclick="switchTab('notes')" id="barNotes">
            <span class="icon">📓</span><span>Notes</span>
        </button>
        <button class="bar-item" onclick="switchTab('factures')" id="barFactures">
            <span class="icon">🧾</span><span>Factures</span>
        </button>
        <button class="bar-item" onclick="switchTab('sauvegarde')" id="barSauv">
            <span class="icon">💾</span><span>Backup</span>
        </button>
    </div>

    <script>
        let activeTab = 'accueil';
        let currentThemeIndex = 0;
        const themes = ['dark', 'light', 'eco'];

        function changerTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const t = themes[currentThemeIndex];
            document.body.setAttribute('data-theme', t);
            showToast(`Thème : ${t.toUpperCase()}`);
        }
        
        let listeProfils = JSON.parse(localStorage.getItem('evat_tous_profils')) || [];
        let idProfilActif = localStorage.getItem('evat_profil_actif_id') || null;
        let utilisateurActif = null;

        function chargerDonneesProfil() {
            if (idProfilActif) {
                const trouve = listeProfils.find(p => p.id == idProfilActif);
                if (trouve) utilisateurActif = trouve;
            }
            if (!utilisateurActif && listeProfils.length > 0) {
                utilisateurActif = listeProfils[0];
                idProfilActif = utilisateurActif.id;
            }
        }

        chargerDonneesProfil();

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            const text = document.getElementById('toastText');
            text.innerHTML = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').style.display = 'block';
        });

        document.getElementById('btnInstallApp').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBanner').style.display = 'none';
                    showToast("Application installée avec succès !");
                }
                deferredPrompt = null;
            } else {
                showToast("L'application est prête sur votre écran.");
            }
        });

        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('open'); }

        function creerNouveauProfil() {
            const nom = document.getElementById('regNom').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const metierUnique = document.getElementById('regMetierCustom').value.trim() || 'Professionnel Indépendant';
            const tel = document.getElementById('regTel').value.trim();
            const nat = document.getElementById('regNationalite').value;
            const pays = document.getElementById('regPaysActuel').value;

            if (!nom || !email) {
                showToast("Veuillez renseigner votre nom et votre e-mail.");
                return;
            }

            const nouveauId = 'prof_' + Date.now();
            const nouveauProfil = {
                id: nouveauId,
                nom: nom,
                email: email,
                telephone: tel || '+228 98231402',
                nationalite: nat,
                paysActuel: pays,
                metierUnique: metierUnique,
                objectifs: [
                    { id: 1, categorie: "Finances & Business", titre: `Faire prospérer mon activité de ${metierUnique}`, statut: "En cours" }
                ],
                notes: [
                    { id: 1, titre: "Bienvenue dans E.V.A.T.", texte: `Espace souverain configuré exclusivement pour : ${metierUnique}.`, date: new Date().toLocaleDateString() }
                ],
                solde: 50000,
                carnet: [],
                historiqueFinancier: [
                    { date: new Date().toLocaleDateString(), desc: "Capital initial", montant: 50000, type: "entree" }
                ],
                dossiersVoyage: [
                    { id: 1, titre: "Passeport / Pièce d'identité", statut: "Validé" },
                    { id: 2, titre: "Justificatif de domicile", statut: "En attente" }
                ]
            };

            listeProfils.push(nouveauProfil);
            localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils));
            localStorage.setItem('evat_profil_actif_id', nouveauId);
            
            idProfilActif = nouveauId;
            utilisateurActif = nouveauProfil;

            showToast(`Bienvenue, ${nom} (${metierUnique}) !`);
            render();
        }

        function changerProfilSession() {
            idProfilActif = null;
            utilisateurActif = null;
            localStorage.removeItem('evat_profil_actif_id');
            document.getElementById('appHeader').style.display = 'none';
            document.getElementById('bottomBar').style.display = 'none';
            document.getElementById('sideMenu').classList.remove('open');
            render();
        }

        function selectionnerProfilExistant(id) {
            idProfilActif = id;
            localStorage.setItem('evat_profil_actif_id', id);
            chargerDonneesProfil();
            showToast(`Profil chargé : ${utilisateurActif.nom}`);
            render();
        }

        function sauvegarderProfilActif() {
            const index = listeProfils.findIndex(p => p.id == utilisateurActif.id);
            if (index !== -1) {
                listeProfils[index] = utilisateurActif;
                localStorage.setItem('evat_tous_profils', JSON.stringify(listeProfils));
            }
        }

        function mettreAJourIdentiteEtMetier() {
            utilisateurActif.nom = document.getElementById('inputNomUtilisateur').value.trim() || utilisateurActif.nom;
            utilisateurActif.metierUnique = document.getElementById('inputMetierUnique').value.trim() || utilisateurActif.metierUnique;
            utilisateurActif.nationalite = document.getElementById('selectNationalite').value;
            utilisateurActif.paysActuel = document.getElementById('selectPaysActuel').value;
            utilisateurActif.email = document.getElementById('inputEmailUtilisateur').value.trim() || utilisateurActif.email;
            utilisateurActif.telephone = document.getElementById('inputTelUtilisateur').value.trim() || utilisateurActif.telephone;
            
            sauvegarderProfilActif();
            showToast("Profil et métier mis à jour !");
            render();
        }

        function ajouterObjectifVie() {
            const cat = document.getElementById('objCategorie').value;
            const titre = document.getElementById('objTitre').value.trim();
            if (titre) {
                utilisateurActif.objectifs.unshift({ id: Date.now(), categorie: cat, titre, statut: "En cours" });
                sauvegarderProfilActif();
                document.getElementById('objTitre').value = '';
                showToast("Objectif ajouté !");
                render();
            } else {
                showToast("Veuillez saisir l'intitulé.");
            }
        }

        function ajouterNoteJournal() {
            const titre = document.getElementById('noteTitre').value.trim();
            const texte = document.getElementById('noteTexte').value.trim();
            if (titre && texte) {
                utilisateurActif.notes.unshift({ id: Date.now(), titre, texte, date: new Date().toLocaleDateString() });
                sauvegarderProfilActif();
                document.getElementById('noteTitre').value = '';
                document.getElementById('noteTexte').value = '';
                showToast("Note enregistrée !");
                render();
            } else {
                showToast("Remplissez tous les champs.");
            }
        }

        function genererRecuFacture() {
            const client = document.getElementById('factureClient').value.trim();
            const service = document.getElementById('factureService').value.trim();
            const montant = document.getElementById('factureMontant').value;
            const devise = document.getElementById('factureDevise').value;

            if (client && service && montant) {
                const recuHtml = `
                    <div style="background:#ffffff; color:#0f172a; padding:20px; border-radius:10px; border:2px dashed var(--accent); margin-top:10px;">
                        <div style="text-align:center; border-bottom:2px solid #cbd5e1; padding-bottom:10px; margin-bottom:10px;">
                            <img src="https://img.icons8.com/color/48/000000/artificial-intelligence.png" style="width:32px; height:32px; vertical-align:middle; margin-right:8px;">
                            <h3 style="margin:0; display:inline-block; color:#059669;">🧾 REÇU DE PRESTATION</h3>
                            <br><small>E.V.A.T. — ${utilisateurActif.metierUnique} (${utilisateurActif.nom})</small>
                        </div>
                        <p><strong>Date :</strong> ${new Date().toLocaleDateString()}</p>
                        <p><strong>Prestataire :</strong> ${utilisateurActif.nom} — <em>${utilisateurActif.metierUnique}</em> (${utilisateurActif.telephone})</p>
                        <p><strong>Client :</strong> ${client}</p>
                        <p><strong>Prestation :</strong> ${service}</p>
                        <p style="font-size:16px;"><strong>Montant :</strong> <span style="color:#059669; font-weight:800;">${parseFloat(montant).toLocaleString()} ${devise}</span></p>
                    </div>
                `;
                document.getElementById('resultatFacture').innerHTML = recuHtml;
                showToast("Facture générée !");
            } else {
                showToast("Remplissez tous les champs.");
            }
        }

        function exporterDonneesJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(utilisateurActif, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `EVAT_${utilisateurActif.metierUnique.replace(/\s+/g, '_')}_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Sauvegarde JSON exportée !");
        }

        function convertirDeviseAction() {
            const montant = parseFloat(document.getElementById('montantDevise').value) || 0;
            const type = document.getElementById('paireDevise').value;
            let resultat = 0;
            let texteRes = '';
            if (type === 'eur_xof') {
                resultat = montant * 655.957;
                texteRes = `${montant} EUR = ${resultat.toFixed(2)} XOF (FCFA)`;
            } else if (type === 'xof_eur') {
                resultat = montant / 655.957;
                texteRes = `${montant} XOF = ${resultat.toFixed(2)} EUR`;
            } else if (type === 'usd_xof') {
                resultat = montant * 600;
                texteRes = `${montant} USD = ${resultat.toFixed(2)} XOF (FCFA)`;
            } else {
                resultat = montant / 600;
                texteRes = `${montant} XOF = ${resultat.toFixed(2)} USD`;
            }
            document.getElementById('resultatConversion').innerText = texteRes;
            showToast("Conversion effectuée !");
        }

        function traduireElawsAction() {
            const texte = document.getElementById('texteATraduire').value.trim();
            const lang = document.getElementById('langueCible').value;
            if (!texte) { showToast("Entrez un texte à traduire."); return; }
            let traduit = `[Traduction ELAWS vers ${lang.toUpperCase()}] : ${texte} (Version souveraine optimisée pour ${utilisateurActif.metierUnique}).`;
            document.getElementById('resultatTraduction').innerText = traduit;
            showToast("Traduction ELAWS prête !");
        }

        function ajouterTransactionCaisse() {
            const desc = document.getElementById('descCaisse').value.trim();
            const montant = parseFloat(document.getElementById('montantCaisse').value);
            const type = document.getElementById('typeCaisse').value;
            if (desc && !isNaN(montant)) {
                if (type === 'entree') {
                    utilisateurActif.solde += montant;
                    utilisateurActif.historiqueFinancier.unshift({ date: new Date().toLocaleDateString(), desc, montant, type: 'entree' });
                } else {
                    utilisateurActif.solde -= montant;
                    utilisateurActif.historiqueFinancier.unshift({ date: new Date().toLocaleDateString(), desc, montant, type: 'sortie' });
                }
                sauvegarderProfilActif();
                showToast("Caisse mise à jour !");
                render();
            } else {
                showToast("Veuillez remplir les champs de caisse.");
            }
        }

        function interrogerElawsAI() {
            const q = document.getElementById('inputElawsQuestion').value.trim();
            if (!q) { showToast("Posez une question à ELAWS."); return; }
            let reponse = "";
            const qLower = q.toLowerCase();
            if (qLower.includes('bonjour') || qLower.includes('salut')) {
                reponse = `Bonjour ${utilisateurActif.nom} ! ELAWS est à vos côtés en tant qu'assistant souverain pour votre activité de ${utilisateurActif.metierUnique}. Comment puis-je vous aider aujourd'hui ?`;
            } else if (qLower.includes('client') || qLower.includes('facture')) {
                reponse = `En tant que ${utilisateurActif.metierUnique}, vous pouvez utiliser l'onglet 'Factures' pour générer instantanément vos reçus professionnels.`;
            } else if (qLower.includes('argent') || qLower.includes('solde') || qLower.includes('caisse')) {
                reponse = `Votre solde actuel dans E.V.A.T. est de ${utilisateurActif.solde.toLocaleString()} FCFA. Vous pouvez suivre vos entrées et sorties dans l'onglet 'Finances & Caisse'.`;
            } else {
                reponse = `ELAWS a analysé votre requête concernant "${q}" dans le cadre de votre métier de ${utilisateurActif.metierUnique}. Vos données restent sécurisées sur votre appareil. Souhaitez-vous enregistrer cette note ou créer un objectif lié ?`;
            }
            document.getElementById('reponseElawsAI').innerHTML = `<div style="background:var(--bg-color); padding:12px; border-radius:8px; border-left:4px solid var(--accent); margin-top:10px;"><strong>🤖 ELAWS :</strong> ${reponse}</div>`;
            showToast("Réponse ELAWS générée !");
        }
