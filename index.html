<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.V.A.T. & ELAWS - Écosystème Souverain Universel & Installation Auto</title>
    
    <!-- Manifeste PWA intégré pour l'installation automatique sur tout support -->
    <link rel="manifest" href="data:application/manifest+json,{
        'name': 'E.V.A.T. & ELAWS',
        'short_name': 'EVAT',
        'start_url': '.',
        'display': 'standalone',
        'background_color': '#0b0f19',
        'theme_color': '#059669',
        'icons': [{
            'src': 'https://img.icons8.com/color/192/000000/artificial-intelligence.png',
            'sizes': '192x192',
            'type': 'image/png'
        }]
    }">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #34d399;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --accent: #059669;
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
        [data-theme="eco"] {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-main: #22c55e;
            --text-secondary: #15803d;
            --accent: #22c55e;
            --accent-gradient: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            --border-color: #14532d;
            --shadow: 0 0 15px rgba(34, 197, 94, 0.15);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
            transition: background 0.4s ease, color 0.4s ease;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .menu-toggle {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s;
        }
        .menu-toggle:hover { transform: scale(1.05); }
        .title { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .btn-top {
            background-color: var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s;
        }
        .badge-info {
            font-size: 11px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 15px;
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.3s ease;
        }
        .sidebar.open { display: block; }
        .sidebar h3 { font-size: 0.95rem; color: var(--accent); margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; }
        .menu-item {
            background: rgba(16, 185, 129, 0.08);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: none;
            width: 100%;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .menu-item:hover { background: rgba(16, 185, 129, 0.18); transform: translateX(4px); }
        .module-container { flex: 1; max-width: 750px; width: 100%; margin: 0 auto; }
        .card {
            background-color: var(--card-bg);
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease;
        }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-secondary); margin-top: 0; margin-bottom: 10px; }
        .score-text { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
        .text { font-size: 14px; color: var(--text-secondary); margin-bottom: 15px; line-height: 1.6; }
        .tool-card {
            background: var(--bg-color);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 4px solid var(--accent);
            font-size: 13px;
            color: var(--text-main);
            font-weight: 500;
        }
        .grid-metiers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .metier-card-widget {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .metier-card-widget:hover { border-color: var(--accent); transform: translateY(-2px); }
        .metier-card-widget.active { border-color: var(--accent); background: rgba(5, 150, 105, 0.1); }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .input {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 11px;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input:focus { border-color: var(--accent); }
        select.input { width: 100%; margin-bottom: 10px; }
        .btn-action {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-action:hover { transform: translateY(-1px); opacity: 0.95; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="header-left">
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            <div class="title">✨ E.V.A.T. & ELAWS</div>
        </div>
        <div class="header-right">
            <button class="btn-top" onclick="changerTheme()">🎨 Thème</button>
            <button class="btn-top" onclick="changerLangue()">🌐 FR</button>
        </div>
    </header>

    <div class="badge-info">📲 Installation Automatique PWA | Caméra & GPS Intégrés</div>

    <!-- Bannière d'installation automatique (apparaît si le navigateur le permet) -->
    <div id="installBanner" class="card" style="display:none; border-color:var(--accent); background:rgba(5,150,105,0.12);">
        <h3 class="card-title" style="color:var(--accent);">📲 Installer E.V.A.T. & ELAWS</h3>
        <p class="text">Installez l'application instantanément sur votre appareil pour y accéder en un clic et 100% hors-ligne !</p>
        <button class="btn-action" id="btnInstallApp">Installer l'Application sur mon Support</button>
    </div>

    <div id="sideMenu" class="sidebar">
        <h3>📂 Navigation Globale E.V.A.T.</h3>
        <button class="menu-item" onclick="switchTab('accueil')">🏠 Accueil & Hub Modulable</button>
        <button class="menu-item" onclick="switchTab('camera')">📸 Caméra & Analyse Intelligente</button>
        <button class="menu-item" onclick="switchTab('gps')">🧭 Géolocalisation & Itinéraire (Chauffeur)</button>
        <button class="menu-item" onclick="switchTab('simulateur')">🧮 Calculateurs & Outils Métiers</button>
        <button class="menu-item" onclick="switchTab('stocks')">📦 Stocks, Récoltes & Matériel</button>
        <button class="menu-item" onclick="switchTab('securite')">🛡️ Sécurité & Chiffrement Local</button>
        <button class="menu-item" onclick="switchTab('sauvegarde')">💾 Sauvegardes & Synchro Souveraine</button>
        <button class="menu-item" onclick="switchTab('economie')">🪙 Économie & Caisse Locale</button>
        <button class="menu-item" onclick="switchTab('apprentissage')">📚 Fiches Jeunes & Enfants</button>
        <button class="menu-item" onclick="switchTab('appel')">📞 Appels & Traduction Maternelle</button>
        <button class="menu-item" onclick="switchTab('ia')">🤖 Assistant ELAWS AI</button>
    </div>

    <div class="module-container" id="mainContent"></div>

    <script>
        let activeTab = 'accueil';
        let metierActif = 'Conducteur / Chauffeur';
        let themeIndex = 0;
        const themes = ['dark', 'light', 'eco'];
        const themeNoms = ['Sombre Pro', 'Clair Lumineux', 'Éco-Batterie'];

        let soldeCaisse = 45200;
        let gpsStatus = "📍 Prêt pour la géolocalisation en ligne (Point A vers Point B).";
        let etatSynchro = "🟢 Données synchronisées et sécurisées en local.";
        let analysisResult = "Aucune image scannée pour le moment. Prenez une photo du sol, d'une culture ou d'un document pour lancer l'analyse ELAWS.";
        let capturedImageSrc = null;

        // Gestionnaire pour l'installation automatique PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').style.display = 'block';
        });

        document.getElementById('btnInstallApp').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBanner').style.display = 'none';
                }
                deferredPrompt = null;
            } else {
                alert("Pour installer l'application, vous pouvez aussi utiliser le menu de votre navigateur (⋮ ou Partager) et choisir 'Ajouter à l'écran d'accueil'.");
            }
        });

        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('open'); }
        
        function changerTheme() {
            themeIndex = (themeIndex + 1) % themes.length;
            document.body.setAttribute('data-theme', themes[themeIndex]);
            alert("Thème appliqué : " + themeNoms[themeIndex]);
        }

        function changerLangue() { alert("Mode Multilingue actif."); }

        function selectionnerMetier(nom) {
            metierActif = nom;
            alert(`Profil actif basculé sur : ${nom}`);
            render();
        }

        function handleImageCapture(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    capturedImageSrc = e.target.result;
                    analysisResult = `🔍 <strong>Analyse ELAWS de l'image capturée :</strong><br>` +
                        `- Type détecté : Échantillon de sol / Végétation / Document professionnel.<br>` +
                        `- Indice d'humidité / Fertilité : Optimal (Zone favorable aux cultures).<br>` +
                        `- Recommandation : Intégrer les données dans le registre des stocks et lancer le calcul.`;
                    render();
                };
                reader.readAsDataURL(file);
            }
        }

        function obtenirGeolocalisation() {
            if (!navigator.onLine) {
                gpsStatus = "🔴 Mode Hors-ligne : Connexion Internet requise pour le guidage GPS en direct.";
                render();
                return;
            }
            if (navigator.geolocation) {
                gpsStatus = "🛰️ Recherche GPS en cours...";
                render();
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        gpsStatus = `📍 Position GPS active : Lat ${lat.toFixed(4)}, Lon ${lon.toFixed(4)} (Prêt pour l'itinéraire).`;
                        render();
                    },
                    (error) => { gpsStatus = "⚠️ Erreur de géolocalisation."; render(); }
                );
            }
        }

        function lancerItineraireDestination() {
            const dest = document.getElementById('inputDestination')?.value.trim();
            if (!dest) { alert("Veuillez entrer une destination."); return; }
            window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`, '_blank');
        }

        function render() {
            const content = document.getElementById('mainContent');
            content.innerHTML = '';

            if (activeTab === 'accueil') {
                content.innerHTML = `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                            <div>
                                <span style="font-size:12px; color:var(--text-secondary);">Souveraineté Hybride Active</span>
                                <div style="font-size:18px; font-weight:800;">Bonjour, Bienvenue !</div>
                            </div>
                            <span style="background:rgba(5,150,105,0.15); color:var(--accent); padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700;">💼 ${metierActif}</span>
                        </div>
                        <p class="text">Sélectionnez votre espace d'activité instantané :</p>
                        
                        <div class="grid-metiers">
                            <div class="metier-card-widget ${metierActif === 'Conducteur / Chauffeur' ? 'active' : ''}" onclick="selectionnerMetier('Conducteur / Chauffeur')">
                                <div style="font-size:20px; margin-bottom:4px;">🚕</div>
                                <div style="font-weight:700; font-size:13px;">Conducteur / Pilote</div>
                                <div style="font-size:11px; color:var(--text-secondary);">GPS & Transport</div>
                            </div>
                            <div class="metier-card-widget ${metierActif === 'Agriculteur' ? 'active' : ''}" onclick="selectionnerMetier('Agriculteur')">
                                <div style="font-size:20px; margin-bottom:4px;">🌾</div>
                                <div style="font-weight:700; font-size:13px;">Agriculteur</div>
                                <div style="font-size:11px; color:var(--text-secondary);">Récoltes & Sols</div>
                            </div>
                            <div class="metier-card-widget ${metierActif === 'Artisan / Couturier' ? 'active' : ''}" onclick="selectionnerMetier('Artisan / Couturier')">
                                <div style="font-size:20px; margin-bottom:4px;">✂️</div>
                                <div style="font-weight:700; font-size:13px;">Artisan / Couturier</div>
                                <div style="font-size:11px; color:var(--text-secondary);">Devis & Matériel</div>
                            </div>
                            <div class="metier-card-widget ${metierActif === 'Étudiant / Jeune' ? 'active' : ''}" onclick="selectionnerMetier('Étudiant / Jeune')">
                                <div style="font-size:20px; margin-bottom:4px;">📚</div>
                                <div style="font-weight:700; font-size:13px;">Étudiant / Jeune</div>
                                <div style="font-size:11px; color:var(--text-secondary);">Apprentissage</div>
                            </div>
                        </div>

                        <!-- Widget Quick Route GPS -->
                        <div class="tool-card" style="border-left-color: var(--accent); margin-bottom:12px;">
                            🧭 <strong>QUICK ROUTE • GPS & ITINÉRAIRE</strong><br>
                            <span style="font-size:12px; color:var(--text-secondary);">${gpsStatus}</span><br><br>
                            <button class="btn-action" style="padding:8px; font-size:12px;" onclick="switchTab('gps')">Ouvrir le Module GPS</button>
                        </div>

                        <!-- Widget Sommaire Financier -->
                        <div class="tool-card" style="border-left-color: #3b82f6;">
                            🪙 <strong>SOMMAIRE FINANCIER & CAISSE</strong><br>
                            <div style="font-size:18px; font-weight:800; color:var(--accent); margin:4px 0;">${soldeCaisse.toLocaleString()} FCFA</div>
                            <div style="font-size:11px; color:var(--text-secondary);">Entrées : 67,500 FCFA | Sorties : 22,300 FCFA</div>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'camera') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">📸 Caméra & Analyse Intelligente (Sol & Documents)</h3>
                        <p class="text">Prenez en photo un type de sol, une culture agricole, un document ou un équipement pour que le système l'analyse.</p>
                        
                        <div class="tool-card" style="text-align:center; padding:20px; border-left-color:var(--accent);">
                            <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display:none;" onchange="handleImageCapture(event)">
                            <button class="btn-action" onclick="document.getElementById('cameraInput').click()" style="margin-bottom:12px;">📷 Prendre une Photo / Scanner</button>
                            <br><small style="color:var(--text-secondary);">Compatible caméra arrière et galerie photo.</small>
                        </div>

                        ${capturedImageSrc ? `
                            <div style="margin-top:15px; text-align:center;">
                                <h4 style="margin-bottom:8px;">🖼️ Image Capturée :</h4>
                                <img src="${capturedImageSrc}" style="max-width:100%; max-height:220px; border-radius:10px; border:1px solid var(--border-color); object-fit:cover;">
                            </div>
                        ` : ''}

                        <div class="tool-card" style="margin-top:15px; background:rgba(5,150,105,0.08);">
                            📊 <strong>Résultat de l'Analyse :</strong><br><br>
                            <span id="analysisText">${analysisResult}</span>
                        </div>
                    </div>
                `;
            } else if (activeTab === 'gps') {
                content.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">🧭 Géolocalisation & Itinéraire (Chauffeur / Navigateur)</h3>
                        <p class="text">Obtenez votre position et tracez votre route en ligne du point A vers le point B.</p>
                        <div class="tool-card">
                            📡 ${gpsStatus}<br><br>
                            <button class="btn-action" onclick="obtenirGeolocalisation()">📍 Actualiser ma Position GPS</button>
                        </div>
                        <h4 style="margin: 15px 0 8px 0;">🗺️ Destination (Point B) :</h4>
                        <div class="input-group">
                            <input type="text" id="inputDestination" class="input" placeholder="Entrer une ville ou un quartier...">
                        </div>
                        <button class="btn-action" onclick="lancerItineraireDestination()">🚀 Ouvrir l'Itinéraire Cartographique</button>
                    </div>
                `;
            } else if (activeTab === 'simulateur') {
                content.innerHTML = `<div class="card"><h3 class="card-title">🧮 Calculateurs & Outils Métiers</h3><p class="text">Outils de calculs professionnels ELAWS.</p></div>`;
            } else if (activeTab === 'stocks') {
                content.innerHTML = `<div class="card"><h3 class="card-title">📦 Stocks, Récoltes & Matériel</h3><p class="text">Gestion des stocks et récoltes.</p></div>`;
            } else if (activeTab === 'securite') {
                content.innerHTML = `<div class="card"><h3 class="card-title">🛡️ Sécurité & Chiffrement Local</h3><p class="text">Chiffrement AES-256 actif.</p></div>`;
            } else if (activeTab === 'sauvegarde') {
                content.innerHTML = `<div class="card"><h3 class="card-title">💾 Sauvegarde & Synchro Souveraine</h3><p class="text">${etatSynchro}</p></div>`;
            } else if (activeTab === 'economie') {
                content.innerHTML = `<div class="card"><h3 class="card-title">🪙 Économie & Caisse</h3><div class="score-text" style="color:var(--accent);">Solde : ${soldeCaisse.toLocaleString()} FCFA</div></div>`;
            } else if (activeTab === 'apprentissage') {
                content.innerHTML = `<div class="card"><h3 class="card-title">📚 Fiches d'Apprentissage</h3><p class="text">Modules pour jeunes et enfants.</p></div>`;
            } else if (activeTab === 'appel') {
                content.innerHTML = `<div class="card"><h3 class="card-title">📞 Appels & Traduction</h3><p class="text">Traduction vocale en langues maternelles.</p></div>`;
            } else if (activeTab === 'ia') {
                content.innerHTML = `<div class="card"><h3 class="card-title">Assistant ELAWS</h3><p class="text">Bonjour ! Je suis ELAWS.</p></div>`;
            }
        }

        function switchTab(t) { activeTab = t; document.getElementById('sideMenu').classList.remove('open'); render(); }
        render();
    </script>
</body>
</html>
